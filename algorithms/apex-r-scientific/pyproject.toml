[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-r-scientific"
version = "0.1.0"
description = "Núcleo científico auditável do framework APEX-R"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Projeto APEX-R" }]
dependencies = []

[project.optional-dependencies]
scientific = ["numpy>=1.26", "scipy>=1.12", "pydantic>=2.6"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
apex-r = "apex_r.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

