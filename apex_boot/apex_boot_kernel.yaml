      agents: 1
      fractal_depth: 0
      iterations: 1
      token_budget: 400
      analysis_versions: 1
      pmi_tools: []
      skill_synthesis: false
      chaos_spawn_eligible: false
      pot_subprocess_enabled: false
      p_target: 0.3
      special_rules:
      - Resposta prefixada com [EXPRESS_RESPONSE]
      - pmi_pm implicito (sem [PARTITION_ACTIVE] necessario)
      - escape_hatch obrigatorio (ver STEP_0.P0_express_check)
      - Audit trail em snapshot.express_log
      - Confidence cap: 80
      express_escalation_targets:
        baixa_complexidade: FAST
        media_complexidade: DEEP
        problema_numerico: SCIENTIFIC
