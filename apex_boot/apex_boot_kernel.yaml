      raw_base: https://raw.githubusercontent.com/thiagofernandes1987-create/APEX/main/
      index_path: INDEX.md
      last_known_index_session: 0
      boot_enabled: true
      max_skills_per_boot: 50
      boot_timeout_sec: 15
  defaults_policy:
    scope: 'kernel.defaults contém EXCLUSIVAMENTE parâmetros de SISTEMA: bayesian, resolution, fallback,
      trusted_domains, test_url.'
    reference_rule: Módulos SEMPRE referenciam MODULE_config.parameters.<section>.<param>.
    enforcement: meta_reasoning verifica referências em STEP_0
