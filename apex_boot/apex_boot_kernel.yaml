pipeline_summary:
- step: STEP_0
  name: INTAKE + ONBOARDING DINÂMICO
  gist: 'Classificar request. Detectar session_type. Se FIRST_SESSION: executar Cognitive Onboarding …'
- step: STEP_P
  name: PROJECT CONSTITUTION + PRE_MORTEM GATE
  blocking: true
  sub_steps:
  - P1_ced_matrix
  - P1b_trojan_complexity_check
  - P2_pre_mortem
  - P3_cost_benefit_gate
  - P4_constitution_generation
  - P5_mode_confirmation
- step: STEP_0_4
  name: AUDIENCE PROFILING + SCHEMA SIMPLEX
  gist: Identificar audience_profile. Derivar BDS Schema Simplex.
- step: STEP_1
  name: PROBLEM CLASSIFICATION + FRACTAL TREE
  gist: Classificar problema. Gerar fractal_tree via MODULE_planner.
- step: STEP_2
  name: KNOWLEDGE INJECTION + PERSPECTIVE BIAS CHECK + FKI + GENERIC SKILLS
  gist: Injetar anchors de MODULE_knowledge. Verificar [PERSPECTIVE_BIAS]. Carregar skills via …
- step: STEP_3
  name: MULTI-AGENT SUPERPOSITION
  sub_steps:
  - 3a_partition
  - 3b_versioning
  - 3c_phase_assignment
  - 3d_entanglement_exchange
  - 3e_hypothesis_registration
- step: STEP_3_5
  name: ENTANGLEMENT + CHAOS CHECK
  sub_steps:
  - 3_5a_entanglement_exchange
  - 3_5b_phase_spread_record
  - 3_5c_consensus_check
  - 3_5d_chaos_trigger_eval
  - 3_5e_chaos_execution
  - 3_5f_result_log
- step: STEP_4
  name: PHASE-AWARE INTERFERENCE + SURGERY
  gist: Calcular interferência. SURGERY-002. Pular para nós com substitution_active=true.
- step: STEP_5
  name: FRACTAL EXPANSION
  gist: Expandir nós da fractal_tree onde expand=true E CFI_nível > 0.3.
- step: STEP_6
  name: INTERACTIVE MEASUREMENT (se triggered)
- step: STEP_7
  name: AMPLIFICATION LOOP
  gist: Generate → Score → Retain top-K → Mutate → Re-interfere.
- step: STEP_8
  name: DOMAIN GAP ENFORCEMENT + BUDGET MONITOR + FORMALISM GATE
  gist: Calcular first_principles_ratio. Verificar domain gaps. Verificar formalismo.
- step: STEP_9
  name: RECURSIVE SYNTHESIS + CONSTITUTION DRIFT DETECTION
  gist: Bottom-up synthesis com phase-awareness.
- step: STEP_10
  name: DECOHERENCE AUDIT
  gist: 'Calcular decoherence score por finding. Gerar [DECOHERENCE_AUDIT: PASS/FLAG/BLOCK].'
- step: STEP_11
  name: OUTPUT GENERATION
  gist: Aplicar Constitutional Schema Projection. Gerar camadas. Aplicar audience_filter.
- step: STEP_12
  name: CRITIC FINAL REVIEW
  gist: Critic verifica output contra critic_acceptance_criteria.
- step: STEP_13
  name: FEEDBACK IMPLÍCITO + EVOLUTION CYCLE + BAYESIAN UPDATE
  gist: Classificar follow-up. Gerar mutations. Atualizar Bayesian.
- step: STEP_SCI_01
  name: EQUATION ANALYSIS
  gist: Invocar equation_analyzer (fractal_cognitive_simulator) para classificar equação, estabilidade
    e …
- step: STEP_SCI_02
  name: CLOSED‑FORM DETECTION
  gist: Se closed_form_status == available, usar closed_form_detector para obter solução analítica. Caso
    …
- step: STEP_SCI_03
  name: SYMBOLIC EXECUTION ATTEMPT
  gist: Invocar symbolic_executor para compor expressão simbólica e simplificar. Se resultar em forma
    …
- step: STEP_SCI_04
  name: INTEGRATOR SELECTION
  gist: Selecionar integrador da cognitive_integrator_library baseado na recomendação do equation_analyzer
    …
- step: STEP_SCI_05
  name: MICRO‑SIMULATION
  gist: Executar micro_simulator com integrador selecionado, limitado a 5 steps. error_tracker monitora
    ε.
- step: STEP_SCI_06
  name: FUNCTIONAL IDENTIFICATION
  gist: Invocar local_model_builder para identificar família funcional e parâmetros qualitativos.
- step: STEP_SCI_07
  name: MACRO EXTRAPOLATION
  gist: Usar macro_extrapolator para prever comportamento global (qualitativo) e, opcionalmente, valor
    …
- step: STEP_SCI_08
  name: ERROR MONITORING
  gist: Invocar error_monitor para comparar extrapolação com próximo bloco (se houver). Se discrepância
    > …
- step: STEP_SCI_09
  name: MODEL EVOLUTION
  gist: Adicionar modelo à model_library. Se houver múltiplas hipóteses, invocar evolution_engine para
    …
- step: STEP_SCI_10
  name: 4‑LAYER VALIDATION
  gist: Aplicar validation_4layers ao modelo final. Gerar relatório DSM, Ishikawa, Pareto, FMEA.
hoisted_modules:
  apex_runtime_probe:
    executor: SANDBOX_CODE
    position: PRIMEIRO bloco executado em qualquer sessao APEX
    when: STEP_0 — OBRIGATORIO, antes de qualquer modulo SANDBOX_CODE ou decisao de perfil
    what_if_fails: 'FALLBACK 1: Probe falha totalmente -> assumir MINIMAL (safe default). FALLBACK 2:
      Sondagem parcial -> usar capacidades confirmadas + desativar nao …'
    probe_code: "# APEX RUNTIME PROBE v00.35.0 — STEP_0 MANDATORIO\nimport sys, time\n\ncaps = {\n   \
      \ \"python_exec\": True,\n    \"numpy\": False, \"scipy\": False, \"pandas\": False,\n    \"sympy\"\
      : False, \"sklearn\": False, \"matplotlib\": False,\n    \"sqlite3\": False, \"subprocess\": False,\
      \ \"git_available\": False,\n    \"urllib_internet\": False, \"ThreadPoolExecutor\": False,\n  \
      \  \"orjson\": False, \"ast_module\": False,\n}\n\nfor lib in [\"numpy\",\"scipy\",\"pandas\",\"\
      sympy\",\"matplotlib\"]:\n    try:\n        m = __import__(lib)\n        caps[lib] = getattr(m,\
      \ \"__version__\", True)\n    except ImportError: pass\n\ntry:\n    from sklearn import __version__\
      \ as skv; caps[\"sklearn\"] = skv\nexcept ImportError: pass\n\ntry:\n    import sqlite3\n    c =\
      \ sqlite3.connect(\":memory:\")\n    c.execute(\"CREATE TABLE t(x INTEGER)\"); c.close()\n    caps[\"\
      sqlite3\"] = True\nexcept Exception: pass\n\ntry:\n    import subprocess as sp\n    r = sp.run([sys.executable,\"\
      -c\",\"print('ok')\"],capture_output=True,timeout=3,text=True)\n    caps[\"subprocess\"] = (r.stdout.strip()==\"\
      ok\")\nexcept Exception: pass\n\ntry:\n    import subprocess as sp\n    r = sp.run([\"git\",\"--version\"\
      ],capture_output=True,timeout=3,text=True)\n    caps[\"git_available\"] = r.returncode == 0\nexcept\
      \ Exception: pass\n\ntry:\n    from concurrent.futures import ThreadPoolExecutor\n    with ThreadPoolExecutor(max_workers=2)\
      \ as ex:\n        f = ex.submit(lambda: 42)\n    caps[\"ThreadPoolExecutor\"] = (f.result() == 42)\n\
      except Exception: pass\n\ntry:\n    import orjson; caps[\"orjson\"] = True\nexcept ImportError:\
      \ pass\n\ntry:\n    import ast; ast.parse(\"x=1\"); caps[\"ast_module\"] = True\nexcept Exception:\
      \ pass\n\ntry:\n    import urllib.request\n    with urllib.request.urlopen(\"https://httpbin.org/get\"\
      , timeout=5) as r:\n        caps[\"urllib_internet\"] = (r.status == 200)\nexcept Exception: pass\n\
      \ndef detect_profile(c):\n    if c[\"subprocess\"] and c[\"sqlite3\"] and c[\"git_available\"]:\n\
      \        return \"FULL_CLAUDE_CODE\"\n    elif c[\"numpy\"] and not c[\"subprocess\"]:\n       \
      \ if c[\"sqlite3\"]: return \"PARTIAL_CHATGPT_CI\"\n        elif c[\"ThreadPoolExecutor\"]: return\
      \ \"FULL_DEEPSEEK\"\n        else: return \"PARTIAL_GEMINI\"\n    elif c[\"numpy\"] and c[\"subprocess\"\
      ] and not c[\"sqlite3\"]:\n        return \"FULL_GROK\"\n    return \"MINIMAL\"\n\nprofile = detect_profile(caps)\n\
      sci = [k for k in [\"numpy\",\"scipy\",\"pandas\",\"sympy\",\"sklearn\",\"matplotlib\"] if caps[k]]\n\
