  new_cross_domain_bridges:
    bridge_legal_finance:
      anchor_a:
      - legal
      - compliance
      - contract_review
      anchor_b:
      - sec_edgar
      - equity_research
      - investment_banking
      strength: 0.65
      activation_formula: A(legal, finance) = tanh(2 x fw_legal x fw_finance)
      rationale: Contratos financeiros, due diligence M&A, compliance SEC.
    bridge_quantum_materials:
      anchor_a:
      - quantum_computing
      - quantum_simulation
      - statistical_physics
      anchor_b:
      - materials_science
      - molecular_dynamics
      - genomics
      strength: 0.7
      activation_formula: A(quantum, materials) = tanh(2.5 x fw_q x fw_m)
      rationale: Computação quântica para simulação molecular (VQE) e DFT.
    bridge_marketing_data:
      anchor_a:
      - seo
      - google_ads
      - meta_ads
      - campaign
      - analytics
      anchor_b:
      - data_analysis
      - sql
      - visualization
      - dashboard
      strength: 0.6
      activation_formula: A(marketing, data) = tanh(2 x fw_mkt x fw_data)
      rationale: Marketing analytics requer SQL/Python para análise de dados.
    bridge_healthcare_science:
      anchor_a:
      - healthcare
      - medicine
      - clinical_trials
      - icd10
      anchor_b:
      - genomics
      - bioinformatics
      - drug_discovery
      strength: 0.75
      activation_formula: A(health, science) = tanh(3 x fw_h x fw_s)
      rationale: Medicina clínica e ciências da vida sao naturalmente inseparáveis.
    bridge_engineering_hpc:
      anchor_a:
      - aws_cloud
      - azure_cloud
      - kubernetes
      - ci_cd
      anchor_b:
      - nasa
      - openfoam
      - simulation
      - cad
      strength: 0.45
      activation_formula: A(cloud_eng, sci_eng) = tanh(1.5 x fw_c x fw_s)
      rationale: Engenharia cloud e científica para workloads HPC.
  fmea:
    rpn: 4
    mode: Anchor bridge com peso incorreto — over/under-ativação de skills
    probability: 2
    severity: 2
    detection: 1
    mitigation: Fórmula bounded por tanh (max=1.0). Meta_reasoning audita ativações no STEP_P.
