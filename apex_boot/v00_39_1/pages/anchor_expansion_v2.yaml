anchor_expansion_v2:
executor: LLM_BEHAVIOR  # backfilled by lint_executor (SR_40)
  executor: LLM_BEHAVIOR
  version: v00.34.0
  opp: OPP-114
  tier: 1
  status: ADOPTED
  extends: OPP-107
  purpose: 'Expandir hyperbolic_anchor_map (OPP-107) com anchors e cross-domain bridges para os 12 novos
    domínios de integração: legal, quantum, marketing, healthcare, finance, engineering (NASA, CFD, CAD).
    Integra com forgeskills_catalog_boot para mapeamento domínio → CATALOG.md correto.

    '
  why: 'WHY: OPP-107 definiu 7 bridges originais. Após ingestion, 12 novos domínios ficaram sem âncoras
    no attraction_engine. Usuário pede "análise quântica" → sem âncora quantum_computing nao há bridge
    para Qiskit. Usuário pede "Google Ads" → sem anchor google_ads nao carrega integrations/marketing-mcp/CATALOG.md.

    '
  when: 'WHEN: attraction_engine.compute() no STEP_P — antes de selecionar skills ativas. WHEN: forgeskills_catalog_boot
    mapeando domínio para CATALOG.md.

    '
  what_if_fails: 'FALLBACK: Âncoras sem bridges degradam recall mas nao quebram pipeline. REGRA: Nunca
    bloquear pipeline por anchor nao resolvida.

    '
  inject_when: attraction_engine.compute() + forgeskills_catalog_boot
  depends_on:
  - hyperbolic_anchor_map
  - attraction_engine
  - forgeskills_catalog_boot
  new_anchors:
