  security_logger:
    version: v1.0.0
    opp: OPP-132
    executor: SANDBOX_CODE
    tier: CORE
    status: ACTIVE
    description: Logger estruturado com redacao automatica de PII para modulos APEX
    why: Modulos APEX sem padrao de logging expoe risco de PII no contexto do LLM
    when: 'Importado por qualquer modulo com data_access: restricted ou full'
    what_if_fails: 'Se regex PII nao captura variacao: extensivel via OPP de patch. Se json.dumps falha:
      fallback string simples — log degradado nao quebrado. Se estrutura circular em dict: depth limit
      5 previne recursao infinita.

      '
    code: "import re\nimport json\nfrom datetime import datetime\n\n_PII_PATTERNS = [\n    (re.compile(r'\\\
      b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b'), '[CPF_REDACTED]'),\n    (re.compile(r'\\b[A-Za-z0-9._%+\\\
      -]+@[A-Za-z0-9.\\-]+\\.[A-Z|a-z]{2,}\\b'), '[EMAIL_REDACTED]'),\n    (re.compile(r'(\\+55\\s?)?(\\\
      (?\\d{2}\\)?\\s?)(\\d{4,5}[\\-\\s]?\\d{4})'), '[PHONE_REDACTED]'),\n    (re.compile(r'Bearer\\s+[A-Za-z0-9\\\
      -._~+/]+=*', re.IGNORECASE), 'Bearer [TOKEN_REDACTED]'),\n    (re.compile(r'\\b\\d{4}[\\s\\-]?\\\
      d{4}[\\s\\-]?\\d{4}[\\s\\-]?\\d{4}\\b'), '[CARD_REDACTED]'),\n    (re.compile(r'\\b[A-Fa-f0-9]{40,}\\\
      b'), '[HEX_TOKEN_REDACTED]'),\n]\n\n_BLOCKED_KEYS = frozenset([\n    'password', 'senha', 'secret',\
      \ 'token', 'api_key', 'apikey',\n    'authorization', 'credential', 'private_key', 'access_token',\n\
      \    'refresh_token', 'client_secret', 'bearer'\n])\n\ndef _redact_string(text):\n    # WHY: Remover\
      \ PII de strings antes de qualquer saida de log\n    # WHEN: Chamado em toda mensagem antes de escrever\n\
      \    # HOW: Regex patterns em sequencia — mais especifico primeiro\n    # WHAT_IF_FAILS: Retornar\
      \ mensagem de supressao\n    if not isinstance(text, str):\n        return str(text)\n    try:\n\
      \        for pattern, replacement in _PII_PATTERNS:\n            text = pattern.sub(replacement,\
      \ text)\n        return text\n    except Exception:\n        return '[REDACTION_FAILED: conteudo\
      \ suprimido por seguranca]'\n\ndef _redact_dict(data, depth=0):\n    # WHY: Redacao recursiva em\
      \ dicts — APIs retornam estruturas aninhadas\n    # WHEN: Log de responses de API ou dados estruturados\n\
      \    # HOW: Recursivo ate depth 5 — previne stack overflow\n    # WHAT_IF_FAILS: Retornar erro estruturado\
      \ — nunca expor dados\n    if depth > 5:\n        return {'_truncated': 'max_depth_reached'}\n \
      \   try:\n        result = {}\n        for key, value in data.items():\n            if str(key).lower()\
      \ in _BLOCKED_KEYS:\n                result[key] = '[BLOCKED_KEY_REDACTED]'\n            elif isinstance(value,\
      \ dict):\n                result[key] = _redact_dict(value, depth + 1)\n            elif isinstance(value,\
      \ list):\n                result[key] = [\n                    _redact_dict(v, depth + 1) if isinstance(v,\
      \ dict)\n                    else _redact_string(str(v)) for v in value\n                ]\n   \
      \         elif isinstance(value, str):\n                result[key] = _redact_string(value)\n  \
      \          else:\n                result[key] = value\n        return result\n    except Exception:\n\
      \        return {'_error': 'REDACTION_ERROR — conteudo suprimido'}\n\nclass ApexLogger:\n    # WHY:\
      \ Logger unificado APEX com redacao automatica de PII\n    # WHEN: Usar em qualquer modulo APEX\
      \ com data_access restricted ou full\n    # HOW: Wrapper sobre print com timestamp, nivel e redacao\
      \ obrigatoria\n    # WHAT_IF_FAILS: Fallback para print simples se json.dumps falhar\n    # SECURITY_LEVEL:\
      \ HIGH\n\n    def __init__(self, module_id, data_access='none'):\n        self.module_id = module_id\n\
      \        self.data_access = data_access\n\n    def _format(self, level, message, data=None):\n \
      \       ts = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')\n        safe_msg = _redact_string(message)\n\
      \        entry = {'ts': ts, 'level': level, 'module': self.module_id, 'msg': safe_msg}\n       \
      \ if data is not None:\n            entry['data'] = _redact_dict(data) if isinstance(data, dict)\
      \ else _redact_string(str(data))\n        try:\n            return json.dumps(entry, ensure_ascii=False)\n\
      \        except Exception:\n            return f'{ts} [{level}] {self.module_id}: {safe_msg}'\n\n\
      \    def info(self, message, data=None):\n        print(self._format('INFO', message, data))\n\n\
      \    def warn(self, message, data=None):\n        print(self._format('WARN', message, data))\n\n\
      \    def error(self, message, data=None):\n        print(self._format('ERROR', message, data))\n\
      \n    def security(self, event, data=None):\n        # Eventos de seguranca — sempre logados independente\
      \ de nivel\n        print(self._format('SECURITY', f'[SECURITY_EVENT] {event}', data))\n\napex_log\
      \ = ApexLogger(module_id='apex.default', data_access='none')\n"
