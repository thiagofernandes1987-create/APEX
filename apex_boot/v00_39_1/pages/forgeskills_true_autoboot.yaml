forgeskills_true_autoboot:
  executor: HYBRID
  version: v00.35.0
  opp: OPP-124
  tier: 0
  status: ADOPTED
  purpose: 'Implementa o boot automatico real do ForgeSkills via INDEX.md parsing. apex_superrepo_boot
    (OPP-104) e forgeskills_rapid_reader (OPP-106) foram declarados mas nunca tiveram o bloco executavel
    que realiza o boot. Fornece o codigo Python concreto que o LLM executa em STEP_0 para carregar skills
    do repositorio real em APEX_SKILL_REGISTRY.

    '
  why: 'WHY: INDEX.md do repositorio esta acessivel (confirmado: 79.744 chars, 1.775 linhas, 225 skills
    mapeadas). O forge_method esta em APEX_SESSION_CAPS. O que faltava era o bloco de codigo que EXECUTA
    o boot — o LLM sabia que devia bootar mas nao tinha o codigo para fazer isso automaticamente. SEM
    ESTE OPP: Em toda sessao, o LLM inicia sem skills do repo. ForgeSkills so carrega quando usuario menciona
    dominio especifico e LLM lembra de fazer fetch manual. COM ESTE OPP: STEP_0 executa boot automaticamente.

    '
  when: 'WHEN: STEP_0 — apos apex_runtime_probe confirmar APEX_SESSION_CAPS. WHEN: APEX_SESSION_CAPS["forge_method"]
    IN ["urllib_fetch","git_clone"]. WHEN: Session nova (skill_registry vazio) OU dominio nao coberto.

    '
  what_if_fails: 'FALLBACK 1: urllib timeout -> continuar com skills do prompt base. FALLBACK 2: INDEX.md
    malformado -> usar domain_map embutido. FALLBACK 3: forge_method == "inline_paste" -> skip auto-boot.
    REGRA: Boot falho NUNCA bloqueia a sessao.

    '
  inject_when: STEP_0 apos apex_runtime_probe
  depends_on:
  - apex_runtime_probe
  - apex_superrepo_boot
  boot_code: "# APEX FORGESKILLS AUTOBOOT v00.35.0 — STEP_0\n# Executar apos apex_runtime_probe. Requer\
    \ APEX_SESSION_CAPS definido.\n# DeepSeek: @sandbox antes deste bloco.\n\nimport urllib.request, re\n\
    \nRAW_BASE = \"https://raw.githubusercontent.com/thiagofernandes1987-create/APEX/main/\"\nBOOT_TIMEOUT\
    \ = 15\nMAX_SKILLS_PER_BOOT = 15\n\nsession_skill_registry = {}\nboot_log = []\n\nforge_method = APEX_SESSION_CAPS.get(\"\
    forge_method\",\"inline_paste\")\n\nif forge_method in (\"urllib_fetch\",\"git_clone\"):\n    try:\n\
    \        with urllib.request.urlopen(RAW_BASE+\"INDEX.md\",timeout=BOOT_TIMEOUT) as r:\n         \
    \   index_content = r.read().decode(\"utf-8\")\n        boot_log.append(f\"INDEX.md: {len(index_content)}\
    \ chars\")\n\n        # Parse simples — nao requer PyYAML\n        skills = {}\n        current_domain\
    \ = None\n        domain_pat = re.compile(r'^  ([A-Z_]{3,}):$')\n        skill_pat   = re.compile(r'path:\\\
    s*(skills/[^\\s]+/SKILL\\.md)')\n\n        for line in index_content.splitlines():\n            dm\
    \ = domain_pat.match(line)\n            if dm:\n                current_domain = dm.group(1)\n   \
    \             if current_domain not in skills:\n                    skills[current_domain] = []\n\
    \            pm = skill_pat.search(line)\n            if pm and current_domain:\n                path\
    \ = pm.group(1)\n                if path not in [s[\"path\"] for s in skills[current_domain]]:\n \
    \                   skills[current_domain].append({\"path\": path})\n\n        total = 0\n       \
    \ for domain, skl in skills.items():\n            for sk in skl[:3]:\n                if total >=\
    \ MAX_SKILLS_PER_BOOT: break\n                session_skill_registry[sk[\"path\"]] = {\n         \
    \           \"domain\": domain, \"status\": \"PROVISIONAL\", \"path\": sk[\"path\"]\n            \
    \    }\n                total += 1\n\n        boot_log.append(f\"Skills: {total} | Domains: {len(skills)}\"\
    )\n        print(f\"[APEX_FORGESKILLS_BOOT_COMPLETE]\")\n        print(f\"  Domains: {len(skills)}\
    \ | Skills registered: {total}\")\n        print(f\"  Top domains: {list(skills.keys())[:8]}\")\n\n\
    \    except Exception as e:\n        print(f\"[APEX_FORGESKILLS_BOOT_FAILED: {e}]\")\nelse:\n    print(f\"\
    [APEX_FORGESKILLS_BOOT_SKIP: forge_method={forge_method}]\")\n\nAPEX_SKILL_REGISTRY = session_skill_registry\n\
    APEX_BOOT_LOG = boot_log\n"
  on_demand_fetch: '# Quando dominio detectado na tarefa:

    # paths = [p for p,m in APEX_SKILL_REGISTRY.items() if m["domain"] == "LEGAL"]

    # for path in paths[:2]:

