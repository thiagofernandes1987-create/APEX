  sr45_ghost_dependency_blocker:
    version: v1.0.0
    opp: OPP-128
    executor: HYBRID
    tier: CORE
    status: ACTIVE
    description: Bloqueio de OPPs com depends_on referenciando módulos inexistentes
    why: 13 ghost dependencies em v00.34.0 — prevenir reincidência (SR_45)
    when: Validado no OPPQualityBar E no apex_runtime_probe boot
    what_if_fails: 'Se defined_modules desatualizado: apex_runtime_probe recalcula em cada boot. Se módulo
      existe no repo mas não no prompt: aceito com aviso repo_only_dependency. Fuzzy match sugere nomes
      similares para erros de digitação.

      '
    code: "def check_ghost_dependencies(depends_on, defined_modules, repo_modules=None):\n    # WHY: Prevenir\
      \ OPPs com dependencias para modulos inexistentes (SR_45)\n    # WHEN: Validacao de OPP antes de\
      \ aprovacao e no boot do apex_runtime_probe\n    # HOW: Set difference entre depends_on e (defined_modules\
      \ | repo_modules)\n    # WHAT_IF_FAILS: Retornar lista de ghosts — caller bloqueia aprovacao\n \
      \   if not depends_on:\n        return {\"status\": \"OK\", \"ghosts\": [], \"repo_only\": []}\n\
      \n    all_known = set(defined_modules)\n    if repo_modules:\n        all_known |= set(repo_modules)\n\
      \n    ghosts = []\n    repo_only = []\n\n    for dep in depends_on:\n        if dep in defined_modules:\n\
      \            continue\n        elif repo_modules and dep in repo_modules:\n            repo_only.append(dep)\n\
      \        else:\n            ghosts.append(dep)\n\n    if ghosts:\n        suggestions = {}\n   \
      \     for ghost in ghosts:\n            best = None\n            best_score = 0\n            for\
      \ known in all_known:\n                s1, s2 = set(ghost), set(known)\n                score =\
      \ len(s1 & s2) / max(len(s1 | s2), 1)\n                if score > best_score and score > 0.5:\n\
      \                    best_score = score\n                    best = known\n            if best:\n\
      \                suggestions[ghost] = best\n\n        return {\n            \"status\": \"BLOCKED\"\
      ,\n            \"ghosts\": ghosts,\n            \"suggestions\": suggestions,\n            \"repo_only\"\
      : repo_only,\n            \"action\": f\"Definir modulos {ghosts} antes de aprovar este OPP\",\n\
      \            \"nota\": \"[SR_45_VIOLATION: GHOST_DEPENDENCIES_DETECTED]\"\n        }\n\n    result\
      \ = {\"status\": \"OK\", \"ghosts\": [], \"repo_only\": repo_only}\n    if repo_only:\n        result[\"\
      nota\"] = f\"[SR_45_NOTICE: {repo_only} existem no repo mas nao no prompt]\"\n    return result\n"
