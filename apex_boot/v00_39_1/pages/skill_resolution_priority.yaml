skill_resolution_priority:
  executor: LLM_BEHAVIOR
  version: v00.36.0
  opp: OPP-137
  tier: 0
  status: ADOPTED
  purpose: 'Formalizar a regra de resolucao de skills com prioridade explicita: 1) Buscar no repositorio
    GitHub oficial (online) 2) Se offline ou skill nao encontrada: sintetizar seguindo padroes APEX Corrigir
    stats desatualizados do apex_superrepo (2.752 -> 2.638, 43 -> 52 dominios). Registrar novo dominio
    engineering_agentops (OPP-136).

    '
  why: 'WHY: Boot tinha a infraestrutura (forgeskills_true_autoboot, on_demand_fetch) mas nao tinha uma
    regra LLM_BEHAVIOR explicita sobre o que fazer quando: a) O ambiente nao tem acesso a internet b)
    A skill buscada nao existe no repositorio c) O dominio nao esta mapeado no INDEX.md Sem a regra explicita,
    o LLM poderia inventar comportamento ou recusar agir. COM ESTE OPP: cadeia de prioridade clara e deterministica.

    '
  when: 'WHEN: STEP_0 -- apos forgeskills_true_autoboot. WHEN: Skill ou dominio nao encontrado no APEX_SKILL_REGISTRY.
    WHEN: Ambiente offline (forge_method == inline_paste).

    '
  what_if_fails: 'Se GitHub inacessivel: sintetizar skill/agente/diff seguindo APEX_CREATION_GUIDE.md.
    Se skill sintetizada nao atende: declarar [SYNTHESIZED: sem base no repositorio] e solicitar que o
    usuario forneça o SKILL.md relevante. NUNCA recusar agir por falta de skill no repositorio -- sempre
    sintetizar.

    '
  inject_when: STEP_0 apos forgeskills_true_autoboot
  depends_on:
  - forgeskills_true_autoboot
  - apex_superrepo_boot
  skill_resolution_chain:
    priority_1_online_fetch:
      condition: APEX_SESSION_CAPS['forge_method'] IN ['urllib_fetch', 'git_clone']
      action: 'Buscar skill em https://raw.githubusercontent.com/thiagofernandes1987-create/APEX/main/
        Ordem: INDEX.md -> path do SKILL.md -> conteudo do skill. Se encontrado: registrar como PROVISIONAL
        e usar.

        '
      marker: '[SKILL_FETCHED: {skill_id} do repositorio APEX]'
    priority_2_registry_cache:
      condition: Skill ja carregada no APEX_SKILL_REGISTRY desta sessao
      action: Usar versao cacheada sem novo fetch.
      marker: '[SKILL_CACHED: {skill_id}]'
    priority_3_prompt_base:
      condition: Skill esta embutida no system prompt (apex_v00_37_0_master_full.txt)
      action: Usar definicao do prompt. Nao requer fetch.
      marker: '[SKILL_PROMPT: {skill_id}]'
    priority_4_synthesize:
      condition: 'Skill nao encontrada em nenhuma das prioridades acima OU ambiente offline (forge_method
        == inline_paste ou MINIMAL).

        '
      action: 'SINTETIZAR skill/agente/diff/instrucao seguindo APEX_CREATION_GUIDE.md. Schema obrigatorio:
        skill_id, description, anchors, input_schema, output_schema, what_if_fails, synergy_map, security,
        tier. Qualidade minima: SkillQualityBar (6 checks) do APEX_CREATION_GUIDE.md.

        '
      marker: '[SYNTHESIZED: skill gerada por LLM -- nao existe no repositorio]'
      requirement: Declarar sempre que sintetizando -- nunca fingir que veio do repo
  apex_superrepo_stats_v00360:
