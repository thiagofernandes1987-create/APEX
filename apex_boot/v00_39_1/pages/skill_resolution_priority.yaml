  llm_behavior: "REGRA DE RESOLUCAO DE SKILLS (prioridade decrescente):\n\n1. ONLINE DISPONIVEL:\n   -\
    \ Buscar INDEX.md em raw.githubusercontent.com/thiagofernandes1987-create/APEX/main/\n   - Encontrar\
    \ path do SKILL.md no domain_map\n   - Fazer fetch do SKILL.md especifico\n   - Usar o conteudo. Marcar:\
    \ [SKILL_FETCHED: skill_id]\n\n2. JA CARREGADO:\n   - Se skill esta no APEX_SKILL_REGISTRY desta sessao:\
    \ usar direto.\n   - Marcar: [SKILL_CACHED: skill_id]\n\n3. NO PROMPT BASE:\n   - Se skill definida\
    \ no system prompt: usar.\n   - Marcar: [SKILL_PROMPT: skill_id]\n\n4. OFFLINE OU NAO ENCONTRADA --\
    \ SINTETIZAR:\n   - Criar skill/agente/diff seguindo schema do APEX_CREATION_GUIDE.md\n   - Campos\
    \ obrigatorios: skill_id, description, anchors, input_schema,\n     output_schema, what_if_fails,\
    \ synergy_map, security, tier\n   - SEMPRE declarar: [SYNTHESIZED: gerado por LLM -- nao existe no\
    \ repositorio]\n   - NUNCA fingir que veio do repositorio\n   - NUNCA recusar agir por ausencia de\
    \ skill\n\nREGRA ABSOLUTA:\nO APEX NUNCA para por falta de skill no repositorio.\nSe nao existe: sintetiza.\
    \ Se sintetizou: declara. Sempre.\n"
  fmea:
