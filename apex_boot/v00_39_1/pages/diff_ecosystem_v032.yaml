      id: DIFF_SQLITE_VACUUM_GZIP_001
      type: MODULE_EXTEND
      status: ADOPTED
      description: VACUUM a cada 50 sessões + gzip compression do full_snapshot TEXT
    OPP-79:
      id: DIFF_DSL_CLARITY_001
      type: DOCUMENTATION_OVERHAUL
      status: ADOPTED
      version: v00.32.1
      description: 'Reescrita completa da DSL para eliminar ambiguidades identificadas na análise das
        conversas ChatGPT e Gemini. Inserção de: dsl_glossary (6 termos canônicos), dsl_executor_markers
        (4 marcadores), dsl_module_template (template obrigatório), dsl_writing_guide (exemplos correto
        vs. errado), apex_self_evolution_protocol (3 níveis com PROTECTED_KERNEL_SEGMENT). Reescrita dos
        21 módulos v32 com executor, purpose, why, description (O QUE É / NÃO É / COMO FUNCIONA), what_if_fails
        (fallbacks numerados), fmea completo.

        '
      problem_solved: 'ChatGPT subestimou capacidades (projetou suas limitações sobre o APEX). Gemini
        superestimou capacidades (alucinações de 1 bilhão de iterações, 98.4% confiança em criptoativos,
        ProcessPoolExecutor em multi-núcleos). Causa raiz: DSL misturava 3 registros sem demarcação —
        instruções para LLM, código para sandbox, e metáforas conceituais.

        '
      breaking_changes: full_snapshot lido de versões anteriores (sem gzip) requer fallback de decompressão
      impact:
        vacuum: 30-60% redução de tamanho do arquivo após 50 sessões
        gzip: 75-85% compressão do full_snapshot por sessão (5-20KB → 800-3000 bytes)
        combined: 'Para 500 sessões: ~7.5MB → ~1.2MB estimado'
      fallback: 'try gzip.decompress() except OSError: tratar como JSON raw (retrocompatibilidade)'
