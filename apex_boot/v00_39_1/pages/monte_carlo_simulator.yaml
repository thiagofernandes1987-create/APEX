monte_carlo_simulator:
  executor: SANDBOX_CODE
  version: v00.32.1
  opp: OPP-73
  tier: 2
  status: ADOPTED
  purpose: 'Substituir estimativas heurísticas do LLM por distribuições de probabilidade reais. Em vez
    de "estimo 80% de chance", o sistema executa 10.000 simulações numpy e entrega P10/P50/P90 objetivos.

    '
  why: 'numpy está pré-instalado. Monte Carlo não requer modelos externos — apenas distribuições de entrada
    e uma função de output. 10.000 iterações foram calibradas como sweet spot: ICs estáveis (<1% variação
    entre runs), <500ms em numpy vetorizado. 100.000 iterações: >5s sem ganho proporcional para a maioria
    dos problemas do APEX.

    '
  description: 'Executa N simulações Monte Carlo via numpy.random.default_rng(). O QUE É: Simulação probabilística
    real com numpy — distribuições, percentis, ICs. O QUE NÃO É: Estimativa heurística do LLM disfarçada
    de simulação. O QUE NÃO É: Previsão do futuro com certeza — é distribuição de possibilidades. COMO
    FUNCIONA: LLM define model_fn e input_distributions → sandbox executa N iterações → retorna P10/P50/P90
    e interpretação via CV. INJETA NO OUTPUT: [MONTE_CARLO: n={n} | P10={p10} | P50={p50} | P90={p90}
    | cv={cv}]

    '
  what_if_fails: "FALLBACK 1 — n_valid < 0.9 * n_iterations (> 10% falhando):\n  Retornar status PARTIAL\
    \ com warning. Declarar [MONTE_CARLO_PARTIAL].\nFALLBACK 2 — model_fn lança exceção em todas as iterações:\n\
    \  Retornar status FAILED. LLM estima heuristicamente com [APPROX].\nFALLBACK 3 — numpy não disponível:\n\
    \  Pular simulação. Declarar [MONTE_CARLO_UNAVAILABLE].\n  LLM estima com [APPROX] sendo transparente\
    \ sobre a estimativa.\nREGRA: NUNCA apresentar resultados de Monte Carlo sem execução real. REGRA:\
    \ Se simulação falhar, usar [APPROX] honestamente.\n"
  inject_when: cognitive_mode == SCIENTIFIC AND variáveis com incerteza quantificável
  depends_on:
  - numpy_library
  - scipy_stats
  n_iterations_rationale:
    10000: 'Sweet spot: ICs estáveis, <500ms em numpy vetorizado — padrão'
    100000: '>5s sem ganho proporcional — evitar por padrão'
    1000: ICs instáveis — não usar para resultados apresentados ao usuário
  distributions_supported:
    normal: '{mean, std} — distribuição simétrica'
    lognormal: '{mean, sigma} — variáveis positivas com cauda longa (ex: custos)'
    beta: '{a, b} — probabilidades no intervalo [0,1]'
    uniform: '{low, high} — incerteza total'
    triangular: '{left, mode, right} — melhor/esperado/pior caso'
    fixed: '{value} — parâmetro conhecido com certeza'
  interpretation_cv:
    cv_lt_0.10: Altamente previsível — estimativas confiáveis
    cv_0.10_0.30: Moderadamente incerto — planejar para cenário realista
    cv_0.30_0.60: Alta incerteza — planejar para cenário pessimista
    cv_gt_0.60: Muito incerto — revisar premissas de entrada
  api:
  - simulate(model_fn, input_distributions, n_iterations=10000, confidence_level=0.95, seed=42) → dict{status,
    statistics, CI, risk_metrics, interpretation}
  fmea:
    rpn: 2
    mode: model_fn lança exceções em mais de 10% das iterações
    probability: 1
    severity: 2
    detection: 1
    mitigation: Contador de NaN; status PARTIAL se n_valid < 0.9 * n_total
