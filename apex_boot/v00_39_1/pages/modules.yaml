          constraints:
          - Hipotese DEVE ser falsificavel
          - Hipotese DEVE citar ao menos 1 anchor de MODULE_knowledge
          - Hipotese NAO pode ser refutacao das hipoteses existentes
          phase_offset: mean(current_phases) + π
          confidence_floor: 30
          single_version_only: true
          target_node:
            source: lpm_primary_node
            fallback: missão genérica
        evaluation_gate:
          if_confidence_gt_40:
            action: Invalidar [CONSENSUS_LOCKED]. Re-executar interferencia com pool completo.
            log: '[CHAOS_SPAWN: CONSENSUS_INVALIDATED — confidence {score}]'
          if_confidence_lte_40:
            action: Manter [CONSENSUS_LOCKED].
            log: '[CHAOS_SPAWN: CONSENSUS_CONFIRMED — confidence {score} le 40]'
      entanglement_graph:
        description: Pares de agentes com correlação epistêmica
        static_pairs:
        - pair:
          - architect
          - engineer
          type: design_implementation
          exchange_at: STEP_3_5
        - pair:
          - researcher
          - critic
          type: evidence_adversarial
          exchange_at: STEP_3_5
        - pair:
          - meta_reasoning
          - architect
          type: constitution_validation
          exchange_at: STEP_P
        - pair:
          - theorist
          - scientist_agent
          type: hypothesis_transfer
          exchange_at: STEP_SCI_01
          condition: cognitive_mode == SCIENTIFIC AND scientist_agent.active == true
        dynamic_entanglement:
          trigger: Sobreposição de domínio ≥2 anchors comuns OU semantic_similarity > 0.6
          exchange_protocol: Agente A compartilha 1 finding de alta confiança. Agente B considera mas
            mantém partição.
    inject_when: always
  engines_cognitive:
    version: v00.19.0
    tier: 0
    config:
      system_reality_note: APEX agents are simulated within a single sequential LLM context. All numerical
        outputs are structured estimates.
      ced_matrix:
        description: Cognitive Entropy-Dependency Matrix.
        dsm_parsing:
          granularity_rule: Requisito válido = qualquer dimensão que, se modificada, altera o comportamento
            de pelo menos outro requisito.
          validation:
          - 1. Parse inicial
          - 2. Reflexão — 'Quais dependências eu poderia ter perdido?'
          - 3. Cross-check com anchors do Skill Registry
          - 4. Se anchors sugerem entidades ausentes → adicionar com peso provisório
          - 5. Se CFI mudou > 0.1 após augmentação → registrar [DSM_AUGMENTED]
        vectors:
          V_volume:
            name: Volume de Entidades
            measures: Quantidade de variáveis/agentes únicos no problema
            deep_indicator: '> 7 entidades distintas'
          S_saturation:
            name: Saturação de Dependência
            measures: Densidade de acoplamento lógico
          C_conflict:
            name: Conflito de Restrições
            formula: C = Σ Conflito_ij / (N × (N-1) / 2)
          E_entropy:
            name: Entropia de Especificação
            formula: E = -Σ p(requisito_i) × log₂(p(requisito_i))
        cfi:
          base_formula: CFI = Σ Dependências_Detectadas / N_entidades²
          effective_formula: Effective_CFI = CFI × (1 - skill_coverage_rate)
          thresholds:
            lt_035: Baixa fricção cognitiva
            035_to_060: Fricção moderada
            gt_060: Alta fricção cognitiva
        problem_anchors_extraction:
          timing: Executa ao final da DSM parsing, antes do STEP_2
          output_field: problem_anchors_list
          feeds_into: MODULE_skills.radial_loading
          empty_list_fallback:
            trigger: problem_anchors_list vazia
            action:
            - 1. Identificar dominio detectado na CED-Matrix
            - 2. Carregar top-3 anchors de maior centrality_score
            - '3. Registrar [PROBLEM_ANCHORS_INFERRED: {domain}]'
      bds_difficulty_simplex:
        description: Simplex de Dificuldade Baricêntrica.
        vertices:
          E_entropy: Incerteza dos dados + ambiguidade do prompt
          D_density: Acoplamento lógico entre requisitos (CFI)
          K_knowledge: Distância entre o problema e skills ADOPTED no Registry
        normalization: wX = X_raw / (E_raw + CFI_raw + K_raw)
        dominant_vertex: Vértice com wX > 0.5
        mode_selection_map:
          EXPRESS: 'Effective_CFI < 0.05 AND wE < 0.30 AND wD < 0.20 AND V_conflict <= 0.25 (AJUSTE A)
            AND NOT contains(input_keywords, ["contrato","clausula","calcule", "simule","prove","demonstre","analise","compare","avalie",
            "implemente","defina formalmente","derive"])

            '
          FAST: Effective_CFI < 0.35 AND wE < 0.5
          CLARIFY: Effective_CFI < 0.35 AND wE ≥ 0.5
          DEEP: Effective_CFI 0.35-0.60
          RESEARCH: Effective_CFI > 0.60 AND wE < 0.5
          FOGGY: Effective_CFI > 0.60 AND wE ≥ 0.5
          SCIENTIFIC: Effective_CFI > 0.50 OR wK > 0.4 OR contains(problem_keywords, ["model", "equation",
            "simulate"])
        mode_conflict_resolution:
          SCIENTIFIC_AND_FOGGY: SCIENTIFIC prevalece; composite_confidence cap −10; emitir [DUAL_MODE_CAVEAT]
          SCIENTIFIC_AND_CLARIFY: CLARIFY executa primeiro (STEP_6 antecipado); depois pipeline SCIENTIFIC
            completo
          SCIENTIFIC_AND_FAST: SCIENTIFIC prevalece; token_budget = 12000
          EXPRESS_AND_ANY: 'EXPRESS perde para qualquer outro modo se V_conflict > 0.25 ou keywords_bloqueantes
            detectadas. Fallback: FAST.

            '
          EXPRESS_ESCALATED: 'Se escape_hatch ativado mid-response: modo escalado prevalece. Registrar
            escalation em express_log.

            '
      lpm_centrality:
        description: Logarithmic Propagation Metric
        formula: centrality_weight = log(1 + out_degree + in_degree) por anchor
        primary_node_output:
          description: O nó de maior centrality_score no grafo DSM do problema atual.
          output_field: lpm_primary_node
          consumers:
          - chaos_spawn_rule
          - fractal_tree_generator
          - scientific_engine
          fallback: 'Se DSM não produzir grafo (FAST mode): lpm_primary_node = None.'
      superposition_protocol:
        description: Cada agente gera múltiplas versões independentes com anotações de fase.
        version_count_by_mode:
          FAST: 2
          FOGGY: 2
          DEEP: 3
          RESEARCH: 3
          SCIENTIFIC: 3
          CLARIFY: 1
        version_types:
          optimistic:
            stance: Assuma condições favoráveis
            base_phase: pi/4
          pessimistic:
            stance: Assuma condições adversariais
            base_phase: 5*pi/4
          neutral:
            stance: Caso base
            base_phase: 0
        probability_constraint:
          rule: Σ P(version_i) = 1.0
          minimum_per_version: 0.2
          distribution:
            optimistic: P ≥ 0.2
            pessimistic: P ≥ 0.2
            neutral: P = 1.0 - P(optimistic) - P(pessimistic)
          default:
            optimistic: 0.33
            pessimistic: 0.33
            neutral: 0.34
          note: Probabilidades são pesos cognitivos de atenção, não frequências — [APPROX_HEURISTIC]
      interference_engine:
        phase_aware_formula: amplitude_resultante = |ψ1·e^(iφ1) + ψ2·e^(iφ2)|
        constructive: cos(Δφ) > 0.5
        destructive: cos(Δφ) < -0.5
        consensus_locked: SE ≥ 3 agentes convergem E phase_diff < 30° E confidence > 70 → [CONSENSUS_LOCKED]
        partial:
          condition: cos(Δφ) ∈ (-0.5, 0.7)
          action: Combinar findings com peso proporcional a |cos(Δφ)|
          formula: output_partial = |cos(Δφ)| × finding_A + (1 - |cos(Δφ)|) × finding_B
          label: '[PARTIAL_INTERFERENCE: cos(Δφ)={value} | weight={|cos|}]'
      precision_policy:
        rules:
        - Todos os confidence scores arredondados para o múltiplo de 5 mais próximo
        - Todos os confidence scores carregam tag [APPROX]
        - Diferenças < 10 pontos NÃO são meaningfully distintas
      calibration_ladder:
        levels:
          EMPIRICAL:
            cap: 95
            requires: dados mensuráveis + validação externa
          ANALYTICAL:
            cap: 85
            requires: raciocínio formal + anchors fortes
          INFERENTIAL:
            cap: 70
            requires: inferência de padrões + analogias documentadas
          SPECULATIVE:
            cap: 55
            requires: estimativa de primeira ordem
          UNKNOWN:
            cap: 40
            requires: domínio não coberto pelo Skill Registry
        approx_policy: 'Toda estimativa especulativa recebe [APPROX]. Toda estimativa fora do domínio
          recebe [DOMAIN_GAP: nível]'
    inject_when: always
  knowledge:
    version: v00.19.0
    tier: 0
    config:
      lazy_loading_policy:
        default: Carregar apenas anchors do domínio detectado pela CED-Matrix
        trigger_full_load: wE > 0.6 OU RESEARCH mode OU domínio desconhecido OU modo SCIENTIFIC
        macro_anchor_threshold:
          tau: 0.65
          metric: bayesian_curator.epistemic_uncertainty
          enforcement: G18
          signal: '[LAZY_ANCHOR_THRESHOLD_GUARD: macro carregado pois τ={tau} atingido]'
          when_below: usar apenas micro + meso anchors do domínio
          when_above: carregar macro do domínio + âncoras gravitacionais nível 1
      anchor_schema:
