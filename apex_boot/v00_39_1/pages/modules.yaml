        - specialization_path
      skill_pipeline_substitution:
        description: Skills ADOPTED com fitness alto podem substituir steps completos do pipeline.
        eligibility_criteria:
        - status: ADOPTED
        - quality_gate_score: 5/5
        - fitness >= 4/5 por ≥3 sessões consecutivas
        - pipeline_substitution_eligible: true
        - sub-domínio sem domain_gap ativo
        - sub-domínio sem decoherence FLAG ou BLOCK
        substitutable_steps:
          eligible:
          - STEP_3
          - STEP_4
          - STEP_5
          - STEP_SCI_03
          - STEP_SCI_04
          never_substitutable:
          - STEP_0
          - STEP_P
          - STEP_6
          - STEP_8
          - STEP_10
          - STEP_11
          - STEP_12
          - STEP_13
          - STEP_SCI_01
          - STEP_SCI_10
        substitution_protocol: 'Se skill S elegível para sub-domínio D: pular steps substituíveis; usar
          reasoning_protocol da skill; registrar substitution_savings.'
        token_savings_estimate: 200-800 tokens por sub-domínio por sessão
        degradation_guard: 'A cada 5 sessões com substituição ativa: executar 1 sessão completa para D;
          se qualidade degradou >10%: desativar.'
      quality_gate:
        description: 5 checks executados na ordem abaixo.
        checks:
          check_1_consistency:
            executor: meta_reasoning
            verifies: Contradições diretas e pressupostos implícitos contra anchors
            pass: Zero contradições + zero pressupostos sem suporte anchor
            fail_action: REJECT
          check_2_coverage:
            executor: CRITIC
            verifies: Skill resolve o gap que a motivou?
            pass: Gap identificado está dentro do reasoning_protocol
            fail_action: REJECT
          check_3_adversarial:
            executor: CRITIC
            verifies: Critic tenta refutar a skill
            pass: Critic não consegue refutar com confidence > 70
            fail_action: PROVISIONAL
          check_4_calibration:
            executor: meta_reasoning
            verifies: Confidence scores consistentes com calibration_ladder
            pass: Scores coerentes
            fail_action: WARN — skill adotada com confidence cap reduzido
          check_5_regression:
            executor: meta_reasoning via Synthetic Manifold Harness
            verifies: Skill não degrada stability
            pass: Estabilidade ≥ {manifold_stability_min_pass}/{manifold_stability_out_of} perturbações
              E delta_score ≥ -0.05
            fail_action: REJECT
        scoring:
          ADOPTED: Score ≥ 4/5 checks PASS
          PROVISIONAL: Score = 3/5 — 2-3 sessões de observação
          REJECTED: Score < 3/5 + failure_mode documentado
      synthetic_manifold_harness:
        description: Testa estabilidade Lipschitz local via 6 perturbações.
        perturbation_types:
        - 'P1 — dimensão quantitativa: valor numérico ±10%'
        - 'P2 — dimensão temporal: prazo ±20%'
        - 'P3 — dimensão regulatória: norma aplicável alternativa'
        - 'P4 — dimensão de escopo: expansão ligeira do problema'
        - 'P5 — dimensão adversarial: caso limite do domínio'
        - 'P6 — dimensão adversarial-interna: simular CRITIC_RADICAL'
        stability_criterion: Resposta consistente em >= manifold_stability_min_pass / manifold_stability_out_of
          perturbacoes
      tiered_differential_evolution:
        description: DIFFs são hipóteses experimentais — não comandos.
        routing_gate: LPM Impact_score determina o track. Threshold σ = 2.5.
        default_genome:
          diffs:
          - 'param: fractal_depth base por domínio, description: DIFF_D01, default: 1, status: ADOPTED'
          - 'param: decoherence threshold BLOCK/FLAG/PASS, description: DIFF_D02, default: 0.3, status:
            ADOPTED'
          - 'param: evolution_cycle frequency, description: DIFF_D03, default: 10, status: ADOPTED'
          - 'param: confidence cap por nível de evidência, description: DIFF_D04, default: 95, status:
            ADOPTED'
          - 'param: skill_synthesis aggressiveness, description: DIFF_D05, default: BALANCED, status:
            ADOPTED'
          - 'param: chaos_sensitivity, description: DIFF_D06, default: 0.45, range: [0.35,0.6], step:
            0.05, status: ADOPTED'
          - 'param: bayesian_inference.class_2.learning_rate, description: DIFF_BAYES_01, default: 0.05,
            range: [0.01,0.2], step: 0.01, status: ADOPTED'
          - 'param: bayesian_inference.triggers.periodic_hmc_sessions, description: DIFF_BAYES_02, default:
            30, range: [10,100], step: 5, status: ADOPTED'
          - 'param: error_tracker.delta_range, description: DIFF_ERROR_01, default: {min:0.02, max:0.05},
            range: {min: [0.01,0.03], max: [0.04,0.1]}, step: 0.01, status: ADOPTED'
          - 'param: error_tracker.threshold_stop, description: DIFF_ERROR_02, default: 0.25, range: [0.15,0.4],
            step: 0.05, status: ADOPTED'
          - 'param: mcfe.stall_detector.stall_rounds, description: DIFF_MCFE_01, default: 2, range: [1,5],
            step: 1, status: ADOPTED'
          - 'param: mcfe.stall_detector.stall_rounds, description: DIFF_MCFE_02, default: 2, range: [1,5],
            step: 1, status: ADOPTED'
          - 'param: mcfe.token_to_information_ratio.R_min, description: DIFF_MCFE_03, default: 0.05, range:
            [0.02,0.15], step: 0.01, status: ADOPTED'
          - 'param: mcfe.gear_weights, description: DIFF_MCFE_04, default: {alpha:0.5, beta:0.3, gamma:0.2},
            range: {alpha:[0.3,0.7], beta:[0.1,0.4], gamma:[0.1,0.3]}, step: 0.05, status: ADOPTED'
    inject_when: always
  symbolic_executor:
    version: v00.19.0
    tier: 1
    description: Engine de execução simbólica para recorrências e ODEs simples.
    config:
      max_complexity: 2000
    submodules:
      ast_builder:
        purpose: Constrói AST a partir de expressão.
        supported_ops:
        - add
        - sub
        - mul
        - div
        - pow
        - sin
        - cos
        - exp
        - log
        - const
        - var
        input: string (equação)
        output: ast (objeto hierárquico)
      expression_composer:
        purpose: Compõe f(f(f(x))) simbolicamente.
        method: composição recursiva com simplificação
        max_composition_depth: 10
      algebraic_simplifier:
        purpose: Simplifica expressões (expandir, fatorar, coletar termos, ordenar).
        pipeline:
        - expand
        - factor
        - collect_terms
        - rationalize_coefficients
        - canonical_term_sort
      closed_form_detector:
        purpose: Detecta se equação possui solução analítica fechada.
        source: Instância compartilhada com fractal_cognitive_simulator.equation_analyzer
        method: Consultar tabela de formas fechadas conhecidas (exp, logistic, linear, oscillatory)
        output:
          available: boolean
          solution_template: string_or_null
      symbolic_evaluator:
        purpose: Avalia numericamente a expressão final.
        method: substituição de variáveis por valores e avaliação step‑by‑step
        config:
          max_steps_evaluation: 1
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH] OR user_request
  cognitive_integrator_library:
    version: v00.19.0
    tier: 1
    description: Biblioteca de integradores numéricos adaptados ao LLM.
    integrators:
      CI_01_exponential:
        id: CI-EXP
        equation_class: exponential_growth
        formula: x_next = x * exp(a*dt)
        applicability: dx/dt = a*x
        confidence: 0.92
        complexity: 1
      CI_02_semi_analytic:
        id: CI-SEMIA
        equation_class: linear_plus_nonlinear
        formula: x_next = exp(a*dt)*x + g(x)*dt
        applicability: dx/dt = a*x + g(x)  with |ax| >> |g(x)|
        confidence: 0.85
        complexity: 3
      CI_03_local_regression:
        id: CI-LR
        equation_class: unknown_dynamics
        method: fit_local_function
        confidence: 0.6
        max_points: 5
        min_points: 4
        families:
        - linear
        - exponential
        - logistic
        - polynomial
        fallback_method: polynomial_regression_degree2
        complexity: 4
      CI_04_log_stable:
        id: CI-LOG
        equation_class: multiplicative
        transform: log
        formula: y = log(x); y_next = y + log(a); x = exp(y)
        applicability: x_{t+1} = a*x_t
        confidence: 0.9
        complexity: 2
      CI_05_block_adaptive:
        id: CI-BLOCK
        equation_class: mixed
        method: block_simulation
        confidence: 0.7
        config:
          block_size: 5
          reanalyze: true
          max_blocks: 10
        complexity: 5
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH] OR user_request
  fractal_cognitive_simulator:
    version: v00.19.0
    tier: 1
    description: 'Simulação fractal: micro‑simulação → identificação funcional → extrapolação.'
    submodules:
      equation_analyzer:
        purpose: Classifica equação (tipo, estabilidade, forma fechada, integrador recomendado).
        outputs:
        - system_type:
          - linear
          - logistic
          - oscillatory
          - stochastic
          - chaotic
        - stability:
          - stable
          - unstable
          - conditional
        - closed_form:
          - available
          - partial
          - none
        - integrator_recommended:
          - CI-01
          - CI-02
          - CI-03
          - CI-04
          - CI-05
          - euler+delegation
        - confidence: float (0-1)
        methods:
        - analyze_structure
        - check_stability
        - detect_closed_form (via closed_form_detector — instância compartilhada com symbolic_executor)
        - consult_knowledge_anchors
        fallback:
          integrator: CI-03
          confidence: 0.4
      structural_decomposer:
        purpose: Separa componente linear e não‑linear.
        method: parse_ast and split at sum of linear and nonlinear terms
      micro_simulator:
        purpose: Executa ≤5 steps com integrador selecionado.
        config:
          max_steps: 5
          error_tracker_enabled: true
        process:
        - select_integrator (from integrator_recommended, respecting confidence)
        - run_steps
        - update_error_tracker
      local_model_builder:
        purpose: Identifica família funcional e estima parâmetros qualitativos.
        method: pattern recognition on point sequence, using templates from knowledge_anchors
        outputs:
        - family: string
        - 'parameters: dict (qualitative, e.g., {rate: ~0.08 per step, asymptote: ~1.0})'
        - confidence: float
      macro_extrapolator:
        purpose: Projeta comportamento global (convergência, divergência, oscilação) e, opcionalmente,
          valores numéricos com baixa confiança.
        outputs:
        - qualitative_behavior:
          - converge
          - diverge
          - oscillate
          - chaotic
        - approximate_future_state:
            time: int
            value: float
            confidence: float
        policies:
        - valores numéricos só com confidence ≤0.6
      error_monitor:
        purpose: Compara extrapolação com próximo bloco; recalibra se discrepância >15%, delega se >40%.
        thresholds:
          recalibrate: 0.15
          delegate: 0.4
        hysteresis: 3
        actions:
        - recalibrate: re‑executar local_model_builder
        - delegate: emitir DELEGATION_NOTE
        integrate_with: error_tracker (fornece resíduos para estimativa de δ)
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH] OR user_request
  error_tracker:
    version: v00.19.0
    tier: 1
    description: Rastreamento dinâmico de erro acumulado durante iterações.
    model: ε_{t+1} = ε_t + δ * |x_t|
    config:
      epsilon_initial: 0.01
      delta_range:
        min: 0.02
        max: 0.05
      threshold_warning: 0.1
      threshold_stop: 0.25
      hysteresis: 3
    behavior:
      on_warning: reduzir steps ou alertar
      on_stop: DELEGATION_NOTE
    methods:
      estimate_delta_from_residuals:
        description: Estima δ a partir de resíduos de simulações anteriores (fornecidos pelo error_monitor).
        input: list of residuals (absolute errors)
        output: delta_estimate = min(max(median(residuals) * 0.1, delta_range.min), delta_range.max)
      update_epsilon:
        formula: ε_next = ε_current + δ_estimated * |x_current|
    inject_when: always
  scientific_engine:
    version: v00.19.0
    tier: 1
    description: Orquestra a geração, evolução e inferência de modelos matemáticos.
    submodules:
      hypothesis_engine:
        purpose: Gera hipóteses (equações) a partir de domínio.
        config:
          initial_population: 5
          max_population: 12
        methods:
        - generate_by_domain
        - mutate_from_existing
      evolution_engine:
        purpose: Aplica operadores genéticos (mutação, recombinação) a modelos.
        operators:
        - add_term
        - remove_term
        - change_operator
        - substitute_function
        - linearize_around
        - add_stochastic_term
        - scale_parameter
        selection:
          method: tournament
          population_size: 8
      model_library:
        description: Biblioteca persistente de modelos validados. Referencia e estende MODULE_knowledge.
        storage: snapshot.scientific_state.model_library
        index_by:
        - domain_tags
        - equation_class
        - fit_confidence
      scientific_graph:
        description: Grafo de relações entre hipóteses, modelos e evidências. Referencia MODULE_knowledge.
        storage: snapshot.scientific_state.scientific_graph
        node_types:
        - hypothesis
        - model
        - evidence
        - equation
    config:
      max_hypotheses: 10
      evolution_population: 8
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH] OR user_request
  validation_4layers:
    version: v00.19.0
    tier: 2
    description: Validação estruturada de modelos usando DSM, Ishikawa, Pareto, FMEA.
    layers:
      dsm:
        purpose: Análise de dependências entre componentes do modelo.
        outputs:
        - dependency_matrix
        - critical_nodes
      ishikawa:
        purpose: Identificação de causas raiz de falhas.
        categories:
        - THEORY
        - MODELING
        - NUMERICS
        - DATA
        - HUMAN
        - PROCESS
        outputs:
        - cause_effect_diagram
        - root_causes
      pareto:
        purpose: Priorização dos fatores que mais impactam o erro.
        method: 80/20 rule
        outputs:
        - ranked_issues
        - top_issues
      fmea:
        purpose: Análise de modos de falha, efeitos e criticidade (RPN).
        inputs:
        - failure_modes
        outputs:
        - rpn_table
        - recommended_mitigations
        - acceptance_flag:
          - PASS
          - FLAG
          - BLOCK
    integration:
    - ishikawa_causes -> pareto_ranking -> fmea_analysis
    inject_when: validation_needed OR cognitive_mode IN [SCIENTIFIC, RESEARCH]
  skill_registry:
    version: v00.19.0
    tier: 1
    description: 'Registro central de skills com metadados de fitness, histórico de uso e índice de busca.
      Fonte de verdade para skill_matcher e attraction_engine.

      '
    config:
      storage: snapshot.skill_registry_state
      index_fields:
      - skill_id
      - domain_tags
      - anchors
      - status
      - fitness_scores
      - centrality_impact
      fitness_tracking:
        window: 5
        decay: 0.9
      search_methods:
        by_domain: Filtrar por domain_tags com jaccard ≥ 0.4
        by_anchor: Filtrar por sobreposição de anchors ≥ 2
        by_status: Filtrar por status [ADOPTED, CERTIFIED, PROVISIONAL]
      registry_operations:
        register: Adicionar skill com status LOCAL_DRAFT
        update_fitness: Atualizar fitness_scores após cada sessão de uso
        promote: Avançar status via lifecycle (PROVISIONAL → CANDIDATE → CERTIFIED → ADOPTED)
        deprecate: Marcar skill como OBSOLETE após 10 sessões sem uso
      persistence:
        save_to: snapshot.skill_registry_state
        load_from: snapshot.skill_registry_state
        cold_start: 'Se snapshot.skill_registry_state vazio: inicializar com skills do tiered_differential_evolution.default_genome'
    outputs:
    - skill_list
    - fitness_report
    dependencies:
    - MODULE_versioning
    - MODULE_skills
    inject_when: always
  skill_matcher:
    version: v00.19.0
    tier: 1
    description: 'Motor de correspondência semântica entre problema ativo e skills no registry. Retorna
      candidatos ranqueados para a attraction_engine.

      '
    config:
      matching_algorithm:
        primary: Jaccard similarity entre problem_anchors e skill.anchors
        secondary: Cosine similarity entre domain_tags
        weight:
          primary: 0.7
          secondary: 0.3
      match_threshold: 0.35
      top_k_candidates: 5
      min_status_required: PROVISIONAL
    methods:
      find_matches:
        input:
        - problem_anchors
        - domain_tags
        - cognitive_mode
        output:
        - ranked_skill_candidates
        process:
        - 1. Consultar skill_registry.search_methods.by_anchor
        - 2. Calcular primary_score (Jaccard) para cada candidato
        - 3. Calcular secondary_score (domain cosine) para cada candidato
        - 4. final_score = 0.7 * primary + 0.3 * secondary
        - 5. Filtrar por match_threshold
        - 6. Retornar top_k ordenados por final_score
      find_pipeline_matches:
        description: 'Para scenario_12: encontrar skills que formam pipeline complementar'
        input:
        - problem_description
        output:
        - skill_pipeline_candidates
        process:
        - 1. Extrair keywords do problema
        - 2. Buscar skills com domain_tags matching
        - 3. Verificar compatibilidade (anchors compartilhados ≥ 1)
        - 4. Propor sequências de encadeamento via attraction_engine
    outputs:
    - ranked_skill_candidates
    - skill_pipeline_candidates
    dependencies:
    - MODULE_skill_registry
    - MODULE_knowledge
    inject_when: cognitive_mode IN [SCIENTIFIC, DEEP, RESEARCH] OR skill_synthesis_triggered
  attraction_engine:
    version: v00.19.0
    tier: 1
    description: 'Motor de atração gravitacional entre skills. Constrói pipelines dinâmicos baseados em
      sobreposição de âncoras e fitness histórico.

      '
    config:
      attraction_formula: A(s1, s2) = tanh(overlap_anchors(s1,s2) * fitness_weight(s1) * fitness_weight(s2))
      pipeline_threshold: 0.45
      max_pipeline_length: 4
      fitness_weight:
        formula: fw = mean(skill.fitness_scores[-3:]) / 5.0
        fallback_new_skill: 0.5
    methods:
      compute_attraction:
        input:
        - skill_a
        - skill_b
        output: attraction_score (float 0..1)
        process:
        - 1. Calcular overlap = |anchors_a ∩ anchors_b| / |anchors_a ∪ anchors_b|
        - 2. Calcular fw_a = fitness_weight(skill_a)
        - 3. Calcular fw_b = fitness_weight(skill_b)
        - 4. A = tanh(overlap * fw_a * fw_b)
      propose_pipeline:
        input:
        - skill_candidates
        output:
        - ordered_skill_pipeline
        - pipeline_coherence_score
        process:
        - 1. Calcular pairwise attraction_matrix para todos os candidatos
        - 2. Selecionar par com maior atração como âncora do pipeline
        - 3. Expandir greedy adicionando skill com maior atração ao pipeline atual
        - 4. Parar quando pipeline_length >= max_pipeline_length OU attraction < threshold
        - 5. Calcular pipeline_coherence = geometric_mean(pairwise attractions)
        - 6. Emitir evento SKILL_ATTRACTED se pipeline_coherence > 0.6
      suggest_chaining:
        description: 'Para scenario_12: sugerir encadeamento logistic_growth + seasonal_perturbation'
        output: '[SKILL_PIPELINE_PROPOSED: {skills} | coherence: {score}]'
    outputs:
    - skill_pipeline
    - pipeline_coherence_score
    dependencies:
    - MODULE_skill_matcher
    - MODULE_skill_registry
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH] OR skill_synthesis_triggered
  strategy_library:
    version: v00.19.0
    tier: 1
    description: 'Biblioteca de meta-estratégias de descoberta científica acumuladas entre sessões. Implementa
      o princípio meta_science do kernel.

      '
    config:
      storage: snapshot.scientific_state.strategy_library
      strategy_schema:
        strategy_id: string
        domain_tags: list
        problem_pattern: string (descrição do tipo de problema)
        approach: string (sequência de steps/módulos bem-sucedidos)
        success_rate: float
        session_count: integer
        last_used_session: integer
        confidence: float [APPROX]
      operations:
        record_strategy:
          trigger: Ao final de sessão SCIENTIFIC com acceptance_flag == PASS
          action: Serializar sequência de steps executados + módulos ativados + parâmetros
        retrieve_strategy:
          trigger: No STEP_P quando cognitive_mode == SCIENTIFIC
          action: Buscar estratégias com domain_tags ∩ problem_anchors > 0 E success_rate > 0.7
          output: '[STRATEGY_RETRIEVED: {id} | domain: {domain} | confidence: {score}]'
        prune_strategies:
          trigger: Snapshot compression
          action: Remover estratégias com success_rate < 0.4 E last_used_session < current − 20
      meta_learning_integration:
        agent: meta_learning_agent
        trigger: A cada 10 sessões SCIENTIFIC
        action: Analisar strategy_library; identificar padrões; propor DIFF se abordagem recorrente
    outputs:
    - strategy_recommendations
    dependencies:
    - MODULE_versioning
    - MODULE_scientific_engine
    inject_when: cognitive_mode IN [SCIENTIFIC, RESEARCH]
  output:
    version: v00.19.0
    tier: 3
    config:
      adaptive_layers:
        layer_1_executive:
          always_present: true
          format: '5-7 linhas: decisão recomendada + confidence band + top 3 riscos'
        layer_2_findings:
          default_when: Effective_CFI ≥ 0.35
          format: Índice por tema
        layer_3_technical:
          default_when: Effective_CFI > 0.60 OR cognitive_mode IN [SCIENTIFIC, RESEARCH]
          format: Confidence chains, phase assignments, hypothesis survival, simulation results, validation
            reports
      cognitive_audit_section:
        name: COGNITIVE_AUDIT
        always_generated: true
        content:
          barycentric_coordinate: '{wE, wD, wK} [APPROX]'
          dominant_vertex: E|D|K + descrição da causa
          effective_cfi: float [APPROX] + label
          mode_selected: FAST|CLARIFY|DEEP|RESEARCH|FOGGY|SCIENTIFIC
          skill_coverage: domínio + coverage_rate + validation_type
          constitution_status: CLEAR|GOAL_MISFRAMING|SCOPE_ERROR|ASSUMPTION_DEPENDENCY
        v014_fields:
          formalism_gate_summary: claims que receberam [CONJECTURA_FORMAL]
          substitution_summary: tokens economizados por sub-domínio
          snapshot_compression_applied: boolean
          selective_cache_summary: sub-domínios que usaram cache seletivo
        v015_fields:
          mcfe_summary:
            H_cognitive_initial: float [APPROX_HEURISTIC]
            H_cognitive_final: float [APPROX_HEURISTIC]
            gear_trajectory: list de {step, gear, motivo}
            early_exit_triggered: boolean
            early_exit_at: step
            collapse_triggered: boolean
            anchor_destroyer_triggered: boolean
            R_t_history: list
            tokens_saved_estimate: integer
        v018_fields:
          scientific_summary:
            symbolic_execution_used: boolean
            closed_form_found: boolean
            integrator_used: string
            fractal_simulation_performed: boolean
            extrapolation_quality: string
            error_tracker_final: float
            validation_layers:
              dsm: object
              ishikawa: object
              pareto: object
              fmea: object
        v019_fields:
          skill_attraction_summary:
            pipelines_proposed: integer
            pipelines_adopted: integer
            attraction_events: list
          strategy_library_hits: integer
          mode_conflict_applied: string_or_null
          bugs_fixed_note: v00.19.0 — 15 bugs corrigidos (5C+5H+5G). Ver changelog.
      output_protocol:
        audience_filter: audience_profile atua como FILTRO ATIVO
        confidence_display_rules:
          senior_engineer: numérico com [APPROX], phase annotation em graus
          CTO_executive: banda apenas
          engineering_team: banda apenas com confiança no nível de tarefa
          investor_board: nível de risco apenas
          product_manager: banda apenas com enquadramento de impacto
    inject_when: always
  mcfe:
    version: v00.19.0
    tier: 0
    description: Meta‑Controlador de Fluxo de Entropia.
    config:
      enabled: true
      evaluation_points:
      - STEP_3
      - STEP_5
      - STEP_7
      - STEP_SCI_05
      - STEP_SCI_08
      commands:
      - CONTINUE
      - CHANGE_GEAR
      - JUMP_TO_STEP_9
      - INJECT_ANCHOR_DESTROYER
      - COLLAPSE_EXPANSION
      - SPAWN_SCIENTIFIC
      compute_entropy_cognitive:
        formula: H_cognitive = α·H_conf + β·H_phase + γ·H_surv
        weights_source: MODULE_config.parameters.tiered_differential_evolution.DIFF_MCFE_04.default
        weights_default:
          alpha: 0.5
          beta: 0.3
          gamma: 0.2
        components:
          H_confidence:
            source: composite_confidence_summary.hypotheses_active
            formula: 'se n≤1: 0; else p_i=c_i/Σc_j; H_raw=-Σp_i log2(p_i); H_conf=H_raw/log2(n)'
          H_phase:
            source: phase_offsets dos agentes ativos
            formula: phase_spread = max(phases)-min(phases); H_phase = min(1, phase_spread/π)
          H_survival:
            source: advanced.hypothesis_tracker
            formula: n_active / n_initial
      decision_table:
        H_low:
          range: 0.00..0.25 exclusive
          action: JUMP_TO_STEP_9
        H_medium:
          range: 0.25..0.60 exclusive
          action: CONTINUE
        H_high:
          range: 0.60..1.00 inclusive
          action: CHANGE_GEAR
      token_to_information_ratio:
        formula: R_t = ΔConf_estimated / ΔTokens_estimated
        collapse_trigger:
          R_min_source: MODULE_config.parameters.tiered_differential_evolution.DIFF_MCFE_03.default
          R_min_default: 0.05
          steps: 2
      gear_system:
        gears:
          gear_1:
            eligible_when: H_cognitive < 0.25 AND wD ≤ 0.5
          gear_2:
            eligible_when: 0.25 ≤ H_cognitive < 0.60 OR (H_cognitive < 0.25 AND wD > 0.5)
          gear_3:
            eligible_when: H_cognitive ≥ 0.60
        gear_override_density:
          rule: Se wD > 0.5 → Gear 1 bloqueado
      stall_detector:
        stall_condition:
          rule: variance(confidence_scores) < 5% AND ∇H ≈ 0 por {DIFF_MCFE_02} rounds
          N_source: MODULE_config.parameters.tiered_differential_evolution.DIFF_MCFE_02.default
          N_default: 2
        on_stall_or_drift:
          action: INJECT_ANCHOR_DESTROYER
      mcfe_state:
        fields:
          gear_current:
          - gear_1
          - gear_2
          - gear_3
          gear_history: list
          h_history: list
          r_history: list
          stall_counter: int
          early_exit_triggered: boolean
          early_exit_at_step: string
          collapse_triggered: boolean
          anchor_destroyer_activations: int
          efficiency_log:
            tokens_saved_estimate: int
            confidence_final: float
          r_calibration:
            FAST: float
            DEEP: float
            RESEARCH: float
            SCIENTIFIC: float
            CLARIFY: float
    inject_when: always
  anchor_destroyer:
    version: v00.19.0
    tier: 1
    description: Subtipo de emergency_agent. Identifica e invalida âncora causando loop cognitivo.
    spawn_condition: MCFE emite INJECT_ANCHOR_DESTROYER
    agent_spec:
      role: Anchor Destroyer
      alias: ANCHOR_DESTROYER
      phase_offset: mean(current_phases) + π/2
      phase_affinity: pessimistic
      token_budget_max: 400
      single_use: true
      mission: '[PARTITION_ACTIVE: ANCHOR_DESTROYER] Identificar qual premissa-âncora está travando o
        sistema.'
      output_format:
        required:
        - '[ANCHOR_INVALIDATED: {id} | evidence_level: {nível} | reason: {motivo}]'
        - 'anchor_substitute: {id} OR [ANCHOR_GAP]'
        - '[ANCHOR_DESTROYER: DONE | tokens_used: {est}]'
      lifecycle:
        scope: execução única imediata
        does_not_count_toward: max_new_per_session
        registers_in_snapshot: anchor_destroyer_log
        post_execution: meta_reasoning re-inicia raciocínio do step atual com anchor invalidada
    inject_when: mcfe_command == INJECT_ANCHOR_DESTROYER
  mcp_bridge:
    version: v00.19.0
    tier: 1
    inject_when: never
    description: Bridge for MCP tool invocation (placeholder, desabilitado).
    config:
      enabled: false
      tools: []
    activation_roadmap:
      status: placeholder
      activation_condition: MODULE_marketplace.status == IMPLEMENTED AND user_request
      activation_diff: DIFF_MCP_01
      estimated_phase: após marketplace público
      steps_to_activate:
      - 1. Definir tools[] com schemas MCP reais
      - 2. Mudar enabled: true
      - 3. Mudar inject_when: user_request OR mcp_tool_needed
      - 4. Executar T07 cenário de teste
