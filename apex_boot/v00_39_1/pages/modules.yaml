          enabled: true
          description: Cache por sub‑domínio individualmente avaliado.
          granularity: sub_domain
          rules:
          - Sub‑domínio com skill ADOPTED fitness 5/5 E sem mudança em diff_ecosystem nas últimas 3 sessões
            → elegível para cache
          - Sub‑domínio com domain_gap ativo → NUNCA usar cache
          - Sub‑domínio com decoherence FLAG ou BLOCK → NUNCA usar cache
          - Sub‑domínio novo (<3 sessões) → NUNCA usar cache
          cache_hit_action: 'Se sub‑domínio D é cache-hit: pular STEP_3 e STEP_4 apenas para nós de D;
            registrar selective_cache_summary.'
