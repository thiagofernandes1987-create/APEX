          - Tight_Coupling
        - id: logistic_growth
          category: equation_template
          domain_tags:
          - biology
          - ecology
          - economics
          confidence: 98
          equation_formal: dx/dt = r*x*(1-x/K)
          ast:
            op: mul
            args:
            - r
            - x
            - op: sub
              args:
              - 1
              - op: div
                args:
                - x
                - K
          parameters:
            r:
              type: float
              constraint: '>0'
            K:
              type: float
              constraint: '>0'
          known_behaviors:
          - stable equilibrium at x=K
          - unstable at x=0
          fmea_guards:
          - K > 0
          - x0 > 0
          pot_template: logistic_growth.pot
          usage_count: 12
