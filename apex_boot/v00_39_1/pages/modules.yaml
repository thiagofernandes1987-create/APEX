modules:
executor: LLM_BEHAVIOR  # backfilled by lint_executor (SR_40)
  config:
    version: v00.19.0
    tier: 0
    description: Central configuration management for APEX.
    parameters:
      amplification:
        N_candidates:
          FAST: 4
          DEEP: 6
          RESEARCH: 6
          FOGGY: 4
          SCIENTIFIC: 6
          CLARIFY: 2
        K_retain:
          FAST: 2
          DEEP: 3
          RESEARCH: 3
          FOGGY: 2
          SCIENTIFIC: 3
          CLARIFY: 1
        iterations:
          FAST: 1
          DEEP: 2
          RESEARCH: 4
          FOGGY: 1
          SCIENTIFIC: 3
          CLARIFY: 1
        budget_abort_threshold_pct: 15
      interference:
        constructive_threshold: 0.7
        destructive_threshold: 0.3
        theta_values_deg:
        - 0
        - 45
        - 90
        - 135
        - 180
        minimum_meaningful_delta: 10
        phase_resolution:
          FAST: coarse_90deg
          DEEP: medium_45deg
          RESEARCH: fine_22deg
          FOGGY: coarse_90deg
          SCIENTIFIC: fine_22deg
          CLARIFY: coarse_90deg
      confidence:
        LOW_COMPOSITE_threshold: 55
        round_to_nearest: 5
        tag_required: '[APPROX]'
        band_HIGH:
        - 75
        - 100
        band_MEDIUM:
        - 50
        - 74
        band_LOW:
        - 0
        - 49
        calibration_caps:
          measured_data: 95
          validated_pattern: 85
          strong_analogy: 75
          first_principles: 65
          speculation: 45
          domain_extension_unvalidated: 60
      fractal:
        max_depth:
          FAST: 1
          DEEP: 2
          RESEARCH: 3
          FOGGY: 1
          SCIENTIFIC: 3
          CLARIFY: 1
        meso_trigger_confidence_below: 65
        micro_trigger_confidence_below: 60
        self_similarity_threshold: 0.75
        budget_gate_pct: 0.75
        cross_domain_similarity_threshold: 0.7
      agents:
        count:
          FAST: 5
          DEEP: 8
          RESEARCH: 12
          FOGGY: 5
          SCIENTIFIC: 8
          CLARIFY: 3
        max_factory_spawned_per_session: 3
        max_total: 15
        partition_breach_rate_penalty_above: 30
        analysis_versions:
          FAST: 2
          DEEP: 3
          RESEARCH: 3
          FOGGY: 2
          SCIENTIFIC: 3
          CLARIFY: 1
      token_budgets:
        FAST: 6500
        DEEP: 8000
        RESEARCH: 15000
        FOGGY: 5500
        SCIENTIFIC: 12000
        CLARIFY: 3500
        pre_mortem_gate: 150
        pmi_scoping_fast: 300
        pmi_scoping_full: 600
        skill_synthesis_max: 400
        section_increase_cap_pct: 2
      skills:
        quality_gate_min_score: 4
        quality_gate_checks: 5
        provisional_to_candidate_sessions: 1
        candidate_to_certified_sessions: 3
        certified_min_fitness: 80
        adversarial_refute_threshold: 70
        first_principles_overuse_threshold_pct: 40
        manifold_stability_min_pass: 4
        manifold_stability_out_of: 6
      pmi_pm:
        pareto_focus_areas: 3
        dsm_max_agents: 8
        ishikawa_categories: 6
        binomial_spawn_threshold: 0.6
        swot_items_per_quadrant: 3
        fast_mode_tools:
        - pareto
        - binomial
      knowledge:
        max_anchors_per_agent: 5
        injection_scoring_weights:
          domain_match: 0.4
          confidence: 0.25
          recency_modifier: 0.2
          usage_success: 0.15
        cache_max_age_days: 7
        cache_min_similarity: 0.92
        new_anchor_min_confidence: 70
        outdated_threshold_years: 5
      evolution:
        auto_apply_enabled: false
        max_diffs_per_session: 3
        rollback_history_depth: 5
        diff_review_gate_blocking: true
        regression_revert_sessions: 2
      agent_weights:
        pmi_pm: 0.25
        architect: 0.2
        researcher: 0.15
        theorist: 0.1
        engineer: 0.15
        critic: 0.1
        meta_reasoning: 0.05
        factory_spawned: inherits_parent_weight
        _note: Soma base = 1.00 (0.25+0.20+0.15+0.10+0.15+0.10+0.05). factory_spawned herda peso do agente-pai.
      chaos_spawn:
        cfi_threshold_default: 0.45
        confidence_floor: 30
        confidence_gate: 40
        max_rounds_default: 1
        gate_schedule:
          round_1: 30
          round_2: 40
          round_3: 55
        convergence_velocity_threshold_high: 0.5
        convergence_velocity_cfi_reduction: 0.05
        adopted_with_chaos_caveat:
          status_name: ADOPTED_WITH_CHAOS_CAVEAT
          parent_status: ADOPTED
          description: Skill passou nos criterios ADOPTED mas falhou em P6.
          automatic_action: Adicionar adversarial_anchor automatico baseado no target_anchor que P6 usou.
          resolution: Passar em P6 em sessao futura → status promovido para ADOPTED puro.
      radial_loading:
        relevance_threshold: 0.4
        top_k_formula: max(5, ceil(Effective_CFI * 10))
        top_k_floor: 5
        top_k_cap: 10
        primary_weight: 0.7
        secondary_weight: 0.3
        gravitational_expansion_weight: 0.5
        max_expanded_pool: 15
        serendipity_threshold: 0.25
        serendipity_trigger: wE > 0.5
        top_k_clarify_floor:
          condition: Eff_CFI < 0.1
          top_k: 3
      anchor_recency:
        decay_horizon_sessions: 50
        recency_weight_floor: 0.5
        formula: max(0.5, 1.0 - (current_session - last_activation_session) / 50)
      radial_feedback:
        positive_delta: 0.02
        negative_delta: -0.01
        usage_success_rate_cap: 1.0
        usage_success_rate_floor: 0.0
        snapshot_retention_max: 10
      snapshot_compression:
        sqlite_mode_active: Quando sqlite_snapshot_store.active == true, este bloco é BYPASSED.
        sqlite_mode_behavior: 'Com SQLite ativo, o context window recebe apenas o delta (~200-500 tokens)
          via sqlite_store.load_delta_for_session(). As compression_rules abaixo NÃO se aplicam ao delta
          — aplicam-se apenas ao full_snapshot no banco SQLite. O max_snapshot_tokens reflete o delta
          máximo no context window (não o snapshot completo).

          '
        enabled: true
        sqlite_active_enabled: false
        max_snapshot_tokens: 500
        max_snapshot_tokens_legacy_mode: 3000
        compression_trigger_sessions: 10
        compression_applies_when: sqlite_snapshot_store.active == false
        compression_rules:
          bayesian_posteriors: manter apenas últimas 10 entradas por classe
          resolution_cache: manter apenas entradas com omega_score > 0.6
          diff_ecosystem: arquivar DIFFs OBSOLETE após 5 sessões sem referência
          high_decoherence_areas: remover nós com decoherence_score < 0.3 por 3 sessões consecutivas
          lpm_primary_node_history: manter apenas últimas 10 entradas
          chaos_spawn_log: manter apenas últimas 5 entradas
      trojan_detections:
        type: list
        max_entries: 20
        description: 'Historico de deteccoes Trojan para calibracao do threshold. confirmed=true/false
          alimenta auto-calibracao via meta_learning_agent.

          '
        calibration_trigger: 'confirmed_rate < 60% -> DIFF aumentando threshold em 0.05. confirmed_rate
          > 90% -> DIFF reduzindo threshold em 0.05.

          '
      chaos_seeds_schema:
        type: list
        max_entries: 9
        description: 'Seeds de sessoes anteriores com rounds_remaining > 0 e sem rejection_log completo.
          Max 9 = 3 seeds x 3 sessoes de vida.

          '
        compression_rule: "Descartar se session_age > 3 OU rejection_log completo (AJUSTE C). FIFO por\
          \ session_age descendente quando max_entries atingido. express_log: manter apenas últimas 20\
          \ entradas (FIFO) chaos_seeds: >\n  Descartar seeds com session_age > 3 OU rejection_log completo\n\
          \  (todos os agentes base rejeitaram em todas as rodadas — AJUSTE C).\n  Manter max 9 seeds\
          \ (FIFO por session_age descendente).\n  Compressao executada antes de salvar snapshot no STEP_13.\n\
          scientific_state: >\n  manter modelos com score > 0.6 OU (score > 0.4 E last_used_session >=\
          \ current_session - 5)\n"
        compression_instruction: 'A cada compression_trigger_sessions sessões: aplicar regras na ordem
          listada.'
        hard_cap_action: 'LEGACY (sem SQLite): Se delta > max_snapshot_tokens_legacy_mode*1.5, forçar
          compressão imediata antes do STEP_1. COM SQLite ativo: verificar delta > 500 tokens e truncar
          por ΔH antes de injetar no context window.'
      chaos_seed_bank:
        max_seeds: 3
        rounds_remaining_initial: 2
        decay_per_round: 1
        min_confidence_to_seed: 20
        label_required: '[CHAOS_SEED]'
        seed_schema:
          seed_id: str
          content: str
          phase: float
          source_step: str
          confidence_floor: float
          rounds_remaining: int
          rejection_log: list
          accepted_by: list
        prohibited_as_final: true
        prohibited_blocking_consensus: true
        note: 'Seeds sao ancoras adversariais. Estimulam divergencia mas nunca determinam output. Precisam
          de >= 2 validacoes de agentes base para entrar na sintese principal.

          '
      express_mode:
        cfi_threshold: 0.05
        we_threshold: 0.3
        wd_threshold: 0.2
        v_conflict_threshold: 0.25
        escalation_rate_warning: 0.15
        auto_calibration: 'Se escalation_rate > 15% nas ultimas 20 sessoes EXPRESS, meta_learning_agent
          propoe DIFF reduzindo cfi_threshold em 0.01.

          '
      reliability:
        P_target:
          FOGGY: 0.4
          FAST: 0.5
          CLARIFY: 0.6
          DEEP: 0.7
          RESEARCH: 0.8
          SCIENTIFIC: 0.85
        initial_global_p: 0.03
        min_samples_per_bucket: 5
        error_correlation_coeff: 0.5
        enable_temporal_correlation: true
        warning_threshold: 0.5
        critical_threshold: 0.3
        rollback_trigger: 'Se global_p > 0.055 em 2 sessões consecutivas no modo SCIENTIFIC, diff_governance
          propõe reversão de P_target.SCIENTIFIC para 0.90.

          '
    inject_when: always
  event_bus:
    version: v00.19.0
    tier: 1
    executor: LLM_BEHAVIOR
    opp_patch: OPP-122
    description: Event bus for decoupled communication between modules.
    what_if_fails: 'FALLBACK 1 — Runtime MINIMAL: substituir publicacao de eventos por chamadas diretas
      entre modulos. Ordem: pmi_pm -> architect -> engineer -> critic -> meta_reasoning. Declarar [EVENT_BUS_DEGRADED:
      direct_calls]. FALLBACK 2 — Subscriber nao registrado: ignorar evento silenciosamente. FALLBACK
      3 — > 100 eventos pendentes: descartar mais antigos (FIFO). Logar [EVENT_BUS_OVERFLOW]. REGRA: Falha
      no event_bus NUNCA bloqueia a pipeline principal.

      '
    resilience_mode:
      FULL: Python dict in-process — eventos sao chamadas de funcao
      PARTIAL: Simulated — LLM mantem log de eventos em context
      MINIMAL: Direct calls — modulos chamados em sequencia sem mediacao
    events:
    - STEP_0_START .. STEP_13_END (todos os steps)
    - BAYESIAN_UPDATE_START, BAYESIAN_UPDATE_END
    - RESOLUTION_NEEDED, RESOLUTION_COMPLETE
    - FALLBACK_SEMANTIC_ACTIVATED
    - FORMALISM_GATE_TRIGGERED
    - SNAPSHOT_COMPRESSED
    - SKILL_PIPELINE_SUBSTITUTION
    - MCFE_ENTROPY_COMPUTED, MCFE_GEAR_CHANGED, MCFE_EARLY_EXIT, MCFE_STALL_DETECTED, MCFE_COLLAPSE_EXPANSION
    - SYMBOLIC_EXECUTION_COMPLETED
    - INTEGRATOR_SELECTED
    - MICRO_SIMULATION_DONE
    - EXTRAPOLATION_READY
    - ERROR_THRESHOLD_WARNING, ERROR_THRESHOLD_STOP
    - SKILL_ATTRACTED
    - VALIDATION_4LAYERS_COMPLETED
    - BLOCK_COMPLETED
    - RELIABILITY_WARNING
    - RELIABILITY_CRITICAL
    - UCO_GATE_PASS
    - UCO_GATE_AUTO_FIXED
    - UCO_GATE_REJECTED
    - UCO_OVERCONFIDENCE_ALERT
    - PARALLEL_POT_COMPLETE
    - PARALLEL_POT_PARTIAL
    - SQLITE_DELTA_LOADED
    - SQLITE_SESSION_SAVED
    - FORMAL_VERIFIED
    - FORMAL_REFUTED
    - FORMAL_UNSUPPORTED
    - EXTERNAL_CRITIC_ALERT
    - EXTERNAL_CRITIC_CLEAN
    - DAG_NODE_REGISTERED
    - DAG_CASCADE_INVALIDATED
    - DAG_CYCLE_REJECTED
    - GENETICS_VACCINE_ADDED
    - GENETICS_VACCINE_PROMOTED
    - ERROR_LOOP_FIXED
    - ERROR_LOOP_UNRESOLVED
    - MONTE_CARLO_COMPLETE
    - ST_METRIC_COMPUTED
    - OOD_WARNING
    subscriptions:
      event_observer:
        events: ALL
        action: Registrar em mcfe_state.event_log (últimas 20)
      mcfe:
        events:
        - STEP_3_END
        - STEP_5_END
        - STEP_7_END
        action: Calcular H_cognitive e R_t
      bayesian_curator:
        events:
        - STEP_13_START
        - BAYESIAN_UPDATE_START
        action: Executar bayesian_update_protocol
      meta_learning_agent:
        events:
        - STEP_13_END
        action: Verificar triggers hierárquicos
      anchor_destroyer:
        events:
        - MCFE_STALL_DETECTED
        action: Spawnar ANCHOR_DESTROYER
      marketplace:
        events:
        - RESOLUTION_NEEDED
        action: Iniciar bundle_resolution protocol
      diff_governance:
        events:
        - STEP_13_START
        action: Verificar DIFFs pendentes
      scientific_engine:
        events:
        - MICRO_SIMULATION_DONE
        - EXTRAPOLATION_READY
        - VALIDATION_4LAYERS_COMPLETED
        action: Atualizar modelo e biblioteca
      error_tracker:
        events:
        - ERROR_THRESHOLD_WARNING
        - ERROR_THRESHOLD_STOP
        action: Disparar delegação
      skill_registry:
        events:
        - SKILL_ATTRACTED
        action: Registrar atração e atualizar fitness
      reliability_estimator:
        events:
        - BLOCK_COMPLETED
        action: on_block_completed() — atualiza bucket stats e global_p
      mcfe_reliability_monitor:
        events:
        - BLOCK_COMPLETED
        action: _on_block_completed() — atualiza R_acum e verifica SR_10
      sqlite_snapshot_store:
        events:
        - STEP_0_START
        action: load_delta_for_session() → injetar delta no context
      sqlite_snapshot_store_save:
        events:
        - STEP_13_END
        action: save_session() + vacuum_if_due()
      uco_quality_gate:
        events:
        - pre_subprocess_execution
        action: gate() → PASS|AUTO_FIXED|REJECTED
      parallel_pot_executor:
        events:
        - STEP_3_END
        action: execute_parallel() se fractal_depth >= 2 e modo DEEP+
      hypothesis_dag:
        events:
        - DAG_NODE_REGISTERED
        action: validate_acyclicity() + update_edges()
      hypothesis_dag_cascade:
        events:
        - ANCHOR_DESTROYED
        - EVIDENCE_REFUTED
        action: invalidate_cascade()
      code_genetics_map:
        events:
        - ERROR_LOOP_FIXED
        action: save_vaccine() → sqlite_store
      code_genetics_map_recall:
        events:
        - STEP_P_START
        action: recall(domain_tags) → vacinas ativas
      external_critic_profile:
        events:
        - pre_STEP_12
        action: analyze_output() → [EXTERNAL_CRITIC] injection
      external_critic_record:
        events:
        - ERROR_LOOP_UNRESOLVED
        action: record_error() → error_profile
      sympy_formal_verifier:
        events:
        - MATH_CLAIM_DETECTED
        action: verify() → [FORMAL_VERIFIED|REFUTED]
      monte_carlo_simulator:
        events:
        - STEP_8_SCIENTIFIC
        action: simulate() → distribuição P10/P50/P90
      apex_st_metric:
        events:
        - STEP_13_START
        action: compute_apex_st() → dS²
        curvature: null
      apex_st_stagnation:
        events:
        - ST_METRIC_COMPUTED
        action: se trigger_meta_learning → ativar meta_learning_agent
      sklearn_difficulty:
        events:
        - STEP_0_START
        action: predict() → ood_score + recommendation
      sklearn_difficulty_update:
        events:
        - SQLITE_SESSION_SAVED
        action: update_corpus() → rebuild TF-IDF
      event_observer_sb:
        events:
        - UCO_GATE_PASS
        - UCO_GATE_AUTO_FIXED
        - UCO_GATE_REJECTED
        - PARALLEL_POT_COMPLETE
        - SQLITE_DELTA_LOADED
        - FORMAL_VERIFIED
        - FORMAL_REFUTED
        - EXTERNAL_CRITIC_ALERT
        - DAG_CASCADE_INVALIDATED
        - GENETICS_VACCINE_ADDED
        - ERROR_LOOP_FIXED
        - ERROR_LOOP_UNRESOLVED
        - MONTE_CARLO_COMPLETE
        - ST_METRIC_COMPUTED
        - OOD_WARNING
        action: Registrar em mcfe_state.event_log
    inject_when: always
    subscription_policy:
      auto_prefix_routing:
        enabled: true
        prefix_map:
          MCFE_: mcfe
          BAYESIAN_: bayesian_curator
          RESOLUTION_: marketplace
          SKILL_: skills
          SNAPSHOT_: versioning
          SYMBOLIC_: symbolic_executor
          INTEGRATOR_: cognitive_integrator_library
          MICRO_: fractal_cognitive_simulator
          ERROR_: error_tracker
          VALIDATION_: validation_4layers
          STEP_: event_observer
  reliability_config:
    version: v00.21.0
    tier: 0
    description: 'Configuração central do sistema de confiabilidade. Define P_target por modo, thresholds
      WARNING/CRITICAL, alpha de correlação temporal e parâmetros de calibração.

      '
    inject_when: always
    depends_on:
    - config
    components:
    - ReliabilityConfig
    api:
    - get_p_target(mode)
    config_reference: MODULE_config.parameters.reliability
  bucket_stats:
    version: v00.21.0
    tier: 0
    description: 'Dataclass de estatísticas por faixa de tamanho de bloco. Propriedades calculadas: total,
      fail_rate. Suporta serialização to_dict/from_dict para snapshot. SIZE_BUCKETS: [5-9, 10-14, 15-19,
      20-24, 25-30].

      '
    inject_when: always
    depends_on:
    - reliability_config
    components:
    - BucketStats
  reliability_estimator:
    version: v00.21.0
    tier: 1
    description: 'Estima a probabilidade de falha de blocos por faixa de tamanho. Alimentado por BLOCK_COMPLETED
      via on_block_completed(). Cold start: fórmula analítica n = ln(P_target)/ln(1-p_global). Com dados
      (>= min_samples por bucket): busca empírica. Correlação temporal: p_eff = p_base + α·ε. Nota: mede
      P_fail por BLOCO OBSERVADO — não por passo lógico interno (passos Python em subprocess são determinísticos).

      '
    inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
    depends_on:
    - event_bus
    - bucket_stats
    - reliability_config
    components:
    - ReliabilityEstimator
    api:
    - register_block(size, success)
    - on_block_completed(event_data)
    - get_failure_rate(size, epsilon=0.0)
    - get_success_rate(size, epsilon=0.0)
    - optimal_size_for_target(P_target, min_size, max_size, epsilon)
    - reliability_summary()
    - to_dict() / from_dict()
    persistence: snapshot.reliability_state
    inviolable_rules_enforced:
    - SR_10
  mcfe_state_reliability:
    version: v00.21.0
    tier: 1
    description: 'Estado estendido do MCFE com métricas de confiabilidade acumulada. current_reliability:
      produto acumulado de (1-p_fail) por bloco. Reset no STEP_0. Histórico das últimas 20 entradas.

      '
    inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
    depends_on:
    - reliability_estimator
    components:
    - MCFEState
    fields:
      current_reliability: float = 1.0
      reliability_history: List[float] — últimas 20 entradas
      early_exit_triggered: bool = False
      early_exit_reason: str
    api:
    - reset()
    - update(p_fail_blk)
    - to_dict()
    persistence: snapshot.mcfe_reliability_state
  mcfe_reliability_monitor:
    version: v00.21.0
    tier: 1
    description: 'Monitor ATIVO de confiabilidade acumulada (v00.20.3 era informativo). WARNING:  R_acum
      < 0.50 → RELIABILITY_WARNING + replanning dinâmico. CRITICAL: R_acum < 0.30 → RELIABILITY_CRITICAL
      + EARLY_EXIT forçado. Usa estimativa de p_fail (não resultado real) para sinal suave e antecipativo.
      Único replanning por sessão (_replanning_done flag).

      '
    inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
    depends_on:
    - event_bus
    - reliability_estimator
    - mcfe_state_reliability
    components:
    - MCFEReliabilityMonitor
    api:
    - check_reliability() -> None | "WARNING" | "EARLY_EXIT"
    - update_reliability(p_fail_blk)
    - reset()
    - get_state()
    inviolable_rules_enforced:
    - SR_10
    subscriptions:
    - event: BLOCK_COMPLETED
      handler: _on_block_completed()
  mental_interpreter_v3:
    version: v00.21.0
    tier: 1
    replaces: mental_interpreter_v2
    inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
    depends_on:
    - pot_engine_v2
    - mcfe
    - geometry_estimator
    - event_bus
    - reliability_estimator
    - mcfe_reliability_monitor
    - mcfe_state_reliability
    components:
    - MentalInterpreter
    - TrajectoryVerifier
    - MCFEAdapter
    phases:
    - WARMUP
    - PLANNING
    - PRODUCTION
    new_params:
      cognitive_mode: str — define P_target via ReliabilityConfig.get_p_target()
      reliability_state: Optional[Dict] — restaura ReliabilityEstimator do snapshot (STEP_0)
    new_steps:
      STEP_0: reset R_acum=1.0 · restaura reliability_state do snapshot
      STEP_5: replanning dinâmico quando R_acum < WARNING_THRESHOLD
      STEP_13: salva reliability_state · imprime RELIABILITY_REPORT
    planning_formula: 'n_final = max(MIN_SIZE, min(n_num, n_rel, MAX_SIZE)) n_num via GeometryEstimator.optimal_block_size()
      — limite numérico (curvatura) n_rel via ReliabilityEstimator.optimal_size_for_target(P_target, ε)
      — limite estatístico

      '
    new_outputs:
    - reliability_state: Dict — ReliabilityEstimator.to_dict()
    - mcfe_reliability_state: Dict — MCFEReliabilityMonitor.get_state()
    inviolable_rules_enforced:
    - SR_08
    - SR_09
    - SR_10
    status: DEPRECATED_FOR_DEEP_PLUS
    deprecation_note: 'mental_interpreter_v3 permanece ativo para EXPRESS e FAST. Para DEEP/RESEARCH/SCIENTIFIC:
      substituído por mental_interpreter_v4 (OPP-75).

      '
  mental_interpreter_v4:
    version: v00.32.0
    opp: OPP-75
    tier: 1
    replaces: mental_interpreter_v3
    replaces_scope: DEEP/RESEARCH/SCIENTIFIC apenas — v3 permanece para EXPRESS/FAST/CLARIFY
    inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
    depends_on:
    - pot_engine_v2
    - mcfe
    - geometry_estimator
    - event_bus
    - reliability_estimator
    - mcfe_reliability_monitor
    - mcfe_state_reliability
    - sqlite_snapshot_store
    - uco_quality_gate
    - parallel_pot_executor
    - merge_defensive
    - code_genetics_map
    - error_evolution_loop
    components:
    - MentalInterpreter
    - TrajectoryVerifier
    - MCFEAdapter
    - SpeculationPhase
    - UCOGateWrapper
    - SharedWarmupCache
    phases:
    - SPECULATION: 'Fase nova (antes de WARMUP). Ativa apenas quando: cognitive_mode IN [DEEP, RESEARCH,
        SCIENTIFIC] AND fractal_depth >= 2. Gera N programas PoT com stances (optimistic/pessimistic/neutral).
        Passa cada programa pelo UCOQualityGate antes de executar. Executa via ParallelPoTExecutor (ThreadPoolExecutor).
        Aplica entropy_weighted_merge nos snapshots resultantes. Registra hipóteses merged no hypothesis_dag.
        Emite: PARALLEL_POT_COMPLETE ou PARALLEL_POT_PARTIAL.

        '
    - WARMUP: herdado v3 — N_WARM_BLOCKS para observar geometria do campo
    - PLANNING: herdado v3 — n_final = max(MIN_SIZE, min(n_num, n_rel, MAX_SIZE))
    - PRODUCTION: herdado v3 + error_evolution_loop em caso de falha
    speculation_config:
      n_agents_by_mode:
        DEEP: 3
        RESEARCH: 5
        SCIENTIFIC: 7
      stances:
      - optimistic
      - pessimistic
      - neutral
      stance_to_phase:
        optimistic: π/4
        pessimistic: 5π/4
        neutral: '0'
      activation_condition: fractal_depth >= 2
      shared_warmup_cache: true
      warmup_economy_pct: 66
    uco_gate_integration:
      position: ANTES de cada subprocess execution (em SPECULATION e PRODUCTION)
      on_pass: executar normalmente
      on_auto_fixed: usar código otimizado + emitir UCO_GATE_AUTO_FIXED
      on_rejected: injetar uco_feedback no contexto → LLM regenera → re-gate
      max_regen_attempts: 2
    error_loop_integration:
      position: em _on_block_failure() dentro de PRODUCTION
      max_debug_depth: 3
      rollback_condition: nenhuma tentativa reduziu len(stderr)
      on_success: sqlite_store.save_vaccine() + emitir ERROR_LOOP_FIXED
      on_unresolved: UNRESOLVED_PATTERN no code_genetics + emitir ERROR_LOOP_UNRESOLVED
    sqlite_integration:
      step_0: sqlite_store.load_delta_for_session() — injetar delta no context
      step_13: sqlite_store.save_session() + crystallization_jit.crystallize()
    steps_inherited_from_v3:
      STEP_0: reset R_acum=1.0 · restaura reliability_state do snapshot · [NOVO] carrega delta SQLite
      STEP_5: replanning dinâmico quando R_acum < WARNING_THRESHOLD
      STEP_13: salva reliability_state · RELIABILITY_REPORT · [NOVO] save_session SQLite
    params_inherited:
      cognitive_mode: str — define P_target via ReliabilityConfig.get_p_target()
      reliability_state: Optional[Dict] — restaura ReliabilityEstimator do snapshot
    params_new_v032:
      sqlite_store: ApexSQLiteStore — referência ao banco de dados persistente
      uco_gate: UCOQualityGate — instância do gate de qualidade
      parallel_executor: ParallelPoTExecutor — executor ThreadPoolExecutor
      n_speculation_agents: int — definido por speculation_config.n_agents_by_mode
    outputs_inherited:
    - reliability_state: Dict — ReliabilityEstimator.to_dict()
    - mcfe_reliability_state: Dict — MCFEReliabilityMonitor.get_state()
    outputs_new_v032:
    - speculation_metadata: Dict — {n_agents, n_succeeded, efficiency, merge_quality}
    - uco_gate_summary: Dict — {passed, auto_fixed, rejected, total}
    - error_loop_summary: Dict — {fixed_count, unresolved_count}
    api:
    - execute(problem, context, snapshot_store, uco_gate) → ExecutionResult
    - _run_speculation_phase(programs, mode) → merged_state
    - _run_production(blocks, mode) → ProductionResult
    - _on_block_failure(code, stderr, attempt) → PatchResult
    - _step_0_init(snapshot, sqlite_store) → void
    - _step_13_snapshot(sqlite_store) → void
    inviolable_rules_enforced:
    - SR_08
    - SR_09
    - SR_10
    - SR_33
    - SR_32
    events_emitted:
    - PARALLEL_POT_COMPLETE
    - PARALLEL_POT_PARTIAL
    - UCO_GATE_PASS
    - UCO_GATE_AUTO_FIXED
    - UCO_GATE_REJECTED
    - ERROR_LOOP_FIXED
    - ERROR_LOOP_UNRESOLVED
    - SQLITE_DELTA_LOADED
    - SQLITE_SESSION_SAVED
    fmea:
      rpn: 6
      mode: Speculation phase falha completamente (todos agentes corrompidos)
      mitigation: Fallback para MERGE_FAILED_USE_SEMANTIC_CRITIC — sessão continua
  bayesian_inference:
    version: v00.19.0
    tier: 2
    inject_when: always
    description: Bayesian calibration of system parameters using in‑context cognitive models.
    config:
      enabled: true
      class_1:
        models:
        - beta_binomial
        targets:
        - component_success
        - anchor_success
        - hypothesis_success
        update_rule: alpha += success; beta += failure
        posterior_storage: snapshot.bayesian_posteriors.class_1
      class_2:
        inject_when: cognitive_mode IN [DEEP, RESEARCH, SCIENTIFIC]
        models:
        - normal_vi
        targets:
        - anchor_weights
        - agent_weights_by_bds
        - eq_class_weights
        learning_rate: 0.05
        update_instructions:
          anchor_weights: erro = (sucesso_sessão - mu) * (1 se âncora contribuiu); mu += learning_rate
            * erro; sigma² = (1-lr)*sigma² + lr*erro²
          agent_weights_by_bds: se contribuição positiva, incrementar α_i; normalizar
          eq_class_weights: similar, por classe de equação
        posterior_storage: snapshot.bayesian_posteriors.class_2
      class_3:
        inject_when: bayesian_trigger_active
        models:
        - hmc_cognitive
        n_candidates: 7
        log_posterior_formula: log_prior(c) + log_likelihood(c | session_data)
        targets:
        - chaos_threshold_by_bds
        - diff_d06_threshold
        - error_tracker.delta_range
        - error_tracker.threshold_stop
        priors:
          chaos_threshold_by_bds:
            high_entropy:
              alpha: 2
              beta: 2
            high_density:
              alpha: 2
              beta: 2
            high_knowledge:
              alpha: 2
              beta: 2
          diff_d06_threshold:
            alpha: 2
            beta: 2
        posterior_storage: snapshot.bayesian_posteriors.class_3
      triggers:
        periodic_hmc_sessions: 30
        change_indicators:
        - 'name: scope_drift, source: snapshot.scope_drift_detected, condition: true, cooldown: 10'
        - 'name: high_decoherence_persistent, source: snapshot.high_decoherence_areas, condition: len>2
          AND persistente_por>=3, cooldown: 5'
        - 'name: fitness_decline, source: snapshot.diff_ecosystem_state, condition: any(value.status==DECLINING),
          cooldown: 10'
        - 'name: user_request, source: DIFF com target bayesian_calibration, cooldown: 0'
      hierarchical:
        level_0: every session
        level_1_every: 10
        level_2_every: 30
    dependencies:
    - MODULE_versioning
    - MODULE_config
    outputs:
    - bayesian_updates
  marketplace:
    version: v00.19.0
    tier: 2
    inject_when: component_resolution_needed AND (snapshot.capabilities.url_access OR manual_catalog_provided)
    description: Autonomous component resolution via unified attraction field (Omega_Bayes), with semantic
      fallback.
    config:
      enabled: true
      repositories:
      - url: https://raw.githubusercontent.com/thiagofernandes1987-create/APEX/main/INDEX.md
        type: catalog
        cache_ttl: 86400
      resolution:
        model: hyperbolic_bundle_attraction
        bayesian_filter:
          enabled: true
          prior_source: snapshot.bayesian_posteriors.class_1.component_success
          threshold: kernel.defaults.bayesian.filter_threshold
        individual_attraction:
          formula: tanh(Σ anchor_weight * overlap)
          anchor_weights_source: snapshot.bayesian_posteriors.class_2.anchor_weights.mu
          overlap_measure: jaccard
        bundle_coherence:
          formula: jaccard(union of all component anchors)
        omega_bayes:
          formula: geometric_mean(individual_attractions) * bundle_coherence * geometric_mean(component_priors)
          thresholds:
            adopt: kernel.defaults.bayesian.omega_thresholds.adopt
            review: kernel.defaults.bayesian.omega_thresholds.review
        resolution_order:
        - complete_bundle
        - partial_bundle
        - skill_only
        - synthesize_local
        output_cache: snapshot.resolution_cache
      fallback:
        enabled: true
        semantic:
          ontology_url: kernel.defaults.fallback.ontology_url
          builtin_ontology: '...'
          use_when: no_catalog_available AND kernel.defaults.fallback.use_semantic_fallback
          map_anchors_to_domain: Para cada âncora ativa, comparar com palavras-chave dos domínios.
          specialization_path: /{dominio}/{profissao}
        manual_catalog:
          detection_header: '#MARKETPLACE_CATALOG'
          command: '!carregar_catalogo'
      synthesis:
        enabled: true
        status_on_create: LOCAL_DRAFT
        template_source: MODULE_skills.skill_genome_schema
    dependencies:
    - MODULE_versioning
    - MODULE_skills
    - MODULE_knowledge
    outputs:
    - resolution_result
