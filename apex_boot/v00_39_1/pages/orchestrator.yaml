  - name: Analysis
    steps:
    - STEP_0_4
    - STEP_1
    - STEP_2
    - STEP_3
    - STEP_3_5
    phase: 2
  - name: Scientific Analysis
    steps:
    - STEP_SCI_01: Equation analysis (equation_analyzer)
    - STEP_SCI_02: Closed‑form detection (closed_form_detector)
    - STEP_SCI_03: Symbolic execution attempt (symbolic_executor)
    - STEP_SCI_04: Integrator selection (cognitive_integrator_library + equation_analyzer)
    - STEP_SCI_05: Micro‑simulation (micro_simulator + error_tracker)
    - STEP_SCI_06: Functional identification (local_model_builder)
    - STEP_SCI_07: Macro extrapolation (macro_extrapolator)
    - STEP_SCI_08: Error monitoring (error_monitor)
    - STEP_SCI_09: Model evolution (scientific_engine)
    - STEP_SCI_10: Validation (validation_4layers)
    phase: 2.5
  - name: Synthesis
    steps:
    - STEP_4
    - STEP_5
    - STEP_6
    - STEP_7
    - STEP_8
    - STEP_9
    phase: 3
  - name: Validation
    steps:
    - STEP_10
    - STEP_11
    - STEP_12
    - STEP_13
    phase: 4
