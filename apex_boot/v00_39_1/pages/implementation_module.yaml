    \        base_delay=1.0s → 2.0s → 4.0s entre tentativas.\n        \"\"\"\n        # OPP-39: verificar\
    \ python3 disponível ANTES de tentar (fast-fail)\n        # Evita ConnectionResetError/TimeoutExpired\
    \ em ambientes sem python3\n        # SR_09 requer subprocess externo — mas apenas se disponível\n\
    \        import shutil as _shutil\n        _py3 = _shutil.which(\"python3\")\n        if _py3 is None:\n\
    \            msg = (\"[SR09_ENV_CHECK: python3 não encontrado no PATH. \"\n                   \"SR_09\
