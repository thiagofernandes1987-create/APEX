    \ há pinned entries, parar\n                if all(h in self._pinned for h in self._lru):\n      \
    \              break\n                continue\n            self._lru.pop(candidate, None)    # O(1)\n\
    \            self._store.pop(candidate, None)\n            evicted += 1\n\n    def to_index(self)\
    \ -> dict:\n        \"\"\"Retorna índice leve (apenas hash + meta) para SNAP_COG.\"\"\"\n        return\
    \ {h: e[\"meta\"] for h, e in self._store.items()}\n\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # APEX v00.24 — 4 DIFFs APLICADOS (novo formato canônico DSL+Python)\n# Origem: apex_diffs_v00_24_proposals.yaml\
