  python_source: "\"\"\"\nAPEX v00.24.1 — Código Python Completo + QA Debug Session\nBase: apex_v00_24\
    \ + fixes do QA Debug Session completo\n\nFixes do ciclo v00.24.2 (análise de squads externas + verificação\
    \ empírica):\n  DIFF_NLM_NORMALIZE:   NumericLandscapeModel — Z-score + ridge (1e-6) + collinearity\
    \ detection\n                        Erro 72.5% em escalas mistas → <1%. Detecta colinearidade e reduz\
