    \ GeometryEstimator._lv_dynamics(x, y, a, b, d, g)\n        f0=_f_lv(x,y)\n        fxx=[(_f_lv(x+eps,y)[i]-2*f0[i]+_f_lv(x-eps,y)[i])/eps**2\
