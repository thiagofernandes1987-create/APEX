    \    G10: fallback automático, sem exception.\n    SR_26: predict() em SCIENTIFIC verifica r² >= 0.70.\n\
    \    \"\"\"\n    def __init__(self, degree: int = 2, cv_folds: int = 5):\n        self.degree    \
    \   = degree\n        self.cv_folds     = cv_folds\n        self.samples:     List[tuple] = []\n \
    \       self.is_fitted    = False\n        self.r_squared:   Optional[float] = None\n        self.alpha_used:\
    \  Optional[float] = None\n        # legado: normalização manual (fallback)\n        self._param_mean:\
    \  List[float] = []\n        self._param_std:   List[float] = []\n        self._energy_mean: float\
    \ = 0.0\n        self._energy_std:  float = 1.0\n        self._active_dims: List[int] = []\n     \
    \   self._pipeline     = None  # sklearn pipeline (lazy init)\n        self.coeffs        = None \
    \ # fallback coefficients\n\n    def add_sample(self, params: list, energy: float) -> None:\n    \
    \    self.samples.append((params[:], float(energy)))\n        self._pipeline = None   # invalidar\
    \ fit anterior\n        self.is_fitted = False\n\n    # ── sklearn path ────────────────────────────────────────\n\
    \    def _try_sklearn_fit(self) -> bool:\n        try:\n            from sklearn.linear_model import\
    \ RidgeCV\n            from sklearn.preprocessing import PolynomialFeatures, StandardScaler\n    \
    \        from sklearn.pipeline import Pipeline\n            import numpy as np\n        except ImportError:\n\
    \            return False\n        if len(self.samples) < 6: return False\n        X = np.array([s[0]\
    \ for s in self.samples])\n        y = np.array([s[1] for s in self.samples])\n        alphas = [1e-4,\
    \ 1e-3, 1e-2, 0.1, 1.0, 10.0]\n        cv = min(self.cv_folds, len(self.samples))\n        self._pipeline\
    \ = Pipeline([\n            ('poly',   PolynomialFeatures(degree=self.degree, include_bias=True)),\n\
    \            ('scaler', StandardScaler()),\n            ('model',  RidgeCV(alphas=alphas, cv=cv)),\n\
    \        ])\n        self._pipeline.fit(X, y)\n        y_pred = self._pipeline.predict(X)\n      \
    \  ss_res = float(np.sum((y - y_pred)**2))\n        ss_tot = float(np.sum((y - y.mean())**2))\n  \
    \      self.r_squared  = round(1.0 - ss_res/ss_tot, 4) if ss_tot > 1e-12 else 0.0\n        self.alpha_used\
    \ = float(self._pipeline['model'].alpha_)\n        self.is_fitted  = True\n        return True\n\n\
    \    # ── fallback Python puro ────────────────────────────────\n    def _compute_normalization(self)\
    \ -> None:\n        if not self.samples: return\n        n_params = len(self.samples[0][0])\n    \
    \    self._param_mean = []; self._param_std = []\n        for d in range(n_params):\n            vals\
    \ = [s[0][d] for s in self.samples]\n            mean = sum(vals)/len(vals)\n            std  = math.sqrt(sum((v-mean)**2\
    \ for v in vals)/len(vals))\n            self._param_mean.append(mean); self._param_std.append(max(std,1e-12))\n\
    \        n_samp = len(self.samples)\n        normed = [[(self.samples[k][0][d]-self._param_mean[d])/self._param_std[d]\n\
    \                   for k in range(n_samp)] for d in range(n_params)]\n        self._active_dims =\
    \ []\n        for d in range(n_params):\n            is_redundant = False\n            for prev in\
    \ self._active_dims:\n                dot = sum(normed[d][k]*normed[prev][k] for k in range(n_samp))\n\
    \                n1  = math.sqrt(sum(v**2 for v in normed[d]))\n                n2  = math.sqrt(sum(v**2\
    \ for v in normed[prev]))\n                if abs(dot/max(n1*n2,1e-12)) > 0.9999: is_redundant=True;\
    \ break\n            if not is_redundant: self._active_dims.append(d)\n        energies = [s[1] for\
    \ s in self.samples]\n        self._energy_mean = sum(energies)/len(energies)\n        self._energy_std\
    \  = max(math.sqrt(sum((e-self._energy_mean)**2\n                                for e in energies)/len(energies)),\
    \ 1e-12)\n\n    def _normalize_params(self, params: list) -> list:\n        if not self._param_mean:\
    \ return params\n        active = self._active_dims or list(range(len(params)))\n        return [(params[d]-self._param_mean[d])/self._param_std[d]\
    \ for d in active]\n\n    def _build_features(self, pn: list) -> list:\n        feats = [1.0]\n  \
    \      for p in pn: feats.append(p)\n        for i in range(len(pn)): feats.append(pn[i]**2)\n   \
    \     if len(pn)>1:\n            for i in range(len(pn)):\n                for j in range(i+1,len(pn)):\
    \ feats.append(pn[i]*pn[j])\n        return feats\n\n    def _gauss_solve(self, A: list, b: list,\
    \ ridge: float = 1e-6) -> Optional[list]:\n        \"\"\"Eliminação Gaussiana com ridge regularization\
    \ (fallback).\"\"\"\n        n = len(b)\n        A_reg = [A[i][:] for i in range(n)]\n        for\
    \ i in range(n): A_reg[i][i] += ridge\n        M = [A_reg[i][:]+[b[i]] for i in range(n)]\n      \
    \  for col in range(n):\n            max_row = max(range(col,n), key=lambda r: abs(M[r][col]))\n \
    \           M[col], M[max_row] = M[max_row], M[col]\n            pivot = M[col][col]\n           \
    \ if abs(pivot)<1e-12: return None\n            for row in range(col+1,n):\n                f = M[row][col]/pivot\n\
    \                M[row] = [M[row][j]-f*M[col][j] for j in range(n+1)]\n        x = [0.0]*n\n     \
    \   for i in range(n-1,-1,-1):\n            x[i] = M[i][n]\n            for j in range(i+1,n): x[i]\
    \ -= M[i][j]*x[j]\n            if abs(M[i][i])<1e-12: return None\n            x[i] /= M[i][i]\n \
    \       return x\n\n    def _try_numpy_fit(self) -> bool:\n        try:\n            import numpy\
    \ as np\n        except ImportError:\n            return False\n        if len(self.samples) < 5:\
    \ return False\n        self._compute_normalization()\n        X_n = [self._normalize_params(s[0])\
    \ for s in self.samples]\n        X   = np.array([self._build_features(p) for p in X_n])\n       \
    \ y   = np.array([(s[1]-self._energy_mean)/self._energy_std\n                         for s in self.samples])\n\
    \        result = np.linalg.lstsq(X, y, rcond=None)\n        self.coeffs    = result[0].tolist()\n\
    \        y_pred         = X @ result[0]\n        ss_res = float(np.sum((y-y_pred)**2))\n        ss_tot\
    \ = float(np.sum((y-y.mean())**2))\n        self.r_squared = round(1.0-ss_res/ss_tot, 4) if ss_tot>1e-12\
    \ else 0.0\n        self.is_fitted = True\n        return True\n\n    def _pure_fit(self) -> bool:\n\
    \        if len(self.samples)<5: return False\n        self._compute_normalization()\n        X_n\
