    # BLOCO 18: FRACTAL DECOMPOSER (inalterado — v00.21.0)\n# ═══════════════════════════════════════════════════════════════════\n\
    \n@dataclass\nclass Block:\n    bid: str; n_start: int; n_end: int\n    @property\n    def size(self):\
    \ return self.n_end - self.n_start\n\n\nclass FractalDecomposer:\n    MIN_SIZE = 5; MAX_SIZE = 30;\
    \ DEFAULT = 30\n\n    def decompose(self, n_total: int, size: int = DEFAULT) -> List[Block]:\n   \
    \     size = max(self.MIN_SIZE, min(size, self.MAX_SIZE))\n        blocks, k, s = [], 0, 0\n     \
