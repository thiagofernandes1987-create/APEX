    \           try:\n                from scipy.optimize import minimize\n                import numpy\
    \ as np\n                x0  = np.array([(lo+hi)/2.0 for lo,hi in bounds])\n                res =\
    \ minimize(\n                    lambda x: float(self._pipeline.predict(x.reshape(1,-1))[0]),\n  \
    \                  x0, method='L-BFGS-B', bounds=bounds,\n                    options={'maxiter':200,'ftol':1e-9,'gtol':1e-6}\n\
    \                )\n                if res.success or res.fun < float('inf'):\n                  \
