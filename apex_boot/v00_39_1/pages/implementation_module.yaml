    \        self._dirty = True\n        self._disk_save()\n        return h\n\n    def load(self, h:\
    \ str) -> Optional[Any]:\n        entry = self._store.get(h)\n        if entry:\n            # OPP-46:\
    \ O(1) move_to_end (antes: O(N) remove + append)\n            if h in self._lru:\n               \
    \ self._lru.move_to_end(h)\n            return entry[\"data\"]\n        return None\n\n    def load_meta(self,\
    \ h: str) -> Optional[dict]:\n        entry = self._store.get(h)\n        return entry[\"meta\"] if\
    \ entry else None\n\n    def exists(self, h: str) -> bool:\n        return h in self._store\n\n  \
    \  def list_by_meta(self, key: str, val: Any) -> List[str]:\n        return [h for h, e in self._store.items()\n\
    \                if e.get(\"meta\", {}).get(key) == val]\n\n    def size(self) -> int:\n        return\
    \ len(self._store)\n\n    # OPP-14: tipos de snapshot purgeable (TTL automático)\n    SCRATCH_TYPES:\
