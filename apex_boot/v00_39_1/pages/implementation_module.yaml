    \  DIFF_AGENT_SKILL:     AgentReplacementEngine.replace_agent + HistoricalSuccessTracker\n       \
    \                 Se reward<0.35 em algos do domínio → forced_skill ao substituto\n              \
    \          (não só mudança de fase quando o problema é skill ausente)\n\nRefutações com base empírica\
    \ (não viraram DIFF):\n  SR_09 \"inviável\":          subprocess Python real executa (RC=0 verificado)\n\
    \  Dependência circular:      pipeline unidirecional EventBus, não loop\n  Banker's Rounding SHA256:\
    \  quantização 8 casas absorve diferenças float\n  PoT loop infinito:         template controlado,\
    \ for loop fixo por bloco\n\nFixes do ciclo v00.25.0 (13 OPPs aplicadas — inventário completo):\n\
    \  OPP-01 DIFF_SCIPY_CREDIBILITY:   credibility_interval → scipy.stats.beta.rvs (erro 3.3% → <0.5%)\n\
    \  OPP-02 DIFF_SCIPY_ODE:           _step_fn → solve_ivp RK45 adaptativo (erro N=200: 2.2% → <0.01%)\n\
    \  OPP-03 DIFF_NLM_LSTSQ:           NLM Gauss puro → np.linalg.lstsq (condicionamento 9.6e20 → 860)\n\
    \  OPP-04 DIFF_SCIPY_LYAPUNOV:      lyapunov loop puro → solve_ivp (erro 62% → <5%)\n  OPP-05 DIFF_SCIPY_HESSIAN:\
    \       ParameterIdentifiabilityChecker → eigvalsh (elimina falso positivo)\n  OPP-06 DIFF_NLM_SKLEARN:\
    \         NLM → sklearn Pipeline RidgeCV com CV real e r²\n  OPP-07 DIFF_SNAP_PLOT:           matplotlib\
    \ PNG auditável → SNAP_PLOT com hash SHA256\n  OPP-08 DIFF_PANDAS_TRACKER:      HistoricalSuccessTracker\
    \ → pandas stats + score=mean-0.5*std\n  OPP-12 DIFF_VERIFICATION_LEVEL:  on_block_completed com verification_level\
    \ (EXECUTED/SYNTHETIC/PARTIAL)\n  OPP-13 DIFF_VARIANCE_GUARD:      should_replace bug fix: var<threshold\
    \ AND confidence<60\n  OPP-14 DIFF_SCRATCHPAD:          save_scratch+commit_cycle+LRU prioritário\
    \ para purgeables\n  OPP-15 DIFF_RETRY_BACKOFF:       _subprocess retry 3x com exponential backoff\n\
    \  OPP-16 DIFF_THRESHOLD_CALIBRATION: ThresholdCalibrator adaptativo por modelo\n\nNovas regras:\n\
    \  SR_26: NLM r² >= 0.70 em SCIENTIFIC (NLM_POOR_FIT_WARNING)\n  SR_27: R_acum só computado para blocos\
    \ EXECUTED/PARTIAL (não SYNTHETIC)\n  G10:   Todo módulo com biblioteca opcional tem fallback Python\
    \ puro\n  G11:   SNAP_PLOT apenas para trajetórias COMPLETE\n  G12:   ThresholdCalibrator atualiza\
    \ a cada 50 blocos executados\n\nFixes do ciclo v00.24.1 (QA Debug Session):\n  FIX-BUG-01: PoTBlockCompiler.compile_block_fn\
    \ — IndentationError corrigido\n               Script gerado: blkN em col 0, _step indentado corretamente\n\
    \               Todos os 7 modos cognitivos executam sem ERROR\n  FIX-BUG-02: SnapshotStore — persistência\
    \ em disco via persist_path\n               persist_path=None: in-memory (backward compatible)\n \
    \              persist_path=str: _disk_load() init + _disk_save() auto\n  FIX-BUG-03: TrajectoryVerifier.verify\
    \ — fallback 'n' por índice\n               Aceita {\"x\":...,\"y\":...} sem chave 'n' (KeyError eliminado)\n\
    \  FIX-G-03:   SnapRefRetrieval.suggest_bias — padronizado para 'confidence'\n  FIX-G-05:   ModelSelectionEngine.extract_features\
    \ — 20+ detectores TIER_B\n               kmeans, knn, cart, pca, logistic, TSP, hungarian, PID, LQR,\n\
    \               MDP, smoother, dormand_prince, edmonds_karp e mais\n\nQA Debug Session — resultados:\n\
    \  Testes executados: 41 | PASS: 41 | FAIL: 0\n  FMEA RPN máx pós-mitigação: 0\n  ACCEPTANCE_FLAG:\
    \ PASS\n\nDIFFs v00.24 aplicados (origem: apex_diffs_v00_24_proposals.yaml):\n  DIFF_CHAIN_001:  \
    \      ChainLink + AuditChain (SR_23) — proveniência auditável\n  DIFF_MERGE_REASON_001: MergeReasonValidator\
    \ (SR_24) — merge_reasoning obrigatório\n  DIFF_MEMORY_DISK_001:  MemoryIndex persistente em disco\
    \ (G9) — cross-session learning\n  DIFF_CRITIC_GATE_001:  CriticGate bloqueante em SCIENTIFIC (SR_25)\n\
    \nQA Cycle aplicado: DSM + Ishikawa + Pareto + FMEA\n  Bugs encontrados: 4 | Bugs corrigidos: 4 |\
    \ FMEA RPN máx pós: 0\n  Testes: 63/63 PASS | ACCEPTANCE_FLAG: PASS\n\nFixes deste ciclo:\n  FIX-I-D1:\
    \ from datetime import datetime, timezone adicionado\n  FIX-I-D2: @dataclass adicionado ao ChainLink\n\
    \  FIX-I-D3: @dataclass duplo removido + field ordering corrigido\n  FIX-I-I6: AuditChain.finalize\
    \ corrigido para store.save(payload, meta)\n\nHerança:\n  v00.23 patch (10 módulos): SymbolicPreCheckV2,\
    \ HMCStepSizeAdapter,\n    lyapunov_maximal, CFIFeatureExtractor, SnapRefRetrieval,\n    HistoricalSuccessTracker,\
    \ MCMCDiagnostics, ParameterIdentifiabilityChecker,\n    AgentContractValidator, SelfReflectionEngine\n\
    \  v00.22.1 (50 algoritmos): TIER_A(12) + TIER_B(38) + 24 classes base\n\nMódulos totais: 38 classes\
    \ | 56 funções top-level | 5.478 linhas\nDIFF_v22_TIER_B_001: 38 algoritmos TIER_B implementados e\
    \ validados\n  QA: DSM + Ishikawa + Pareto + FMEA | 5 bugs corrigidos | 43/43 testes PASS\n  Famílias:\
    \ graph(7) · optimization(8) · probabilistic(5) · numerical(5)\n           combinatorics(4) · control(4)\
    \ · ml(5)\nNovos módulos integrados nesta versão:\n  DIFF_v22_001: ChaosOperators (structural_mutation,\
    \ recombination, levy_mutation)\n  DIFF_v22_002: SnapshotStore SHA256 + credibility_interval()\n \
    \ DIFF_v22_003: AlgorithmKernel (TIER_A 12 algoritmos) + MSE\n  DIFF_v22_006: CouplingAnalyzer (Fiedler-based)\n\
    \  DIFF_v22_007: SymbolicPreCheckV2\n  DIFF_v22_008: AgentReplacement (rejections_streak trigger)\n\
    \  DIFF_v22_009: DynamicPoolScaling (H_cognitive × T mid-session)\n  DIFF_v22_010: NumericLandscapeModel\
    \ (regressão para parâmetros numéricos)\nPreservados sem alteração (FIX-QA-A/B/C/D/E):\n  SimState,\
    \ Thresholds, EventBus, GeometryEstimator,\n  FractalDecomposer, PoTBlockCompiler, TrajectoryVerifier,\n\
    \  MCFEAdapter, MentalInterpreter v3, build_pipeline()\n  ReliabilityConfig (prior alpha=9, beta=1\
    \ — FIX-NEW1)\n  BucketStats, ReliabilityEstimator, MCFEState, MCFEReliabilityMonitor\n\"\"\"\nfrom\
    \ __future__ import annotations\nimport math, os, json, subprocess, tempfile, textwrap, hashlib, random,\
    \ re, time\nfrom datetime import datetime, timezone\nfrom dataclasses import dataclass, field, asdict\n\
    from typing import Dict, List, Optional, Tuple, Any\nfrom collections import defaultdict\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # IMPORTS OPCIONAIS — G10: fallback automático se ausente\n# OPP-01/02/03/04/05/06/07/08: scipy, numpy,\
    \ sklearn, pandas, matplotlib\n# ═══════════════════════════════════════════════════════════════════\n\
    try:\n    import numpy as _np_global\n    _HAS_NUMPY = True\nexcept ImportError:\n    _HAS_NUMPY =\
    \ False\n\ntry:\n    import scipy as _sp_global\n    _HAS_SCIPY = True\nexcept ImportError:\n    _HAS_SCIPY\
    \ = False\n\ntry:\n    import sklearn as _sk_global\n    _HAS_SKLEARN = True\nexcept ImportError:\n\
    \    _HAS_SKLEARN = False\n\ntry:\n    import pandas as _pd_global\n    _HAS_PANDAS = True\nexcept\
    \ ImportError:\n    _HAS_PANDAS = False\n\ntry:\n    import matplotlib as _mpl_global\n    _HAS_MATPLOTLIB\
    \ = True\nexcept ImportError:\n    _HAS_MATPLOTLIB = False\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 1: CONTRATO DE ESTADO (inalterado — PATCH-A incluso)\n# ═══════════════════════════════════════════════════════════════════\n\
    \n@dataclass\nclass SimState:\n    \"\"\"\n    Contrato de estado tipado para simulações Lotka-Volterra\
    \ e sistemas bilineares.\n    ESCOPO INTENCIONAL (LLM Puro): SimState é EXCLUSIVAMENTE para ODE bilineares\n\
    \    do tipo LV. Sistemas de outras dimensões (Lorenz 3D, N-corpos, tensores)\n    → DELEGATION_NOTE\
    \ via SR_01. Não é limitação — é design para LLM Puro.\n    Campos: n (step), x/y (populações presa/predador),\
    \ V0/V_current/V_drift\n    (volume de fase), epsilon (erro acumulado), alpha/beta/delta/gamma/dt\n\
    \    (parâmetros LV). PATCH-A: from_dict() filtra campos extras (fix de TypeError).\n    \"\"\"\n\
    \    n: int; x: float; y: float\n    V0: float; V_current: float; V_drift: float; epsilon: float\n\
    \    alpha: float = 0.5; beta: float = 0.02\n    delta: float = 0.01; gamma: float = 0.4; dt: float\
    \ = 0.1\n\n    def to_dict(self): return asdict(self)\n\n    @classmethod\n    def from_dict(cls,\
    \ d):\n        valid_keys = cls.__dataclass_fields__.keys()\n        return cls(**{k: d[k] for k in\
    \ valid_keys if k in d})\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 2: THRESHOLD CONFIG (inalterado)\n# ═══════════════════════════════════════════════════════════════════\n\
    \n@dataclass\nclass Thresholds:\n    eps_block_stop:  float = 0.20\n    eps_global_warn: float = 0.30\n\
    \    V_drift_stop:    float = 15.0\n    x_min:           float = 0.0\n    y_min:           float =\
    \ 0.0\n\n    @classmethod\n    def from_state0(cls, s: SimState) -> 'Thresholds':\n        return\
    \ cls(\n            x_min=max(s.x * 0.001, 1e-6),\n            y_min=max(s.y * 0.001, 1e-6)\n    \
    \    )\n\n\n# ═══════════════════════════════════════════════════════════════════\n# BLOCO 3: EVENT\
    \ BUS (inalterado — FIX-H2M1)\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass EventBus:\n    def __init__(self):\n        self._subs: Dict[str, list] = defaultdict(list)\n\
    \        self.event_log: \"deque[dict]\" = __import__('collections').deque(maxlen=20)  # OPP-56: O(1)\
    \ popleft\n\n    def subscribe(self, event: str, handler):\n        self._subs[event].append(handler)\n\
    \n    def emit(self, event: str, payload: dict):\n        entry = {\"event\": event, \"payload\":\
    \ payload}\n        self.event_log.append(entry)\n        if len(self.event_log) > 20:\n         \
    \   self.event_log.popleft()  # OPP-56: O(1) deque\n        for h in self._subs.get(event, []):\n\
    \            h(payload)\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 4: RELIABILITY CONFIG (inalterado — DIFF_RELIABILITY_01)\n#   SCIENTIFIC P_target=0.85 (FIX-QA-B),\
    \ EXPRESS=0.30 (DIFF_EXPRESS_01)\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass ReliabilityConfig:\n    P_TARGET = {\n        \"EXPRESS\":    0.30,\n        \"FOGGY\":  \
    \    0.40,\n        \"FAST\":       0.50,\n        \"CLARIFY\":    0.60,\n        \"DEEP\":      \
    \ 0.70,\n        \"RESEARCH\":   0.80,\n        \"SCIENTIFIC\": 0.85,\n    }\n    INITIAL_GLOBAL_P\
    \    = 0.03\n    MIN_SAMPLES_BUCKET  = 5\n    ALPHA               = 0.50   # p_eff = p_base + α·ε\n\
    \    WARNING_THRESHOLD   = 0.50\n    CRITICAL_THRESHOLD  = 0.30\n    PRIOR_ALPHA         = 9     \
    \ # Beta prior α — FIX-NEW1\n    PRIOR_BETA          = 1      # Beta prior β\n\n    @classmethod\n\
    \    def get_p_target(cls, mode: str) -> float:\n        return cls.P_TARGET.get(mode, 0.70)\n\n\n\
    class ThresholdCalibrator:\n    \"\"\"\n    OPP-16 DIFF_THRESHOLD_CALIBRATION: calibração incremental\
    \ de\n    CRITICAL_THRESHOLD e WARNING_THRESHOLD por modelo e domínio.\n    Modelos diferentes têm\
    \ taxas de falha intrínsecas diferentes —\n    threshold fixo 0.30 pode ser conservador ou liberal\
    \ demais.\n    Estratégia: calibração leve baseada em execuções reais (não MC).\n    Atualiza a cada\
    \ CALIBRATION_INTERVAL blocos executados.\n    \"\"\"\n    DEFAULT_CRITICAL       = 0.30\n    DEFAULT_WARNING\
    \        = 0.50\n    CALIBRATION_MIN_BLOCKS = 20    # mínimo para confiar na calibração\n    CALIBRATION_INTERVAL\
    \   = 50    # reavalia a cada N blocos\n\n    def __init__(self):\n        self._block_history: List[Dict]\
    \ = []\n        self._calibrated: Dict[str, float] = {\n            \"critical\": self.DEFAULT_CRITICAL,\n\
    \            \"warning\":  self.DEFAULT_WARNING,\n        }\n        self._n_since_last_calibration\
    \ = 0\n\n    def record(self, status: str, size: int,\n               epsilon: float, mode: str) ->\
    \ None:\n        self._block_history.append({\n            \"status\": status, \"size\": size,\n \
    \           \"epsilon\": epsilon, \"mode\": mode\n        })\n        self._n_since_last_calibration\
    \ += 1\n        if self._n_since_last_calibration >= self.CALIBRATION_INTERVAL:\n            self._recalibrate()\n\
    \            self._n_since_last_calibration = 0\n\n    def _recalibrate(self) -> None:\n        n\
    \ = len(self._block_history)\n        if n < self.CALIBRATION_MIN_BLOCKS:\n            return\n  \
    \      fail_n  = sum(1 for b in self._block_history if b[\"status\"] != \"OK\")\n        emp_p   =\
    \ fail_n / n\n        # R_acum para bloco de tamanho médio (10 steps)\n        r_mean  = (1.0 - emp_p)\
    \ ** 10\n        # desvio via prop. binomial\n        std_p   = math.sqrt(max(emp_p*(1-emp_p)/n, 1e-12))\n\
    \        std_r   = 10 * std_p * ((1-emp_p) ** 9)\n        critical = max(0.10, round(r_mean - 2.5\
    \ * std_r, 3))\n        warning  = max(critical + 0.10, round(r_mean - 1.5 * std_r, 3))\n        self._calibrated\
    \ = {\"critical\": critical, \"warning\": warning}\n\n    @property\n    def critical_threshold(self)\
    \ -> float:\n        return self._calibrated[\"critical\"]\n\n    @property\n    def warning_threshold(self)\
    \ -> float:\n        return self._calibrated[\"warning\"]\n\n    def get_report(self) -> Dict:\n \
    \       n = len(self._block_history)\n        fail_n = sum(1 for b in self._block_history if b[\"\
    status\"] != \"OK\")\n        return {\n            \"n_blocks\":     n,\n            \"empirical_p\"\
    :  round(fail_n/n, 4) if n > 0 else None,\n            \"critical\":     self._calibrated[\"critical\"\
    ],\n            \"warning\":      self._calibrated[\"warning\"],\n            \"confidence\":   (\"\
    HIGH\" if n>=100 else \"MEDIUM\" if n>=50 else \"LOW\"),\n            \"signal\":       \"[CALIBRATION_REPORT]\"\
    ,\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n# BLOCO 5:\
    \ BUCKET STATS (inalterado)\n# ═══════════════════════════════════════════════════════════════════\n\
    \n@dataclass\nclass BucketStats:\n    ok:   int = 0\n    fail: int = 0\n\n    @property\n    def total(self)\
    \ -> int: return self.ok + self.fail\n\n    @property\n    def fail_rate(self) -> float:\n       \
    \ return self.fail / self.total if self.total else 0.0\n\n    def to_dict(self) -> dict: return {\"\
    ok\": self.ok, \"fail\": self.fail}\n\n    @classmethod\n    def from_dict(cls, d: dict) -> 'BucketStats':\n\
    \        b = cls(); b.ok = d.get(\"ok\", 0); b.fail = d.get(\"fail\", 0)\n        return b\n\n\n#\
    \ ═══════════════════════════════════════════════════════════════════\n# BLOCO 6: RELIABILITY ESTIMATOR\n\
    #   v00.22 EXTENSÃO: credibility_interval() — DIFF_v22_002\n#   Preservados: prior(9,1) FIX-NEW1,\
    \ p_eff=p_base+α·ε\n# ═══════════════════════════════════════════════════════════════════\n\nclass\
    \ ReliabilityEstimator:\n    SIZE_BUCKETS: List[Tuple[int,int]] = [(5,10),(10,15),(15,20),(20,25),(25,31)]\n\
    \n    def __init__(self, config: Optional[ReliabilityConfig] = None,\n                 event_bus:\
    \ Optional[EventBus] = None):\n        self.cfg      = config or ReliabilityConfig()\n        self.bus\
    \      = event_bus\n        self.global_p = self.cfg.INITIAL_GLOBAL_P\n        self.buckets  = {b:\
    \ BucketStats() for b in self.SIZE_BUCKETS}\n        # NOTA: NÃO subscreve event_bus diretamente —\
    \ FIX-QA-A\n        # MCFEReliabilityMonitor é o ÚNICO subscriber de BLOCK_COMPLETED\n\n    def _get_bucket(self,\
    \ size: int) -> Tuple[int,int]:\n        for lo, hi in self.SIZE_BUCKETS:\n            if lo <= size\
    \ < hi: return (lo, hi)\n        return self.SIZE_BUCKETS[-1]\n\n    def register_block(self, size:\
    \ int, success: bool):\n        b = self._get_bucket(size)\n        if success: self.buckets[b].ok\
    \ += 1\n        else:       self.buckets[b].fail += 1\n        self._recompute_global_p()\n\n    def\
    \ _recompute_global_p(self):\n        \"\"\"Bayesian update com prior(α=9, β=1) — FIX-NEW1.\"\"\"\n\
    \        total_ok   = sum(b.ok   for b in self.buckets.values())\n        total_fail = sum(b.fail\
    \ for b in self.buckets.values())\n        total      = total_ok + total_fail\n        self.global_p\
    \ = (\n            (self.cfg.PRIOR_BETA + total_fail) /\n            (self.cfg.PRIOR_ALPHA + self.cfg.PRIOR_BETA\
    \ + total)\n        )\n\n    # OPP-12: pesos por nível de verificação\n    VERIFICATION_WEIGHTS: Dict[str,\
    \ float] = {\n        \"EXECUTED\":  1.0,   # subprocess RC=0, output verificado\n        \"PARTIAL\"\
    :   0.5,   # subprocess com ESCALATE (trajetória interrompida)\n        \"SYNTHETIC\": 0.0,   # sem\
    \ subprocess (EXPRESS/CLARIFY) — não inflaciona R_acum\n    }\n\n    def on_block_completed(self,\
    \ payload: dict):\n        \"\"\"\n        OPP-12 DIFF_VERIFICATION_LEVEL: peso por nível de verificação\
    \ real.\n        SYNTHETIC não inflaciona R_acum — apenas blocos EXECUTED/PARTIAL contam.\n      \
    \  SR_27: R_acum só computado para blocos com weight > 0.\n        \"\"\"\n        size   = int(payload.get(\"\
    size\", 10))\n        status = payload.get(\"status\", \"OK\")\n        vlevel = payload.get(\"verification_level\"\
    , \"EXECUTED\")\n        weight = self.VERIFICATION_WEIGHTS.get(vlevel, 1.0)\n        if weight >\
    \ 0:\n            success = (status == \"OK\")\n            self.register_block(size, success)\n\n\
    \    def get_failure_rate(self, size: int, epsilon: float = 0.0) -> float:\n        bucket = self._get_bucket(size)\n\
    \        stats  = self.buckets[bucket]\n        if stats.total >= self.cfg.MIN_SAMPLES_BUCKET:\n \
    \           p_base = stats.fail_rate\n        else:\n            p_base = 1.0 - (1.0 - self.global_p)\
    \ ** size\n        return min(p_base + self.cfg.ALPHA * epsilon, 1.0)\n\n    def get_success_rate(self,\
    \ size: int, epsilon: float = 0.0) -> float:\n        return 1.0 - self.get_failure_rate(size, epsilon)\n\
    \n    def optimal_size_for_target(self, P_target: float,\n                                min_size:\
    \ int = 5, max_size: int = 30,\n                                epsilon: float = 0.0) -> int:\n  \
    \      if P_target <= 0: return min_size\n        if P_target >= 1: return max_size\n        for n\
    \ in range(max_size, min_size - 1, -1):\n            if self.get_success_rate(n, epsilon) >= P_target:\n\
    \                return n\n        return min_size\n\n    def credibility_interval(self, probabilities:\
    \ List[float],\n                              samples: int = 500,\n                              nu:\
    \ float = 10.0,\n                              n_override: Optional[int] = None) -> Tuple[float, float,\
    \ float]:\n        \"\"\"\n        OPP-01 DIFF_SCIPY_CREDIBILITY: Monte Carlo com scipy.stats.beta.rvs.\n\
    \        OPP-43 DIFF_CHECK_SR15_CACHE: parâmetro n_override adicionado.\n        n_override: se fornecido,\
    \ repete a amostra única n_override vezes\n                    como peso estatístico (equivalente\
    \ a p_list=[p]*n_override\n                    mas sem O(n) de memória). Usado por _check_sr15.\n\n\
    \        Retorna SEMPRE 3 valores: (mean_R, lower_5%, upper_95%).\n        \"\"\"\n        if not\
    \ probabilities:\n            return 1.0, 1.0, 1.0\n        # OPP-43: se n_override fornecido, expandir\
    \ a lista única\n        if n_override is not None and len(probabilities) == 1:\n            probabilities\
    \ = probabilities * n_override\n        try:\n            from scipy.stats import beta as _beta_dist\n\
    \            import numpy as _np\n            mc = _np.ones(samples)\n            for p in probabilities:\n\
    \                alpha_b = max(1.0, p * nu)\n                beta_b  = max(1.0, (1.0 - p) * nu)\n\
    \                mc *= (1.0 - _beta_dist.rvs(alpha_b, beta_b, size=samples))\n            mean_r =\
    \ float(_np.mean(mc))\n            lower  = float(_np.percentile(mc, 5))\n            upper  = float(_np.percentile(mc,\
    \ 95))\n            return mean_r, lower, upper\n        except ImportError:\n            # Fallback:\
    \ Box-Muller (comportamento anterior) se scipy ausente\n            results = []\n            for\
    \ _ in range(samples):\n                prod = 1.0\n                for p in probabilities:\n    \
    \                u1, u2 = random.random(), random.random()\n                    std_approx = math.sqrt(max(p*(1-p)/nu,\
    \ 1e-10))\n                    if u1 > 0 and u2 > 0:\n                        z = math.sqrt(-2*math.log(u1))*math.cos(2*math.pi*u2)\n\
    \                        p_sampled = max(0.0, min(1.0, p+std_approx*z))\n                    else:\n\
    \                        p_sampled = p\n                    prod *= max(0.0, 1.0-p_sampled)\n    \
    \            results.append(prod)\n            results.sort()\n            n = len(results)\n    \
    \        return sum(results)/n, results[int(0.05*n)], results[min(int(0.95*n),n-1)]\n\n    def interpret_credibility(self,\
    \ probabilities: List[float],\n                              threshold: float,\n                 \
    \             samples: int = 500) -> Dict:\n        \"\"\"\n        DIFF_CREDIBILITY_FIX: wrapper\
    \ ergonômico para credibility_interval.\n        Retorna dict com interpretação clara — evita erro\
    \ de desempacotamento.\n\n        threshold: ex: 0.30 (CRITICAL), 0.50 (WARNING)\n        Retorna:\n\
    \          {mean_R, lower_5, upper_95, is_below_threshold, margin, n_blocks}\n        \"\"\"\n   \
    \     mean_r, lower_5, upper_95 = self.credibility_interval(\n            probabilities, samples=samples)\n\
    \        return {\n            \"mean_R\":            round(mean_r, 4),\n            \"lower_5\":\
    \           round(lower_5, 4),\n            \"upper_95\":          round(upper_95, 4),\n         \
    \   \"is_below_threshold\": lower_5 < threshold,\n            \"margin\":             round(lower_5\
    \ - threshold, 4),\n            \"n_blocks\":           len(probabilities),\n            \"confidence_level\"\
    :  (\"LOW\" if len(probabilities) < 5\n                                  else \"MEDIUM\" if len(probabilities)\
    \ < 15\n                                  else \"HIGH\"),\n        }\n\n    def reliability_summary(self)\
    \ -> dict:\n        modes = [\"EXPRESS\",\"FAST\",\"CLARIFY\",\"DEEP\",\"RESEARCH\",\"SCIENTIFIC\"\
    ]\n        opt_sizes = {\n            m: self.optimal_size_for_target(ReliabilityConfig.get_p_target(m))\n\
    \            for m in modes\n        }\n        return {\n            \"total_blocks\": self._total_blocks(),\n\
    \            \"global_p\":     round(self.global_p, 6),\n            \"alpha\":        self.cfg.ALPHA,\n\
    \            \"buckets\": {\n                f\"{lo}-{hi}\": {\n                    \"ok\": self.buckets[(lo,hi)].ok,\n\
    \                    \"fail\": self.buckets[(lo,hi)].fail,\n                    \"total\": self.buckets[(lo,hi)].total,\n\
    \                    \"fail_rate\": round(self.buckets[(lo,hi)].fail_rate, 6)\n                }\n\
    \                for lo, hi in self.SIZE_BUCKETS\n            },\n            \"optimal_sizes_no_eps\"\
    : opt_sizes,\n        }\n\n    def _total_blocks(self) -> int:\n        return sum(b.total for b in\
    \ self.buckets.values())\n\n    def to_dict(self) -> dict:\n        return {\n            \"buckets\"\
    : {\n                f\"{lo}-{hi}\": self.buckets[(lo,hi)].to_dict()\n                for lo, hi in\
    \ self.SIZE_BUCKETS\n            },\n            \"global_p\": self.global_p,\n        }\n\n    @classmethod\n\
    \    def from_dict(cls, data: dict,\n                  config: Optional[ReliabilityConfig] = None,\n\
    \                  event_bus: Optional[EventBus] = None) -> 'ReliabilityEstimator':\n        inst\
    \ = cls(config, event_bus)\n        for key, val in data.get(\"buckets\", {}).items():\n         \
    \   try:\n                lo, hi = map(int, key.split(\"-\"))\n                if (lo, hi) in inst.buckets:\n\
    \                    inst.buckets[(lo, hi)] = BucketStats.from_dict(val)\n            except Exception\
    \ as _e:\n                print(f\"[RELIABILITY_ESTIMATOR] bucket parse error: {type(_e).__name__}:\
    \ {_e}\")\n        inst.global_p = data.get(\"global_p\", inst.global_p)\n        return inst\n\n\n\
    # ═══════════════════════════════════════════════════════════════════\n# BLOCO 7: MCFE STATE (inalterado)\n\
    # ═══════════════════════════════════════════════════════════════════\n\n@dataclass\nclass MCFEState:\n\
    \    \"\"\"\n    DIFF_R_ACUM_HORIZON (OPP-28, BUG-G01):\n    R_acum calculado com JANELA DESLIZANTE\
    \ de N_HORIZON=20 blocos.\n\n    DIFF_SURVIVAL_HISTORY_RENAME (OPP-41, FMEA-03):\n    Campo renomeado:\
    \ reliability_history → survival_history.\n    Motivo: OPP-28 mudou semântica do campo — antes armazenava\
    \ R_acum acumulado,\n    agora armazena (1-p_fail) por bloco (survivals individuais, não acumulados).\n\
    \    Callers que interpretavam reliability_history como R_acum histórico estavam\n    recebendo dados\
    \ incorretos silenciosamente. RPN=160, D=8 (difícil detectar).\n\n    Retrocompatibilidade: to_dict()\
    \ expõe AMBOS os campos durante transição:\n      'survival_history': novo campo correto\n      'reliability_history':\
    \ alias deprecated → mesmo valor (para callers antigos)\n    \"\"\"\n    N_HORIZON: int = 20     \
    \  # janela deslizante\n    current_reliability: float = 1.0\n    survival_history: List[float] =\
    \ field(default_factory=list)\n    early_exit_triggered: bool = False\n    early_exit_reason: str\
    \ = \"\"\n\n    def reset(self):\n        self.current_reliability = 1.0\n        from collections\
    \ import deque as _deque\n        self.survival_history = _deque(maxlen=self.N_HORIZON)  # OPP-56:\
    \ O(1) popleft\n        self.early_exit_triggered = False\n        self.early_exit_reason = \"\"\n\
    \n    def update(self, p_fail_blk: float):\n        \"\"\"\n        OPP-28: R_acum via janela deslizante.\n\
    \        OPP-41: armazena em survival_history (survivals por bloco, não R_acum).\n        Adiciona\
    \ (1-p_fail_blk) ao histórico e recalcula R_acum\n        apenas sobre os últimos N_HORIZON survivals.\n\
    \        \"\"\"\n        survival = max(0.0, 1.0 - p_fail_blk)\n        self.survival_history.append(survival)\n\
    \        # OPP-56: deque(maxlen=N_HORIZON) auto-drops oldest — no explicit pop needed\n        # R_acum\
    \ = produto dos survivals na janela atual\n        r = 1.0\n        for s in self.survival_history:\n\
    \            r *= s\n        self.current_reliability = round(r, 6)\n\n    def to_dict(self) -> dict:\n\
    \        return {\n            \"current_reliability\":  self.current_reliability,\n            \"\
    survival_history\":     self.survival_history[-10:],\n            \"reliability_history\":  self.survival_history[-10:],\
    \  # DEPRECATED alias\n            \"early_exit_triggered\": self.early_exit_triggered,\n        \
    \    \"early_exit_reason\":    self.early_exit_reason,\n            \"window_size\":          len(self.survival_history),\n\
    \            \"horizon\": self.N_HORIZON,\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 8: MCFE RELIABILITY MONITOR\n#   v00.22 EXTENSÃO: usa lower_bound para WARNING/CRITICAL —\
    \ DIFF_v22_002\n#   FIX-QA-A: ÚNICO subscriber de BLOCK_COMPLETED\n#   SR_15: lower_bound apenas quando\
    \ _total_blocks() >= 3\n# ═══════════════════════════════════════════════════════════════════\n\n\
    class MCFEReliabilityMonitor:\n    \"\"\"\n    DIFF_CALIBRATOR_WIRE (GAP-03, OPP-16): ThresholdCalibrator\
    \ conectado.\n    DIFF_WARNING_UNIFY  (GAP-08): check_reliability() usa lower_5 consistente.\n   \
    \ DIFF_MULTI_REPLANNING (GAP-10, OPP-19): _replanning_done → contador+cooldown.\n\n    GAP-03: ThresholdCalibrator\
    \ instanciado; a cada 50 blocos atualiza thresholds.\n    GAP-08: _last_lower_5 cacheado em _check_sr15;\
    \ check_reliability usa o cache.\n    GAP-10: can_replan()/record_replanning() substituem o bool _replanning_done.\n\
    \    FIX-QA-A preservado: ÚNICO subscriber de BLOCK_COMPLETED.\n    SR_15 preservado: lower_bound\
    \ quando >= 3 blocos.\n    \"\"\"\n    CALIBRATION_INTERVAL = 50   # G15: re-calibrar a cada N blocos\n\
    \    MAX_REPLANNINGS      = 3    # GAP-10: máximo replannings por sessão\n    REPLANNING_COOLDOWN\
    \  = 5    # GAP-10: blocos mínimos entre replannings\n\n    def __init__(self, event_bus: EventBus,\n\
    \                 reliability_estimator: ReliabilityEstimator,\n                 mcfe_state: MCFEState,\n\
    \                 warning_threshold: float = 0.50,\n                 critical_threshold: float = 0.30):\n\
    \        self.bus          = event_bus\n        self.estimator    = reliability_estimator\n      \
    \  self.state        = mcfe_state\n        self.warning_thr  = warning_threshold\n        self.critical_thr\
    \ = critical_threshold\n        # GAP-10: substituir bool por contador com cooldown\n        self._replanning_count\
    \        = 0\n        self._last_replanning_block   = -999\n        # GAP-08: cache de lower_5 para\
    \ check_reliability() consistente\n        self._last_lower_5            = None\n        self._blocks_executed\
    \         = 0\n        self._blocks_since_calibration = 0\n        # G15: ThresholdCalibrator conectado\n\
    \        self._calibrator = ThresholdCalibrator()\n        # FIX-QA-A: subscrição única aqui\n   \
    \     self.bus.subscribe(\"BLOCK_COMPLETED\", self._on_block_completed)\n\n    def _on_block_completed(self,\
    \ payload: dict):\n        size      = int(payload.get(\"size\", 10))\n        status_ok = payload.get(\"\
    status\", \"OK\") == \"OK\"\n        epsilon   = payload.get(\"epsilon\", 0.0)\n        # G15: registrar\
    \ no calibrador\n        self._calibrator.record(\n            status  = \"OK\" if status_ok else\
    \ \"FAIL\",\n            size    = size, epsilon = epsilon, mode = \"PRODUCTION\"\n        )\n   \
    \     self._blocks_executed         += 1\n        self._blocks_since_calibration += 1\n        # G15:\
    \ re-calibrar a cada CALIBRATION_INTERVAL blocos\n        if self._blocks_since_calibration >= self.CALIBRATION_INTERVAL:\n\
    \            # OPP-51 DIFF_CALIBRATE_FIX (BUG-2): calibrate() não existe em ThresholdCalibrator.\n\
    \            # Métodos reais: _recalibrate(), critical_threshold (property),\n            # warning_threshold\
    \ (property), get_report(). Chamada corrigida.\n            self._calibrator._recalibrate()\n    \
    \        report = self._calibrator.get_report()\n            cal = {\n                \"warning\"\
    :    self._calibrator.warning_threshold,\n                \"critical\":   self._calibrator.critical_threshold,\n\
    \                \"confidence\": report.get(\"confidence\", \"LOW\"),\n                \"n_blocks\"\
    :   report.get(\"n_blocks\", 0),\n            }\n            if cal.get(\"confidence\") not in (\"\
    LOW\", \"LOW — usando defaults\"):\n                old_w, old_c = self.warning_thr, self.critical_thr\n\
    \                self.warning_thr  = cal[\"warning\"]\n                self.critical_thr = cal[\"\
    critical\"]\n                if abs(old_w - self.warning_thr) > 0.01 or \\\n                   abs(old_c\
    \ - self.critical_thr) > 0.01:\n                    print(f\"[CALIBRATION_REPORT] warning: {old_w:.3f}→{self.warning_thr:.3f}\
    \ \"\n                          f\"critical: {old_c:.3f}→{self.critical_thr:.3f} \"\n            \
    \              f\"(n={cal['n_blocks']} conf={cal['confidence']})\")\n            self._blocks_since_calibration\
    \ = 0\n        p_est_pre = self.estimator.get_failure_rate(size, epsilon)\n        self.estimator.on_block_completed(payload)\n\
    \        self.state.update(p_est_pre)\n        self._check_sr15(payload.get(\"block_id\", \"?\"),\
    \ size)\n\n    def _check_sr15(self, block_id: str, size: int):\n        \"\"\"\n        SR_15 preservado\
    \ + GAP-08: cache lower_5.\n        OPP-43 DIFF_CHECK_SR15_CACHE: eliminar redundância O(n) para O(1).\n\
    \        Antes: p_list = [get_failure_rate(size)] * n_blocks — todos idênticos.\n               credibility_interval\
    \ recebia n_blocks cópias do mesmo valor.\n               Overhead cresce com n_blocks (O(n) desnecessário).\n\
    \        Depois: p_sample único + n_blocks passados para credibility_interval.\n                credibility_interval\
    \ usa n como peso estatístico, não repetição.\n        \"\"\"\n        n_blocks = self.estimator._total_blocks()\n\
    \        R_acum   = self.state.current_reliability\n        if n_blocks >= 3:\n            # OPP-43:\
    \ uma única amostra representativa, n_blocks como peso\n            p_sample = self.estimator.get_failure_rate(size)\n\
    \            _, lower_5, _ = self.estimator.credibility_interval(\n                [p_sample], n_override=n_blocks)\n\
    \            threshold_value = lower_5\n        else:\n            lower_5 = R_acum; threshold_value\
    \ = R_acum\n        # GAP-08: cache para check_reliability()\n        self._last_lower_5 = lower_5\n\
    \        if threshold_value < self.critical_thr:\n            self.state.early_exit_triggered = True\n\
    \            self.state.early_exit_reason = (\n                f\"R_acum={R_acum:.4f} lower_5={threshold_value:.4f}\
    \ < {self.critical_thr:.3f}\")\n            self.bus.emit(\"RELIABILITY_CRITICAL\", {\n          \
    \      \"R_acum\": R_acum, \"lower_bound\": threshold_value,\n                \"threshold\": self.critical_thr,\n\
    \                \"block_id\": block_id, \"action\": \"EARLY_EXIT_FORCED\"\n            })\n     \
    \   elif threshold_value < self.warning_thr:\n            self.bus.emit(\"RELIABILITY_WARNING\", {\n\
    \                \"R_acum\": R_acum, \"lower_bound\": threshold_value,\n                \"threshold\"\
    : self.warning_thr,\n                \"block_id\": block_id, \"action\": \"REPLANNING\"\n        \
    \    })\n\n    def check_reliability(self) -> Optional[str]:\n        \"\"\"\n        GAP-08: usa\
    \ _last_lower_5 consistente com _check_sr15.\n        Antes: usava R_acum direto → assimetria com\
    \ _check_sr15.\n        Depois: lower_5 quando disponível → WARNING alinhado.\n        \"\"\"\n  \
    \      if self.state.early_exit_triggered: return \"EARLY_EXIT\"\n        threshold_value = (self._last_lower_5\n\
    \                           if self._last_lower_5 is not None\n                           else self.state.current_reliability)\n\
    \        if threshold_value < self.warning_thr: return \"WARNING\"\n        return None\n\n    def\
    \ can_replan(self, current_block_idx: int) -> bool:\n        \"\"\"GAP-10: verifica se novo replanning\
    \ é permitido.\"\"\"\n        return (self._replanning_count < self.MAX_REPLANNINGS and\n        \
    \        current_block_idx - self._last_replanning_block\n                >= self.REPLANNING_COOLDOWN)\n\
    \n    def record_replanning(self, current_block_idx: int) -> None:\n        \"\"\"GAP-10: registra\
    \ replanning realizado.\"\"\"\n        self._replanning_count      += 1\n        self._last_replanning_block\
    \  = current_block_idx\n        print(f\"[REPLANNING #{self._replanning_count}/{self.MAX_REPLANNINGS}]\
    \ \"\n              f\"bloco={current_block_idx}\")\n\n    def reset(self):\n        self.state.reset()\n\
    \        self._replanning_count        = 0\n        self._last_replanning_block   = -999\n       \
    \ self._last_lower_5            = None\n        self._blocks_since_calibration = 0\n\n    def get_state(self)\
    \ -> dict:\n        return {\n            \"R_acum\":            round(self.state.current_reliability,\
    \ 6),\n            \"warning_thr\":       self.warning_thr,\n            \"critical_thr\":      self.critical_thr,\n\
    \            \"early_exit\":        self.state.early_exit_triggered,\n            \"early_exit_reason\"\
    : self.state.early_exit_reason,\n            \"history\":           self.state.reliability_history[-5:],\n\
    \            \"replanning_count\":  self._replanning_count,\n            \"last_lower_5\":      (round(self._last_lower_5,\
    \ 6)\n                                  if self._last_lower_5 is not None else None),\n          \
    \  \"calibration\":       self._calibrator.get_report(),\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 9: SNAPSHOT STORE — DIFF_v22_002\n#   Hash SHA256 determinístico, quantização de floats, LRU\
    \ eviction\n#   NOTA: garante rastreabilidade, NÃO isolamento cognitivo real\n#   (LLM single-context\
    \ — limitação conhecida e documentada)\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass SnapshotStore:\n    \"\"\"\n    Armazenamento determinístico de estados intermediários.\n\
    \    FIX-BUG-02: suporte a persist_path para persistência em disco.\n    DIFF_SNAP_VERSION: SCHEMA_VERSION\
    \ + migrate_snapshot() para backward compatibility.\n    DIFF_SNAP_PIN: pin()/unpin() para snapshots\
    \ críticos (rollback_points).\n\n    OPP-46 DIFF_SNAPSHOT_LRU_ORDERDICT: _access_order list → OrderedDict.\n\
    \    Antes: List[str] com list.remove() → O(N) por save/load/evict → O(N²) no evict.\n    Depois:\
    \ OrderedDict onde move_to_end() + popitem() são O(1).\n    Speedup medido: 13.2× para 500 ops com\
    \ 1000 entries.\n\n    persist_path=None: in-memory (backward compatible).\n    persist_path=str:\
    \  carrega no init, salva automaticamente.\n    \"\"\"\n    MAX_ENTRIES    = 1000\n    SCHEMA_VERSION\
    \ = \"v00.25.0\"\n\n    # Campos obrigatórios por snap_type — usados em migrate_snapshot()\n    REQUIRED_FIELDS:\
    \ Dict[str, List[str]] = {\n        \"SNAP_COG\":   [\"mode\"],\n        \"SNAP_VAR\":   [\"agent\"\
    ],\n        \"SNAP_POT\":   [],\n        \"SNAP_REF\":   [\"merge_reasoning\"],\n        \"SNAP_CHAIN\"\
    : [\"chain_type\", \"links\", \"rollback_points\"],\n    }\n\n    def __init__(self, persist_path:\
    \ Optional[str] = None):\n        self._store: Dict[str, dict] = {}\n        # OPP-46: OrderedDict\
    \ para LRU O(1) — substitui List[str]\n        # move_to_end(h) = O(1), popitem(last=False) = O(1),\
    \ h in od = O(1)\n        from collections import OrderedDict as _OD\n        self._lru: \"_OD[str,\
    \ None]\" = _OD()   # keys = hashes em ordem de acesso\n        self._persist_path  = persist_path\n\
    \        self._dirty         = False\n        self._pinned:  set  = set()        # DIFF_SNAP_PIN:\
    \ hashes que não podem ser evictados\n        if persist_path:\n            self._disk_load()\n\n\
    \    def _disk_load(self) -> None:\n        if not self._persist_path or not os.path.exists(self._persist_path):\n\
    \            return\n        try:\n            with open(self._persist_path, \"r\", encoding=\"utf-8\"\
    ) as f:\n                saved = json.load(f)\n            self._store = saved.get(\"store\", {})\n\
    \            # OPP-46: reconstituir OrderedDict preservando ordem\n            from collections import\
    \ OrderedDict as _OD\n            self._lru = _OD((h, None) for h in saved.get(\"access_order\", []))\n\
    \        except (json.JSONDecodeError, IOError, KeyError):\n            from collections import OrderedDict\
    \ as _OD\n            self._store = {}; self._lru = _OD()\n\n    def _disk_save(self) -> None:\n \
    \       if not self._persist_path or not self._dirty:\n            return\n        os.makedirs(os.path.dirname(os.path.abspath(self._persist_path)),\
    \ exist_ok=True)\n        with open(self._persist_path, \"w\", encoding=\"utf-8\") as f:\n       \
    \     json.dump({\"store\": self._store,\n                       \"access_order\": list(self._lru.keys())},\
    \ f)  # OPP-46\n        self._dirty = False\n\n    @classmethod\n    def migrate_snapshot(cls, payload:\
    \ Dict, from_version: str = \"unknown\") -> Dict:\n        \"\"\"\n        DIFF_SNAP_VERSION: Migra\
    \ snapshot de versão antiga para SCHEMA_VERSION atual.\n        Adiciona campos ausentes com defaults\
    \ seguros.\n        Não altera campos existentes — apenas adiciona missing.\n        Retorna payload\
    \ migrado + metadado de migração.\n        \"\"\"\n        migrated = dict(payload)\n        snap_type\
    \ = payload.get(\"snap_type\") or payload.get(\"type\", \"\")\n        required  = cls.REQUIRED_FIELDS.get(snap_type,\
    \ [])\n        added     = []\n        # Adicionar campos obrigatórios ausentes com defaults\n   \
    \     defaults: Dict[str, Any] = {\n            \"merge_reasoning\": \"[migrado de versão anterior\
    \ — reasoning não disponível]\",\n            \"agent\":           \"unknown\",\n            \"mode\"\
    :            \"DEEP\",\n            \"chain_type\":      \"apex_audit_chain\",\n            \"links\"\
    :           [],\n            \"rollback_points\": [],\n        }\n        for field in required:\n\
    \            if field not in migrated:\n                migrated[field] = defaults.get(field, None)\n\
    \                added.append(field)\n        migrated[\"_schema_version\"] = cls.SCHEMA_VERSION\n\
    \        migrated[\"_migrated_from\"]  = from_version\n        if added:\n            migrated[\"\
    _migration_added\"] = added\n        return migrated\n\n    # ── DIFF_SNAP_PIN: pin/unpin para rollback_points\
    \ ─────────────────\n    def pin(self, h: str) -> None:\n        \"\"\"\n        DIFF_SNAP_PIN: Marca\
    \ snapshot como protegido contra evicção LRU.\n        Usar para: rollback_points do AuditChain, SNAP_REF\
    \ de sessão atual.\n        \"\"\"\n        if h in self._store:\n            self._pinned.add(h)\n\
    \n    def unpin(self, h: str) -> None:\n        \"\"\"Remove proteção de evicção. Chamar no STEP_13\
    \ de sessões finalizadas.\"\"\"\n        self._pinned.discard(h)\n\n    def pin_many(self, hashes)\
    \ -> None:\n        \"\"\"\n        Pinna lista de hashes (ex: rollback_points de AuditChain).\n \
    \       Aceita list[str] ou ignora silenciosamente se argumento não for iterável\n        (ex: AuditChain.finalize\
    \ retorna rollback_points como int).\n        \"\"\"\n        if not isinstance(hashes, (list, tuple,\
    \ set)):\n            return  # defensivo: ignora int ou None\n        for h in hashes:\n        \
    \    if isinstance(h, str):\n                self.pin(h)\n\n    def _quantize_float(self, obj: Any,\
    \ places: int = 8) -> Any:\n        if isinstance(obj, float):\n            return round(obj, places)\n\
    \        elif isinstance(obj, list):\n            return [self._quantize_float(x, places) for x in\
    \ obj]\n        elif isinstance(obj, dict):\n            return {k: self._quantize_float(v, places)\
    \ for k, v in obj.items()}\n        return obj\n\n    def _canonical_json(self, obj: Any) -> str:\n\
    \        return json.dumps(obj, sort_keys=True, separators=(',', ':'))\n\n    def save(self, data:\
    \ Any, meta: Optional[dict] = None) -> str:\n        \"\"\"\n        Salva dados e retorna o hash\
