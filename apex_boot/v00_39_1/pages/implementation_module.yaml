    \    SR_23: modos SCIENTIFIC/RESEARCH DEVEM usar AuditChain.\n    \"\"\"\n    ELIGIBLE_MODES = frozenset({\"\
    DEEP\", \"RESEARCH\", \"SCIENTIFIC\"})\n    SR23_CONFIDENCE_CAP = 55\n\n    def __init__(self, session_id:\
