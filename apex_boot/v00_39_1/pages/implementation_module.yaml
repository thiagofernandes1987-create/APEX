    \    ]\n    UNCERTAINTY_MARKERS = [\n        'não sei','não tenho certeza','talvez','pode ser','às\
    \ vezes',\n        'incerto','ambíguo','not sure','maybe','unclear','uncertain',\n        'sometimes','possibly','provavelmente'\n\
    \    ]\n    DATA_NEED_MARKERS = [\n        'dataset','dados históricos','medições','arquivo','real\
    \ data',\n        'observações','csv','database','measurements','série temporal'\n    ]\n    DOMAIN_HIGH_CFI\
    \ = [\n        'microserviços','arquitetura','multi-objetivo','navier-stokes',\n        'bayesiana','mcmc','convergência','estocástico','acoplado',\n\
    \        'redes complexas','epidemiológico','distribuído','hierárquico'\n    ]\n    DOMAIN_SCI = [\n\
    \        'rk4','runge-kutta','lyapunov','lorenz','hamilton',\n        'particle filter','kalman','seird','nsga','navier','stokes',\n\
    \        'monte carlo','séries de fourier','equações de euler'\n    ]\n    # GAP-16: marcadores EN\
    \ adicionados\n    CONNECTOR_MARKERS_EN = [\n        ' and ', ' also ', ' additionally ', ' furthermore\
    \ ',\n        ' including ', ' as well ', ' plus ', ' together with ',\n        ' along with ', '\
    \ combined with '\n    ]\n\n    @classmethod\n    def extract(cls, text: str) -> Dict:\n        t\
    \ = text.lower()\n        n_tokens = len(text.split())\n        n_actions = sum(1 for v in cls.ACTION_VERBS_PT\
    \ + cls.ACTION_VERBS_EN\n                        if re.search(r'\\b' + v + r'\\b', t))\n        #\
    \ GAP-16: conectores PT + EN\n        n_connectors = (t.count(' e ') + t.count(', ') + t.count(' além\
    \ ') +\n                        t.count(' também ') + t.count(' incluindo ') +\n                 \
    \       sum(t.count(c) for c in cls.CONNECTOR_MARKERS_EN))\n        n_numbers  = len(re.findall(r'\\\
    b\\d+\\b', text))\n        n_uncertainty = sum(1 for u in cls.UNCERTAINTY_MARKERS if u in t)\n   \
    \     n_data = sum(1 for d in cls.DATA_NEED_MARKERS if d in t)\n        n_high  = sum(1 for k in cls.DOMAIN_HIGH_CFI\
    \ if k in t)\n        n_sci   = sum(1 for k in cls.DOMAIN_SCI if k in t)\n        length_score = min(1.0,\
    \ n_tokens / 120)\n        wE = min(1.0, n_data * 0.35 + n_uncertainty * 0.12)\n        wD = min(1.0,\
    \ n_actions * 0.18 + n_connectors * 0.04)\n        V  = min(1.0, n_uncertainty * 0.25)\n        complexity\
    \ = min(1.0,\n            length_score * 0.15 + (n_actions/4)*0.25 +\n            (n_numbers/6)*0.08\
    \ + n_high*0.12 + n_sci*0.15)\n        cfi = max(0.0, min(1.0,\n            0.40*complexity + 0.25*wD\
    \ + 0.20*wE + 0.15*V))\n        return {\n            \"cfi_deterministic\": round(cfi, 3),\n    \
    \        \"wE_det\": round(wE, 3),\n            \"wD_det\": round(wD, 3),\n            \"V_conflict_det\"\
    : round(V, 3),\n            \"n_tokens\": n_tokens,\n            \"n_actions\": n_actions,\n     \
    \       \"n_sci\": n_sci,\n            \"n_high\": n_high,\n            \"n_uncertainty\": n_uncertainty,\n\
    \            \"_method\": \"deterministic_v26\",\n            \"_reproducible\": True,\n        }\n\
    \n    @classmethod\n    def select_mode_pre(cls, features: Dict) -> Optional[str]:\n        \"\"\"\
    \n        Pré-seleção de modo baseada apenas em features determinísticas.\n        Retorna None se\
    \ não tiver confiança suficiente → BDS semântico decide.\n        \"\"\"\n        cfi = features[\"\
    cfi_deterministic\"]\n        wE  = features[\"wE_det\"]\n        n_u = features[\"n_uncertainty\"\
    ]\n        n_sci = features[\"n_sci\"]\n        if features[\"n_tokens\"] < 4:                   \
    \ return \"CLARIFY\"\n        if cfi < 0.04 and wE < 0.05:                   return \"EXPRESS\"\n\
    \        if n_u >= 3 and cfi > 0.40:                    return \"FOGGY\"\n        if n_sci >= 2: \
    \                                 return \"SCIENTIFIC\"\n        if cfi > 0.55 and features[\"n_actions\"\
    ] >= 3:  return \"SCIENTIFIC\"\n        if cfi > 0.55:                                  return \"\
    RESEARCH\"\n        # Sem confiança suficiente — delegar ao BDS semântico\n        return None\n\n\
    \n# ═══════════════════════════════════════════════════════════════════\n# PATCH_v23_BUG02 — HMC Dual\
    \ Averaging Adaptivo\n# Calibração automática de step_size para HMC\n# Substitui step_size fixo do\
    \ hmc_step() existente\n# ═══════════════════════════════════════════════════════════════════\n\n\
    class HMCStepSizeAdapter:\n    \"\"\"\n    PATCH_v23_BUG02: Dual averaging para calibração adaptiva\
    \ de step_size HMC.\n    Referência: Hoffman & Gelman (2014) — Algorithm 5 (NUTS).\n    Target acceptance\
    \ rate: 0.65 (HMC) ou 0.80 (NUTS).\n    Python puro — sem numpy.\n    Garante ESS/N > 0.10 (anterior:\
    \ 0.01 com step_size fixo).\n\n    OPP-57 GAP-10 DEPRECATION NOTE: Esta classe tem 0 instanciações\
    \ em todo\n    o módulo. Foi substituída funcionalmente pelo DualAveragingStepAdapter\n    (v00.23+).\
    \ Mantida por retrocompatibilidade e como referência de design.\n    NUNCA remover sem verificar imports\
    \ externos. Candidata a extração para\n    módulo legado em versões futuras.\n    \"\"\"\n    def\
    \ __init__(self, target_rate: float = 0.65, n_leapfrog: int = 10,\n                 sigma_prior: float\
    \ = 0.01):\n        self.target_rate = target_rate\n        self.mu          = math.log(10 * sigma_prior)\n\
    \        self.gamma       = 0.05\n        self.t0          = 10\n        self.kappa       = 0.75\n\
    \        self.H_bar       = 0.0\n        self.ss_bar      = math.exp(self.mu)\n        self.ss   \
    \       = math.exp(self.mu)\n        self.m           = 0  # step counter\n\n    def update(self,\
    \ accept_prob: float) -> float:\n        \"\"\"Atualiza step_size com base na probabilidade de aceitação\
    \ observada.\"\"\"\n        self.m += 1\n        eta     = 1.0 / (self.m + self.t0)\n        self.H_bar\
    \ = (1-eta)*self.H_bar + eta*(self.target_rate - accept_prob)\n        log_ss  = self.mu - math.sqrt(self.m)/self.gamma\
    \ * self.H_bar\n        self.ss = math.exp(log_ss)\n        eta_bar  = self.m ** (-self.kappa)\n \
    \       self.ss_bar = math.exp(eta_bar*log_ss + (1-eta_bar)*math.log(self.ss_bar))\n        return\
    \ self.ss\n\n    def get_final_ss(self) -> float:\n        \"\"\"Retorna step_size estabilizado após\
    \ warm-up.\"\"\"\n        return round(self.ss_bar, 8)\n\n    @staticmethod\n    def recommended_ss(sigma_prior:\
    \ float, n_leapfrog: int = 10) -> float:\n        \"\"\"Regra prática: ss ≈ 0.65^(1/L) × σ_prior.\"\
    \"\"\n        return round(0.65 ** (1.0/max(n_leapfrog,1)) * sigma_prior, 8)\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # PATCH_v23_BUG03 — Lyapunov via perturbação numérica (Benettin)\n# Substitui o método de potência\
    \ simples do Bloco 2 (Problema 1)\n# Confiança: [APPROX 75%] — limitação de Python puro sem scipy\n\
    # Para maior precisão: SR_09 subprocess com scipy.integrate\n# ═══════════════════════════════════════════════════════════════════\n\
    \ndef lyapunov_maximal(f, x0: list, n_steps: int = 4000,\n                     dt: float = 0.01, eps:\
    \ float = 1e-8) -> Dict:\n    \"\"\"\n    DIFF_LYAPUNOV_AUGMENTED (BUG-08, OPP-04):\n    ANTES: x_mid\
    \ fixo no início do bloco → Jacobiana desatualizada intra-bloco\n           → erro 3-8% em sistemas\
    \ caóticos com blocos de 20 steps.\n    DEPOIS: sistema aumentado [x(t); δ(t)] integrado conjuntamente\
    \ →\n           Jacobiana sempre atualizada durante a integração → erro < 2%.\n    Fallback: Euler\
    \ de primeira ordem se scipy ausente (G10).\n    \"\"\"\n    dim = len(x0)\n\n    def _tangent_flow_local(base_x,\
    \ delta_vec):\n        \"\"\"Jacobiana numérica aplicada ao vetor tangente.\"\"\"\n        f0 = f(base_x)\n\
    \        Jd = [0.0] * dim\n        for k in range(dim):\n            perturbed = list(base_x)\n  \
    \          perturbed[k] += eps\n            fk = f(perturbed)\n            for j in range(dim):\n\
    \                Jd[j] += (fk[j] - f0[j]) / eps * delta_vec[k]\n        return Jd\n\n    try:\n  \
    \      from scipy.integrate import solve_ivp\n        import numpy as _np\n        x_curr  = _np.array(x0,\
    \ dtype=float)\n        delta   = _np.random.randn(dim); delta /= _np.linalg.norm(delta)\n       \
    \ lyap_sum = 0.0; t_total = 0.0\n        block_steps = 20\n\n        def augmented_system(t, state):\n\
    \            \"\"\"\n            BUG-08 FIX: integra [x(t); δ(t)] conjuntamente.\n            x evolui\
    \ pela dinâmica f(x).\n            δ evolui pela Jacobiana de f avaliada em x(t) ATUAL —\n       \
    \     Jacobiana sempre atualizada durante a integração.\n            \"\"\"\n            x_s = state[:dim].tolist()\n\
    \            d_s = state[dim:].tolist()\n            fx  = f(x_s)\n            Jd  = _tangent_flow_local(x_s,\
    \ d_s)\n            return fx + Jd  # dim*2\n\n        n_blocks = n_steps // block_steps\n       \
    \ for _ in range(n_blocks):\n            t_span     = (0.0, block_steps * dt)\n            state0_aug\
    \ = _np.concatenate([x_curr, delta])\n            sol = solve_ivp(augmented_system, t_span, state0_aug,\n\
    \                            method='RK45', rtol=1e-8, atol=1e-10,\n                            dense_output=False)\n\
    \            x_next = sol.y[:dim, -1]\n            d_next = sol.y[dim:, -1]\n            norm   =\
    \ _np.linalg.norm(d_next)\n            if norm < 1e-100: break\n            lyap_sum += math.log(norm)\n\
    \            delta     = d_next / norm\n            x_curr    = x_next\n            t_total  += block_steps\
    \ * dt\n        lambda1 = lyap_sum / max(t_total, 1e-10)\n        return {\"lambda1\": round(float(lambda1),4),\n\
    \                \"is_chaotic\": float(lambda1)>0,\n                \"confidence\": \"[APPROX 90%]\"\
    ,\n                \"n_steps\": n_steps, \"method\": \"scipy_RK45_augmented\"}\n    except ImportError:\n\
    \        # G10: Fallback Euler de primeira ordem\n        x = list(x0)\n        delta_fb = [random.gauss(0,1)\
    \ for _ in range(dim)]\n        norm_d   = math.sqrt(sum(v**2 for v in delta_fb))\n        delta_fb\
    \ = [v/norm_d for v in delta_fb]\n        lyap_sum = 0.0\n        for step in range(n_steps):\n  \
    \          fx = f(x)\n            Jd = [0.0]*dim\n            for k in range(dim):\n             \
    \   xp = x[:]\n                xp[k] += eps\n                fxp = f(xp)\n                for j in\
    \ range(dim):\n                    Jd[j] += (fxp[j]-fx[j])/eps * delta_fb[k]\n            x      \
    \ = [x[i]+dt*fx[i] for i in range(dim)]\n            delta_fb= [delta_fb[i]+dt*Jd[i] for i in range(dim)]\n\
    \            norm_d  = math.sqrt(sum(v**2 for v in delta_fb))\n            if norm_d < 1e-100: break\n\
    \            lyap_sum += math.log(norm_d)\n            delta_fb  = [v/norm_d for v in delta_fb]\n\
    \        lambda1 = lyap_sum / (n_steps * dt)\n        return {\"lambda1\": round(lambda1,4), \"is_chaotic\"\
    : lambda1>0,\n                \"confidence\": \"[APPROX 75%]\", \"n_steps\": n_steps, \"method\":\
    \ \"euler_fallback\"}\n\n# OPP-53: cosine_similarity_pure e build_problem_features movidas para antes\
    \ de\n# MemoryIndex (ver acima). Aliases mantidos aqui para retrocompatibilidade de\n# qualquer referência\
    \ que aponte para este escopo de módulo.\n# As funções já estão definidas no escopo módulo acima.\n\
    \nclass SnapRefRetrieval:\n    \"\"\"\n    PATCH_v23_GAP02: Retrieval automático no SNAP_REF por similaridade.\n\
    \    Integra com SnapshotStore existente via to_index() + load().\n    STEP_0: retrieve_for_problem()\
    \ → bias_mode e bias_algo para a sessão.\n    STEP_13: store_experience() → persiste na memória cross-session.\n\
    \    SR_21: SNAPREF_RETRIEVAL_GUARD — retrieval NÃO substitui BDS.\n    É sinal adicional com peso\
    \ ≤0.30 no modo final.\n    \"\"\"\n    MAX_MEMORY  = 100   # máximo de experiências retidas\n   \
    \ TOP_K       = 3     # experiências recuperadas por query\n    MIN_SIM     = 0.70  # threshold de\
    \ similaridade mínima\n\n    def __init__(self, snapshot_store=None):\n        self._store    = snapshot_store\
    \  # SnapshotStore existente\n        self._memory:  List[Dict] = []  # cache in-session\n\n    def\
    \ store_experience(self, features: List[float], mode_used: str,\n                          algo_used:\
    \ str, confidence_final: float,\n                          composite_reward: float, session_id: str)\
    \ -> str:\n        \"\"\"Salva experiência após sessão. Persiste via SnapshotStore.\"\"\"\n      \
    \  exp = {\n            \"features\":         features,\n            \"mode_used\":        mode_used,\n\
    \            \"algo_used\":        algo_used,\n            \"confidence_final\": round(confidence_final,\
    \ 3),\n            \"composite_reward\": round(composite_reward, 4),\n            \"session_id\":\
    \       session_id,\n        }\n        self._memory.append(exp)\n        # Limitar tamanho — manter\
    \ os de maior composite_reward\n        if len(self._memory) > self.MAX_MEMORY:\n            self._memory.sort(key=lambda\
    \ e: e[\"composite_reward\"], reverse=True)\n            self._memory = self._memory[:self.MAX_MEMORY]\n\
    \        # Persistir no SnapshotStore se disponível\n        if self._store:\n            h = self._store.save(exp,\
    \ meta={\"type\":\"SNAP_REF_EXPERIENCE\",\n                                             \"session\"\
    : session_id})\n            return h\n        return hashlib.sha256(json.dumps(exp, sort_keys=True).encode()).hexdigest()\n\
    \n    def retrieve_for_problem(self, features: List[float]) -> List[Dict]:\n        \"\"\"Recupera\
    \ top-k experiências similares. STEP_0.\"\"\"\n        if not self._memory: return []\n        scored\
    \ = [(cosine_similarity_pure(features, e[\"features\"]), e)\n                  for e in self._memory]\n\
    \        scored.sort(key=lambda x: x[0], reverse=True)\n        return [{\"sim\": round(s,4), **e}\n\
    \                for s, e in scored[:self.TOP_K]\n                if s >= self.MIN_SIM]\n\n    def\
    \ suggest_bias(self, retrieved: List[Dict]) -> Dict:\n        \"\"\"\n        Deriva bias de modo\
    \ e algoritmo das experiências recuperadas.\n        SR_21: bias tem peso ≤0.30 — não substitui BDS.\n\
    \        \"\"\"\n        if not retrieved:\n            return {\"bias_mode\": None, \"bias_algo\"\
    : None, \"confidence\": 0.0}\n        # Modo mais comum entre os recuperados (ponderado por composite_reward)\n\
    \        mode_scores:  Dict[str,float] = {}\n        algo_scores:  Dict[str,float] = {}\n        for\
    \ exp in retrieved:\n            w = exp[\"composite_reward\"] * exp[\"sim\"]\n            mode_scores[exp[\"\
    mode_used\"]] = mode_scores.get(exp[\"mode_used\"],0) + w\n            algo_scores[exp[\"algo_used\"\
    ]] = algo_scores.get(exp[\"algo_used\"],0) + w\n        bias_mode = max(mode_scores, key=mode_scores.get)\
    \ if mode_scores else None\n        bias_algo = max(algo_scores, key=algo_scores.get) if algo_scores\
    \ else None\n        top_sim   = retrieved[0][\"sim\"]\n        return {\n            \"bias_mode\"\
    : bias_mode,\n            \"bias_algo\": bias_algo,\n            \"confidence\": round(top_sim * 0.30,\
    \ 4),  # SR_21: peso máximo 0.30\n            \"n_retrieved\": len(retrieved),\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # PATCH_v23_GAP03 — HistoricalSuccessTracker para ModelSelectionEngine\n# MSE agora consulta histórico\
    \ antes de selecionar algoritmo\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass HistoricalSuccessTracker:\n    \"\"\"\n    OPP-08 DIFF_PANDAS_TRACKER: análise estatística\
    \ real com pandas.\n    ANTES: sum/count apenas — sem std, sem percentil, sem groupby.\n    DEPOIS:\
    \ pandas DataFrame com std, score penaliza variância alta.\n      score = mean_reward - 0.5*std  →\
    \ dijkstra estável > dijkstra volátil.\n    Fallback: dict puro se pandas ausente (G10, backward compat).\n\
    \    \"\"\"\n    def __init__(self):\n        self._records: List[Dict] = []\n        self._df_cache\
    \ = None           # pandas DataFrame, invalidado a cada record()\n        # Legado: dict para fallback\
    \ e from_dict backward compat\n        self._history: Dict[tuple, Dict] = {}\n\n    def record(self,\
    \ domain: str, algo: str,\n               confidence: float, reward: float) -> None:\n        self._records.append({\n\
    \            \"domain\": domain, \"algo\": algo,\n            \"confidence\": float(confidence), \"\
    reward\": float(reward),\n        })\n        self._df_cache = None\n        # Manter _history sincronizado\
    \ para backward compat\n        key = (domain, algo)\n        if key not in self._history:\n     \
    \       self._history[key] = {\"n\":0,\"sum_conf\":0.0,\"sum_reward\":0.0}\n        self._history[key][\"\
    n\"]          += 1\n        self._history[key][\"sum_conf\"]   += confidence\n        self._history[key][\"\
    sum_reward\"] += reward\n\n    def _get_df(self):\n        if self._df_cache is None:\n          \
    \  try:\n                import pandas as _pd\n                self._df_cache = (_pd.DataFrame(self._records)\n\
    \                                  if self._records else _pd.DataFrame())\n            except ImportError:\n\
    \                self._df_cache = None\n        return self._df_cache\n\n    def get_best_algo(self,\
    \ domain: str, candidates: List[str]) -> Optional[str]:\n        \"\"\"\n        Retorna melhor algoritmo\
    \ por score = mean_reward - 0.5*std.\n        Penaliza variância alta (dijkstra instável ≠ dijkstra\
    \ estável).\n        Requer n >= 2 amostras por algoritmo.\n        \"\"\"\n        df = self._get_df()\n\
    \        if df is not None and len(df) > 0:\n            try:\n                import pandas as _pd\n\
    \                mask = (df[\"domain\"]==domain) & (df[\"algo\"].isin(candidates))\n             \
    \   sub  = df[mask].groupby(\"algo\")[\"reward\"].agg(\n                    mean=\"mean\", std=\"\
    std\", n=\"count\"\n                )\n                sub = sub[sub[\"n\"] >= 2]\n              \
    \  if sub.empty: return None\n                sub[\"score\"] = sub[\"mean\"] - 0.5 * sub[\"std\"].fillna(0)\n\
    \                return str(sub[\"score\"].idxmax())\n            except Exception as _e:\n      \
    \          print(f\"[HIST_TRACKER] pandas path error: {type(_e).__name__}: {_e}\")\n        # Fallback:\
    \ dict puro\n        scores = {}\n        for algo in candidates:\n            key = (domain, algo)\n\
    \            if key in self._history and self._history[key][\"n\"] >= 2:\n                d = self._history[key]\n\
    \                scores[algo] = d[\"sum_reward\"] / d[\"n\"]\n        return max(scores, key=scores.get)\
    \ if scores else None\n\n    def get_stats(self, domain: Optional[str] = None) -> Dict:\n        \"\
    \"\"Retorna estatísticas completas por (domain, algo).\"\"\"\n        df = self._get_df()\n      \
    \  if df is not None and len(df) > 0:\n            try:\n                if domain: df = df[df[\"\
    domain\"]==domain]\n                return (df.groupby([\"domain\",\"algo\"])[\"reward\"]\n      \
    \                    .agg(mean=\"mean\", std=\"std\", n=\"count\",\n                             \
    \  p25=lambda x: x.quantile(0.25))\n                          .round(4).to_dict(\"index\"))\n    \
    \        except Exception as _e:\n                print(f\"[HIST_TRACKER] get_stats pandas error:\
    \ {type(_e).__name__}: {_e}\")\n        return {}\n\n    def to_dict(self) -> Dict:\n        \"\"\"\
    Serialização — exporta _records para SMS.\"\"\"\n        return {\"records\": self._records}\n\n \
    \   @classmethod\n    def from_dict(cls, data: Dict) -> \"HistoricalSuccessTracker\":\n        inst\
    \ = cls()\n        # Formato novo (com records)\n        for rec in data.get(\"records\", []):\n \
    \           if all(k in rec for k in (\"domain\",\"algo\",\"confidence\",\"reward\")):\n         \
    \       inst.record(rec[\"domain\"], rec[\"algo\"],\n                            rec[\"confidence\"\
    ], rec[\"reward\"])\n        # Backward compat: formato antigo \"domain|algo\" → records\n       \
    \ for key, v in data.items():\n            if \"|\" in key and key != \"records\":\n             \
    \   d, a = key.split(\"|\", 1)\n                n = int(v.get(\"n\", 0))\n                if n > 0:\n\
    \                    avg_r = v.get(\"sum_reward\", 0) / n\n                    avg_c = v.get(\"sum_conf\"\
    , 0) / n\n                    for _ in range(min(n, 3)):  # max 3 registros sintéticos\n         \
    \               inst.record(d, a, avg_c, avg_r)\n        return inst\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # DIFF_BDE_PYTHON (GAP-05): BehavioralDifficultyEstimator\n#   DIFF_v22_004 era ADOPTED mas sem implementação\
    \ Python.\n#   Implementa: bde_score via Jaccard de keywords + difficulty refs.\n#   fused_cfi = 0.6*CFI\
    \ + 0.4*bde_score\n#   G8: ativado SOMENTE quando CFI_preliminar IN (0.35, 0.60).\n#   SR_32: DIFF_v22_004\
    \ agora é TRULY ADOPTED com código Python real.\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass BehavioralDifficultyEstimator:\n    \"\"\"\n    DIFF_BDE_PYTHON (GAP-05, DIFF_v22_004):\n\
    \    Implementação Python do BDE (antes apenas spec YAML).\n    Estima dificuldade comportamental\
    \ via similaridade Jaccard entre\n    keywords do problema e referências de dificuldade conhecida.\n\
    \    fused_cfi = 0.6*CFI + 0.4*bde_score (conforme spec DIFF_v22_004).\n    G8: ativado SOMENTE quando\
    \ CFI_preliminar IN (0.35, 0.60).\n    SR_32: módulo real — DIFF_v22_004 reclassificado de SPEC_ONLY\
    \ para ADOPTED.\n    \"\"\"\n    DIFFICULTY_REFS: Dict[str, Dict] = {\n        \"logistic_growth\"\
    : {\n            \"keywords\": {\"logistic\",\"crescimento\",\"logístico\",\"ode\",\"dx/dt\",\n  \
    \                       \"k\",\"r\",\"população\",\"capacidade\"},\n            \"difficulty\": 0.35\n\
    \        },\n        \"lotka_volterra\": {\n            \"keywords\": {\"lotka\",\"volterra\",\"predador\"\
    ,\"presa\",\"alpha\",\n                         \"beta\",\"delta\",\"gamma\",\"ciclo\",\"dx/dt\",\"\
    dy/dt\"},\n            \"difficulty\": 0.55\n        },\n        \"navier_stokes\": {\n          \
    \  \"keywords\": {\"navier\",\"stokes\",\"turbulência\",\"fluido\",\"reynolds\",\n               \
    \          \"pressão\",\"viscosidade\",\"pde\"},\n            \"difficulty\": 0.92\n        },\n \
    \       \"optimization_simple\": {\n            \"keywords\": {\"minimizar\",\"maximizar\",\"otimizar\"\
    ,\"custo\",\"objetivo\",\n                         \"variável\",\"restrição\"},\n            \"difficulty\"\
    : 0.40\n        },\n        \"optimization_combinatorial\": {\n            \"keywords\": {\"tsp\"\
    ,\"caixeiro\",\"mochila\",\"knapsack\",\"combinatória\",\n                         \"np-hard\",\"\
    discreto\",\"roteamento\"},\n            \"difficulty\": 0.70\n        },\n        \"linear_algebra\"\
    : {\n            \"keywords\": {\"matriz\",\"autovalor\",\"eigenvalue\",\"decomposição\",\n      \
    \                   \"svd\",\"lu\",\"ax=b\",\"sistema linear\"},\n            \"difficulty\": 0.30\n\
    \        },\n        \"stochastic_simulation\": {\n            \"keywords\": {\"estocástico\",\"monte\
    \ carlo\",\"amostrar\",\"distribuição\",\n                         \"mcmc\",\"bayesiano\",\"probabilidade\"\
    },\n            \"difficulty\": 0.60\n        },\n    }\n\n    @staticmethod\n    def _extract_keywords(text:\
    \ str) -> set:\n        \"\"\"Extrai conjunto de keywords (tokens normalizados, len>=3).\"\"\"\n \
    \       import re\n        tokens = re.findall(r'\\b\\w{3,}\\b', text.lower())\n        return set(tokens)\n\
    \n    @staticmethod\n    def _jaccard(set_a: set, set_b: set) -> float:\n        \"\"\"Similaridade\
    \ de Jaccard entre dois conjuntos.\"\"\"\n        if not set_a or not set_b: return 0.0\n        inter\
    \ = len(set_a & set_b)\n        union = len(set_a | set_b)\n        return inter / union if union\
    \ > 0 else 0.0\n\n    @classmethod\n    def estimate(cls, problem_text: str, cfi_preliminary: float)\
    \ -> Dict:\n        \"\"\"\n        Estima bde_score e fused_cfi para o problema.\n        G8: BDE\
    \ ativado SOMENTE quando CFI_preliminar IN (0.35, 0.60).\n        Returns: dict com active, bde_score,\
    \ fused_cfi, best_ref, signal.\n        \"\"\"\n        # G8: BDE_ZONE_GUARD\n        if not (0.35\
    \ < cfi_preliminary < 0.60):\n            return {\n                \"active\":      False,\n    \
    \            \"bde_score\":   cfi_preliminary,\n                \"fused_cfi\":   cfi_preliminary,\n\
    \                \"best_ref\":    None,\n                \"jaccard_sim\": 0.0,\n                \"\
    signal\":      \"[BDE_ZONE_GUARD: G8 — CFI fora da zona BDE (0.35, 0.60)]\"\n            }\n     \
    \   keywords_problem = cls._extract_keywords(problem_text)\n        best_ref = None; best_sim = -1.0;\
    \ best_diff = 0.35\n        for ref_name, ref_data in cls.DIFFICULTY_REFS.items():\n            sim\
    \ = cls._jaccard(keywords_problem, ref_data[\"keywords\"])\n            if sim > best_sim:\n     \
    \           best_sim = sim; best_ref = ref_name\n                best_diff = ref_data[\"difficulty\"\
    ]\n        # Se similaridade muito baixa (<0.10): usar média das refs\n        if best_sim < 0.10:\n\
    \            bde_score = sum(r[\"difficulty\"] for r in\n                            cls.DIFFICULTY_REFS.values())\
    \ / len(cls.DIFFICULTY_REFS)\n            best_ref = \"average_fallback\"\n        else:\n       \
    \     bde_score = best_diff\n        # fused_cfi = 0.6*CFI + 0.4*bde_score (spec DIFF_v22_004)\n \
    \       fused_cfi = min(1.0, 0.6 * cfi_preliminary + 0.4 * bde_score)\n        return {\n        \
    \    \"active\":      True,\n            \"bde_score\":   round(bde_score, 4),\n            \"fused_cfi\"\
    :   round(fused_cfi, 4),\n            \"best_ref\":    best_ref,\n            \"jaccard_sim\": round(best_sim,\
    \ 4),\n            \"signal\":      f\"[BDE_ACTIVE: bde={bde_score:.3f} \"\n                     \
    \      f\"fused_cfi={fused_cfi:.3f} ref={best_ref}]\"\n        }\n\nclass MCMCDiagnostics:\n    \"\
    \"\"\n    PATCH_v23_GAP04: Diagnóstico de cadeias MCMC em Python puro.\n    ESS (Effective Sample\
    \ Size) via autocorrelação integrada.\n    R̂ (Gelman-Rubin) para múltiplas cadeias (opcional).\n\
    \    SR_22: ESS_GUARD — emite [MCMC_ESS_WARNING] se ESS/N < 0.10.\n    \"\"\"\n    ESS_WARNING_THRESHOLD\
    \ = 0.10\n    AC_CUTOFF             = 0.05  # parar soma quando AC cai abaixo\n\n    @classmethod\n\
    \    def compute_ess(cls, samples: List[float]) -> Tuple[float, float, str]:\n        \"\"\"\n   \
    \     Retorna (ESS, ESS_ratio, signal).\n        ESS = N / (1 + 2·Σ ρ_k) onde ρ_k é autocorrelação\
    \ no lag k.\n        \"\"\"\n        n = len(samples)\n        if n < 4: return float(n), 1.0, \"\
    OK\"\n        m   = sum(samples)/n\n        var = sum((s-m)**2 for s in samples)/n\n        if var\
    \ < 1e-15: return 1.0, 1.0/n, \"[MCMC_CONSTANT_CHAIN]\"\n        rho_sum = 1.0\n        for lag in\
    \ range(1, min(n//3, 500)):\n            rho = (sum((samples[i]-m)*(samples[i+lag]-m)\n          \
    \             for i in range(n-lag)) / (n*var))\n            if rho < cls.AC_CUTOFF: break\n     \
    \       rho_sum += 2*rho\n        ess       = n / max(rho_sum, 1.0)\n        ess_ratio = ess / n\n\
    \        signal    = (\"[MCMC_ESS_WARNING]\" if ess_ratio < cls.ESS_WARNING_THRESHOLD\n          \
    \           else \"OK\")\n        return round(ess,1), round(ess_ratio,4), signal\n\n    @classmethod\n\
    \    def autocorr_lag1(cls, samples: List[float]) -> float:\n        n = len(samples)\n        if\
    \ n < 3: return 0.0\n        m   = sum(samples)/n\n        var = sum((s-m)**2 for s in samples)/n\n\
    \        if var < 1e-15: return 1.0\n        return round(sum((samples[i]-m)*(samples[i+1]-m)\n  \
    \                       for i in range(n-1)) / (n*var), 4)\n\n    @classmethod\n    def gelman_rubin(cls,\
    \ chains: List[List[float]]) -> float:\n        \"\"\"R̂ para múltiplas cadeias. R̂ < 1.10 indica\
    \ convergência.\"\"\"\n        if len(chains) < 2: return 1.0\n        n = min(len(c) for c in chains)\n\
    \        M = len(chains)\n        chain_means = [sum(c[:n])/n for c in chains]\n        grand_mean\
    \  = sum(chain_means)/M\n        B = n * sum((m-grand_mean)**2 for m in chain_means) / (M-1)\n   \
    \     W = sum(sum((chains[j][i]-chain_means[j])**2\n                    for i in range(n)) / (n-1)\n\
    \                for j in range(M)) / M\n        var_hat = (n-1)/n * W + B/n\n        return round(math.sqrt(var_hat/max(W,1e-15)),\
    \ 4) if W > 0 else 1.0\n\n    @classmethod\n    def full_report(cls, samples: List[float],\n     \
    \               chains: Optional[List[List[float]]] = None) -> Dict:\n        ess, ess_ratio, signal\
    \ = cls.compute_ess(samples)\n        ac1  = cls.autocorr_lag1(samples)\n        rhat = cls.gelman_rubin(chains)\
    \ if chains else None\n        return {\n            \"ESS\": ess, \"ESS_ratio\": ess_ratio,\n   \
    \         \"AC_lag1\": ac1, \"Rhat\": rhat,\n            \"signal\": signal,\n            \"n_samples\"\
    : len(samples),\n            \"n_effective\": int(ess),\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # PATCH_v23_GAP06 — ParameterIdentifiabilityChecker\n# Detecta não-identificabilidade via curvatura\
    \ + teste de superfície\n# ═══════════════════════════════════════════════════════════════════\n\n\
    class ParameterIdentifiabilityChecker:\n    \"\"\"\n    OPP-05 DIFF_SCIPY_HESSIAN: checker via Hessiana\
    \ numérica real.\n    ANTES: perturbação manual (p[i]+d,p[j]-d) → falso positivo em funções\n    \
    \       com simetria rotacional (p0²+p1² detectado como degenerado).\n    DEPOIS: Hessiana via diferenças\
    \ finitas de 2ª ordem + eigvalsh scipy.\n            is_degenerate = eigenvalor mínimo < 1e-6 (direção\
    \ sem curvatura real).\n    Fallback: perturbação manual se scipy ausente (G10).\n    \"\"\"\n   \
    \ DEGENERACY_EIGENVALUE_THRESHOLD = 1e-6\n    FINITE_DIFF_DELTA               = 1e-4\n\n    @classmethod\n\
    \    def check(cls, cost_func, x0: list,\n              delta: float = None) -> Dict:\n        delta\
    \ = delta or cls.FINITE_DIFF_DELTA\n        n = len(x0)\n        try:\n            from scipy.linalg\
    \ import eigvalsh\n            import numpy as _np\n            x0a = _np.array(x0, dtype=float)\n\
    \            H   = _np.zeros((n, n))\n            for i in range(n):\n                ei = _np.zeros(n);\
    \ ei[i] = delta\n                for j in range(n):\n                    ej = _np.zeros(n); ej[j]\
    \ = delta\n                    H[i,j] = (cost_func((x0a+ei+ej).tolist())\n                       \
    \       - cost_func((x0a+ei-ej).tolist())\n                              - cost_func((x0a-ei+ej).tolist())\n\
    \                              + cost_func((x0a-ei-ej).tolist())) / (4*delta**2)\n            # Forçar\
    \ simetria numérica\n            H = (H + H.T) / 2\n            eigenvalues = eigvalsh(H)\n      \
    \      min_eig     = float(eigenvalues[0])\n            is_degen    = min_eig < cls.DEGENERACY_EIGENVALUE_THRESHOLD\n\
    \            return {\n                \"is_degenerate\":   is_degen,\n                \"min_eigenvalue\"\
    :  round(min_eig, 8),\n                \"eigenvalues\":     [round(float(e),6) for e in eigenvalues],\n\
    \                \"curvatures_diag\": [round(float(H[i,i]),6) for i in range(n)],\n              \
    \  \"min_curvature\":   round(float(H.diagonal().min()),6),\n                \"has_surface\":    \
    \ is_degen,\n                \"surface_delta_min\": round(abs(min_eig),6),\n                \"signal\"\
    : \"[PARAM_DEGENERACY_WARNING]\" if is_degen else \"OK\",\n                \"method\": \"scipy_hessian_eigvalsh\"\
    ,\n            }\n        except ImportError:\n            # Fallback: perturbação manual (comportamento\
    \ anterior)\n            curvatures = []\n            for i in range(n):\n                xp = x0[:];\
    \ xp[i] += delta\n                xm = x0[:]; xm[i] -= delta\n                curv = (cost_func(xp)\
    \ - 2*cost_func(x0) + cost_func(xm)) / delta**2\n                curvatures.append(curv)\n       \
    \     min_curv    = min(curvatures)\n            has_surface = False\n            surf_min    = float('inf')\n\
    \            for i in range(n):\n                for j in range(i+1,n):\n                    xpp =\
    \ x0[:]; xpp[i]+=delta; xpp[j]+=delta\n                    xpm = x0[:]; xpm[i]+=delta; xpm[j]-=delta\n\
    \                    xmp = x0[:]; xmp[i]-=delta; xmp[j]+=delta\n                    xmm = x0[:]; xmm[i]-=delta;\
    \ xmm[j]-=delta\n                    d = abs(cost_func(xpp)+cost_func(xmm)-cost_func(xpm)-cost_func(xmp))\n\
    \                    surf_min = min(surf_min, d)\n                    if d < 1e-8 * (abs(cost_func(xpp))+1e-12):\
    \ has_surface=True\n            is_degen = min_curv < 0.1 or has_surface\n            return {\n \
    \               \"is_degenerate\":   is_degen,\n                \"curvatures_diag\": [round(c,6) for\
    \ c in curvatures],\n                \"min_curvature\":   round(min_curv,6),\n                \"has_surface\"\
    :     has_surface,\n                \"surface_delta_min\": round(surf_min,6),\n                \"\
    signal\": \"[PARAM_DEGENERACY_WARNING]\" if is_degen else \"OK\",\n                \"method\": \"\
    manual_fallback\",\n            }\n\n# OPP-52 DIFF_AGENT_REQUIRED_FIELDS (BUG-3): AGENT_REQUIRED_FIELDS\
    \ era referenciado\n# em AgentContractValidator.validate() com 0 definições no módulo.\n# Definido\
    \ na spec YAML mas nunca transposto para código Python → NameError em runtime.\n# Adicionado aqui\
    \ antes da classe que o referencia.\nAGENT_REQUIRED_FIELDS: Dict[str, List[str]] = {\n    \"default\"\
    :       [\"confidence\", \"findings\"],\n    \"pmi_pm\":        [\"scope\", \"priority_areas\", \"\
    confidence\"],\n    \"architect\":     [\"findings\", \"confidence\", \"recommendations\"],\n    \"\
    researcher\":    [\"findings\", \"confidence\", \"sources\"],\n    \"theorist\":      [\"hypotheses\"\
    , \"confidence\"],\n    \"engineer\":      [\"findings\", \"confidence\", \"implementation_notes\"\
    ],\n    \"critic\":        [\"findings\", \"confidence\", \"objections\"],\n    \"meta_reasoning\"\
    :[\"findings\", \"confidence\", \"rules_checked\"],\n}\n\nclass AgentContractValidator:\n    \"\"\"\
    \n    PATCH_v23_GAP07: Validador leve de contratos de agente.\n    Verifica presença de campos obrigatórios\
    \ por role.\n    NÃO valida tipos nem schema completo (muito prescritivo para LLM).\n    STEP_11:\
    \ meta_reasoning chama validate_all() antes do output final.\n    Se campo ausente → [CONTRACT_FIELD_MISSING:\
    \ role, field] + confidence_cap 55.\n    \"\"\"\n    @classmethod\n    def validate(cls, agent_role:\
    \ str, output: Dict) -> Dict:\n        required = AGENT_REQUIRED_FIELDS.get(\n            agent_role,\
    \ AGENT_REQUIRED_FIELDS[\"default\"])\n        missing = [f for f in required if f not in output]\n\
    \        return {\n            \"agent_role\": agent_role,\n            \"valid\": len(missing) ==\
    \ 0,\n            \"missing_fields\": missing,\n            \"signal\": (f\"[CONTRACT_FIELD_MISSING:\
    \ {agent_role}, {missing}]\"\n                       if missing else \"OK\"),\n            \"confidence_cap\"\
    : 55 if missing else None,\n        }\n\n    @classmethod\n    def validate_all(cls, agent_outputs:\
    \ Dict[str, Dict]) -> Dict:\n        results  = {role: cls.validate(role, out)\n                 \
    \   for role, out in agent_outputs.items()}\n        has_fail = any(not r[\"valid\"] for r in results.values())\n\
    \        return {\n            \"all_valid\": not has_fail,\n            \"results\":   results,\n\
    \            \"signals\":   [r[\"signal\"] for r in results.values() if r[\"signal\"] != \"OK\"],\n\
    \        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n# PATCH_v23_GAP08\
    \ — SelfReflectionEngine + composite_reward\n# STEP_13: calcula composite_reward auditável e detecta\
    \ tendências\n# ═══════════════════════════════════════════════════════════════════\n\nclass SelfReflectionEngine:\n\
    \    \"\"\"\n    PATCH_v23_GAP08: Análise de desempenho da sessão para STEP_13.\n    Fórmula: reward\
    \ = accuracy - 0.20*cost - 0.30*instability\n      accuracy    = confidence_final/100\n      cost\
    \        = tokens_used/token_budget\n      instability = 1 - R_acum\n    Adicionalmente detecta tendências\
    \ nos logs da sessão.\n    Emite sugestões de ajuste para a próxima sessão.\n    \"\"\"\n    @staticmethod\n\
    \    def compute_composite_reward(confidence_final: float,\n                                  R_acum:\
    \ float,\n                                  tokens_used: int,\n                                  token_budget:\
    \ int) -> Dict:\n        accuracy    = min(1.0, confidence_final / 100.0)\n        cost        = min(1.0,\
    \ tokens_used / max(token_budget, 1))\n        instability = max(0.0, 1.0 - R_acum)\n        reward\
    \ = accuracy - 0.20*cost - 0.30*instability\n        return {\n            \"composite_reward\": round(reward,\
    \ 4),\n            \"accuracy\":          round(accuracy, 3),\n            \"cost_penalty\":     \
    \ round(0.20*cost, 3),\n            \"instability_penalty\":round(0.30*instability, 3),\n        \
    \    \"formula\": \"reward = accuracy - 0.20*cost - 0.30*instability\",\n        }\n\n    @staticmethod\n\
    \    def variance_pure(values: List[float]) -> float:\n        if len(values) < 2: return 0.0\n  \
    \      m = sum(values)/len(values)\n        return sum((v-m)**2 for v in values)/len(values)\n\n \
    \   @classmethod\n    def analyze_session(cls, reward_history: List[float],\n                    \
    \     confidence_history: List[float]) -> Dict:\n        \"\"\"Detecta tendências e emite sugestões.\"\
    \"\"\n        suggestions = []\n        if len(reward_history) >= 3:\n            trend = reward_history[-1]\
    \ - reward_history[0]\n            instab = cls.variance_pure(reward_history)\n            if instab\
    \ > 0.10:\n                suggestions.append(\"REDUCE_P_CHAOS: alta variância de reward\")\n    \
    \        if trend < -0.10:\n                suggestions.append(\"REVIEW_MODE_SELECTION: reward decrescente\"\
    )\n        if len(confidence_history) >= 3:\n            mean_conf = sum(confidence_history)/len(confidence_history)\n\
    \            if mean_conf < 55:\n                suggestions.append(\"ESCALATE_MODE: confiança sistematicamente\
    \ baixa\")\n        return {\n            \"reward_trend\": round(reward_history[-1]-reward_history[0],4)\n\
    \                            if len(reward_history)>=2 else None,\n            \"reward_variance\"\
    : round(cls.variance_pure(reward_history),4),\n            \"mean_confidence\": round(sum(confidence_history)/max(len(confidence_history),1),1),\n\
    \            \"suggestions\": suggestions,\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # VALIDAÇÃO FINAL — todos os módulos em Python puro\n# ═══════════════════════════════════════════════════════════════════\n\
    \n\ndef run_fmea_suite():\n    \"\"\"Suíte FMEA v00.22 — 10 cenários de validação.\"\"\"\n    params\
    \ = {\"alpha\":0.5,\"beta\":0.02,\"delta\":0.01,\"gamma\":0.4}\n    results = []\n\n    def t(label,\
