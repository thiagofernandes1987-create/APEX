    \n    def fit(self) -> bool:\n        \"\"\"\n        Tenta sklearn (OPP-06) → numpy lstsq (OPP-03)\
    \ → Gauss puro (fallback).\n        G10: sem exception se bibliotecas ausentes.\n        \"\"\"\n\
    \        return self._try_sklearn_fit() or self._try_numpy_fit() or self._pure_fit()\n\n    def predict(self,\
    \ params: list) -> Optional[float]:\n        \"\"\"\n        SR_26: em SCIENTIFIC, verifica r² >=\
    \ 0.70 antes de retornar.\n        Emite [NLM_POOR_FIT_WARNING] se r² < 0.70.\n        \"\"\"\n  \
    \      if not self.is_fitted: return None\n        # sklearn path\n        if self._pipeline is not\
