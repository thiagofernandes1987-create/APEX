    \ self._normalize_params(params)\n        feats = self._build_features(pn)\n        y_norm = sum(c*f\
    \ for c,f in zip(self.coeffs, feats))\n        val = y_norm * self._energy_std + self._energy_mean\n\
    \        if self.r_squared is not None and self.r_squared < 0.70:\n            print(f\"[NLM_POOR_FIT_WARNING:\
    \ r²={self.r_squared:.3f} < 0.70]\")\n        return val\n\n    def find_minimum(self, bounds: List[tuple],\
    \ n_grid: int = 50) -> Optional[list]:\n        \"\"\"\n        DIFF_NLM_MINIMIZE (GAP-07, OPP-21):\n\
