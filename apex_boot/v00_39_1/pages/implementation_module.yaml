    \            reliability_estimator: ReliabilityEstimator,\n            P_target: float, epsilon: float\
    \ = 0.0,\n            eps_callback: Optional[callable] = None) -> List[Block]:\n        \"\"\"\n \
    \       DIFF_ADAPTIVE_NREL (GAP-11, OPP-18): n_rel recalculado no loop.\n        DIFF_EPS_CALLBACK\
