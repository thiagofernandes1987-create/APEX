    \            self._pinned.discard(h)\n        # Decrementar TTL dos sobreviventes\n        for h in\
    \ list(self._store):\n            m = self._store[h].get(\"meta\",{})\n            if m.get(\"purgeable\"\
    ) and \"ttl\" in m:\n                self._store[h][\"meta\"][\"ttl\"] -= 1\n        self._dirty =\
    \ True\n        return len(to_purge)\n\n    def _evict_lru(self):\n        \"\"\"\n        DIFF_SNAP_PIN:\
    \ Remove entradas LRU. Pinned NUNCA evictados.\n        OPP-46 DIFF_SNAPSHOT_LRU_ORDERDICT: O(N²)\
    \ → O(N).\n        Antes: list.remove() O(N) em loop → O(N²) total.\n        Depois: OrderedDict.popitem(last=False)\
    \ → O(1) por evicção.\n        Fase 1: evictar purgeables (preferencial).\n        Fase 2: LRU ordenado\
    \ — menor acesso primeiro via OrderedDict.\n        \"\"\"\n        to_remove = len(self._store) -\
    \ self.MAX_ENTRIES\n        evicted   = 0\n        # Fase 1: evictar purgeables primeiro (O(N) scan,\
