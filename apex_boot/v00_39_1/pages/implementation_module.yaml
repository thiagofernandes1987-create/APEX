    \ else \"FAIL\", msg))\n        except Exception as e:\n            results.append((label, \"ERROR\"\
    , str(e)[:60]))\n\n    # OPP-54 DIFF_FMEA_LAMBDA_FIX (BUG-5): lambda FIX-NEW1 estava quebrada.\n \
