    \ → ~4.4s.\n        Depois:\n          Path 1 (sklearn+scipy): L-BFGS-B O(n_params*iter) — muito eficiente.\n\
    \          Path 2 (sklearn only):  grid numpy vetorizado.\n          Path 3 (fallback):      grid\
