    \ PASS (YAML) + regressão base\n# ═══════════════════════════════════════════════════════════════════\n\
    \n# ── DIFF_CHAIN_001 — ChainLink + AuditChain ──────────────────────────\n# # Inserir após a classe\
    \ SnapshotStore no apex_v00_23.py\n# SR_23: modos SCIENTIFIC/RESEARCH devem registrar 1+ ChainLink\
    \ por step\n\n@dataclass\nclass ChainLink:\n    \"\"\"\n    DIFF_CHAIN_001: Unidade atômica de rastreamento\
