    \ se tier=='C' → não retorna func (confidence_cap 45).\n        \"\"\"\n        # BUG-03: guard para\
    \ input inválido\n        if not isinstance(problem_description, str) or not problem_description.strip():\n\
    \            return None\n        features = cls.extract_features(problem_description)\n        p_type\
