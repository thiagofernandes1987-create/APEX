    \          self.MIN_SIZE,self.MAX_SIZE)\n            e = min(s+opt, n_total)\n            blocks.append(Block(f\"\
    {prefix}_{k}\",s,e)); s=e; k+=1\n        return blocks\n\n    def decompose_adaptive_reliability(\n\
