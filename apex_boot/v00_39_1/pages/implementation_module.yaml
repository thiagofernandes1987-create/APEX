    \ y+h/6*(k1y+2*k2y+2*k3y+k4y)\n        def euler_step(x,y,h): return x+h*(a*x-b*x*y), y+h*(d*x*y-g*y)\n\
    \        step = rk4_step if integrator=='rk4' else euler_step\n        x1,y1=step(x,y,dt); xh,yh=step(x,y,dt/2);\
    \ x2,y2=step(xh,yh,dt/2)\n        return max(math.sqrt((x1-x2)**2+(y1-y2)**2)*0.1, 1e-10)\n\n    @classmethod\n\
    \    def optimal_block_size(cls, x, y, params, integrator, dt,\n                            eps_block_stop,\
