    : None,\n                    \"not_applicable\": True}\n        return cls.validate(snap.payload,\
    \ cognitive_mode)\n# ── fim DIFF_MERGE_REASON_001 ─────────────────────────────────────────\n\n# ──\
    \ DIFF_MEMORY_DISK_001 — MemoryIndex persistente ───────────────────\n# # Inserir após SnapRefRetrieval\
    \ no apex_v00_24.py\n# Upgrade: adiciona persistência em disco + embed_text por trigramas\n# G9: MAX_ENTRIES=200,\
    \ descarta menor composite_reward\n\nimport os as _os\n\ndef embed_text_trigram(text: str, dim: int\
    \ = 256) -> List[float]:\n    \"\"\"\n    DIFF_TRIGRAM_DIM (GAP-14): dim padrão 128→256.\n    Antes:\
    \ dim=128 → P(colisão) ≈ 0.78% por trigrama → retrieval falso-positivo.\n    Depois: dim=256 → P(colisão)\
    \ ≈ 0.39% (redução de 50%).\n    Embedding determinístico via trigramas FNV-1a.\n    Mesmo input →\
    \ mesmo vetor. Python puro, sem dependências.\n    ATENÇÃO: vetores existentes no MemoryIndex com\
    \ dim=128 são incompatíveis.\n             Limpar MemoryIndex em disco após esta atualização.\n  \
    \  \"\"\"\n    t = \" \" + \" \".join(text.lower().split()) + \" \"\n    vec = [0.0] * dim\n    for\
    \ i in range(len(t) - 2):\n        tri = t[i: i + 3]\n        h = 2166136261\n        for ch in tri:\n\
    \            h ^= ord(ch)\n            h = (h * 16777619) & 0xFFFFFFFF\n        vec[h % dim] += 1.0\n\
    \    norm = math.sqrt(sum(x * x for x in vec))\n    if norm > 1e-12:\n        vec = [x / norm for\
    \ x in vec]\n    return vec\n\n\n# OPP-53 DIFF_COSINE_ORDER_FIX (BUG-4): cosine_similarity_pure e\
    \ build_problem_features\n# estavam definidas em L10980 mas usadas em L6024 (dentro de MemoryIndex.retrieve)\n\
    # e L11050. Em módulo completo é válido (forward ref em Python funciona em runtime),\n# mas falha\
    \ ao importar classes isoladas em testes unitários.\n# Movidas para cá (antes de MemoryIndex que é\
    \ a primeira classe que as usa).\ndef cosine_similarity_pure(v1: List[float], v2: List[float]) ->\
    \ float:\n    \"\"\"Cosine similarity em Python puro (sem numpy/sklearn).\"\"\"\n    dot = sum(a*b\
    \ for a,b in zip(v1,v2))\n    n1  = math.sqrt(sum(x**2 for x in v1))\n    n2  = math.sqrt(sum(x**2\
    \ for x in v2))\n    return dot/(n1*n2) if n1>1e-10 and n2>1e-10 else 0.0\n\ndef build_problem_features(cfi:\
    \ float, wE: float, wD: float,\n                            n_entities: float, domain_tag: str) ->\
    \ List[float]:\n    \"\"\"\n    Vetor de features para retrieval — Python puro.\n    Usa apenas dados\
    \ disponíveis do BDS existente.\n    Compatível com cosine_similarity_pure.\n    \"\"\"\n    domain_map\
    \ = {\n        'graph':        [1,0,0,0,0,0,0],\n        'optimization': [0,1,0,0,0,0,0],\n      \
    \  'simulation':   [0,0,1,0,0,0,0],\n        'probabilistic':[0,0,0,1,0,0,0],\n        'numerical':\
    \    [0,0,0,0,1,0,0],\n        'combinatorics':[0,0,0,0,0,1,0],\n        'unknown':      [0,0,0,0,0,0,1],\n\
    \    }\n    domain_vec = domain_map.get(domain_tag, domain_map['unknown'])\n    return [cfi, wE, wD,\
    \ min(n_entities/20.0, 1.0)] + domain_vec\n\n\nclass MemoryIndex:\n    \"\"\"\n    DIFF_MEMORY_DISK_001:\
    \ Índice de memória cross-session persistido em disco.\n    Upgrade do SnapRefRetrieval: adiciona\
    \ _load()/_save() e embed_text_trigram.\n    G9: bounded a MAX_ENTRIES entradas, descarta menor composite_reward.\n\
    \n    Uso:\n      mem = MemoryIndex(path=\"/tmp/apex_memory/index.json\")\n      hits = mem.retrieve(problem_text,\
    \ k=3, min_sim=0.25)\n      # ... executar sessão ...\n      mem.add(problem_text, snap_ref_hash,\
    \ composite_reward=0.78,\n              meta={\"hint\": \"EBM São Paulo\", \"mode\": \"SCIENTIFIC\"\
    })\n      mem.save()\n    \"\"\"\n    MAX_ENTRIES = 200\n    DEFAULT_DIM = 128\n\n    def __init__(self,\
    \ path: str, embed_dim: int = DEFAULT_DIM):\n        self.path      = path\n        self.embed_dim\
    \ = embed_dim\n        self._rows: List[Dict] = []\n        self._dirty = False\n        self._load()\n\
    \n    def _load(self) -> None:\n        \"\"\"Carrega índice do disco. Silencioso se arquivo não existe.\"\
    \"\"\n        if not _os.path.exists(self.path):\n            self._rows = []\n            return\n\
    \        try:\n            with open(self.path, \"r\", encoding=\"utf-8\") as f:\n               \
    \ data = json.load(f)\n            self._rows = data if isinstance(data, list) else []\n        except\
    \ (json.JSONDecodeError, IOError):\n            self._rows = []\n\n    def save(self) -> None:\n \
    \       \"\"\"Persiste índice em disco (chamado no STEP_13).\"\"\"\n        if not self._dirty:\n\
    \            return\n        _os.makedirs(_os.path.dirname(_os.path.abspath(self.path)), exist_ok=True)\n\
    \        with open(self.path, \"w\", encoding=\"utf-8\") as f:\n            json.dump(self._rows,\
    \ f, ensure_ascii=False, indent=2)\n        self._dirty = False\n\n    def add(self, problem_text:\
    \ str, snap_ref_hash: str,\n            composite_reward: float, meta: Optional[Dict] = None) -> None:\n\
    \        \"\"\"\n        Adiciona experiência ao índice.\n        G9: se MAX_ENTRIES atingido, descarta\
    \ o de menor composite_reward.\n        \"\"\"\n        vec = embed_text_trigram(problem_text, self.embed_dim)\n\
    \        entry = {\n            \"snap_ref\":        snap_ref_hash,\n            \"vec\":        \
    \     vec,\n            \"composite_reward\":round(composite_reward, 4),\n            \"meta\":  \
    \          meta or {},\n        }\n        self._rows.append(entry)\n        # G9: manter bounded\n\
    \        if len(self._rows) > self.MAX_ENTRIES:\n            self._rows.sort(key=lambda r: r[\"composite_reward\"\
    ], reverse=True)\n            self._rows = self._rows[:self.MAX_ENTRIES]\n        self._dirty = True\n\
    \n    def retrieve(self, problem_text: str,\n                 k: int = 3, min_sim: float = 0.25) ->\
    \ List[Dict]:\n        \"\"\"\n        Recupera top-k experiências similares.\n        Retorna lista\
    \ de {sim, snap_ref, composite_reward, meta}.\n        \"\"\"\n        if not self._rows:\n      \
    \      return []\n        q = embed_text_trigram(problem_text, self.embed_dim)\n        scored = []\n\
    \        for r in self._rows:\n            sim = cosine_similarity_pure(q, r[\"vec\"])  # já existe\
    \ no v00.23\n            if sim >= min_sim:\n                scored.append({\n                   \
    \ \"sim\":             round(sim, 4),\n                    \"snap_ref\":        r[\"snap_ref\"],\n\
    \                    \"composite_reward\":r[\"composite_reward\"],\n                    \"meta\":\
    \            r.get(\"meta\", {}),\n                })\n        scored.sort(key=lambda x: x[\"sim\"\
    ], reverse=True)\n        return scored[:k]\n\n    def suggest_bias(self, hits: List[Dict]) -> Dict:\n\
    \        \"\"\"\n        Deriva bias_mode e bias_algo das experiências recuperadas.\n        SR_21\
    \ (herdado): bias_confidence <= 0.30.\n        \"\"\"\n        if not hits:\n            return {\"\
    bias_mode\": None, \"bias_algo\": None, \"bias_confidence\": 0.0}\n        mode_scores: Dict[str,\
    \ float] = {}\n        algo_scores: Dict[str, float] = {}\n        for h in hits:\n            w =\
    \ h[\"composite_reward\"] * h[\"sim\"]\n            m = h[\"meta\"].get(\"mode\")\n            a =\
    \ h[\"meta\"].get(\"algo\")\n            if m:\n                mode_scores[m] = mode_scores.get(m,\
    \ 0) + w\n            if a:\n                algo_scores[a] = algo_scores.get(a, 0) + w\n        bias_mode\
    \ = max(mode_scores, key=mode_scores.get) if mode_scores else None\n        bias_algo = max(algo_scores,\
    \ key=algo_scores.get) if algo_scores else None\n        return {\n            \"bias_mode\":    \
    \   bias_mode,\n            \"bias_algo\":       bias_algo,\n            \"confidence\": round(hits[0][\"\
    sim\"] * 0.30, 4),  # FIX-G-03: padronizado com SnapRefRetrieval\n            \"n_hits\":        \
    \  len(hits),\n        }\n\n    @property\n    def size(self) -> int:\n        return len(self._rows)\n\
    # ── fim DIFF_MEMORY_DISK_001 ──────────────────────────────────────────\n\n# ── DIFF_CRITIC_GATE_001\
    \ — CriticGate ────────────────────────────────\n# # Inserir após MergeReasonValidator no apex_v00_24.py\n\
    # SR_25: gate bloqueante em SCIENTIFIC antes do STEP_11\n\nclass CriticGate:\n    \"\"\"\n    DIFF_CRITIC_GATE_DEEP\
    \ (GAP-09):\n    ELIGIBLE_MODES expandido para incluir DEEP e RESEARCH.\n\n    ANTES: ELIGIBLE_MODES\
    \ = frozenset({\"SCIENTIFIC\"})\n           Em DEEP com merge_reason_valid=False: retornava PASS.\n\
    \           SR_24 era enforçado apenas em SCIENTIFIC.\n    DEPOIS: ELIGIBLE_MODES = frozenset({\"\
    SCIENTIFIC\",\"DEEP\",\"RESEARCH\"})\n            SR_24 enforçado em todos os modos de análise profunda.\n\
    \            MergeReasonValidator.INELIGIBLE_MODES (EXPRESS/CLARIFY/FAST)\n            e CriticGate.ELIGIBLE_MODES\
    \ agora são consistentes.\n    SR_25: obrigatório em modo SCIENTIFIC.\n    \"\"\"\n    ELIGIBLE_MODES\
    \        = frozenset({\"SCIENTIFIC\", \"DEEP\", \"RESEARCH\"})\n    CONFIDENCE_FLOOR      = 40.0\n\
    \    FINITE_DIFF_TOLERANCE = 1e-4\n\n    @dataclass\n    class GateResult:\n        verdict:  str\
    \             # \"PASS\" | \"FAIL\"\n        failures: List[Dict]      # lista de {category, detail,\
    \ severity}\n        signals:  List[str]       # lista de [SIGNAL] strings para log\n        action:\
    \   str             # \"proceed\" | \"re_execute_step9\" | \"escalate\"\n\n    @classmethod\n    def\
    \ evaluate(cls, solver_output: Dict,\n                 confidence_composite: float,\n            \
    \     cognitive_mode: str,\n                 finite_diff_checks: Optional[Dict] = None,\n        \
    \         merge_reason_valid: bool = True) -> \"CriticGate.GateResult\":\n        \"\"\"\n       \
    \ Avalia o output do solver e retorna GateResult.\n        Em modos não elegíveis: retorna PASS imediatamente.\n\
    \        \"\"\"\n        # Modos não elegíveis: pass-through\n        if cognitive_mode not in cls.ELIGIBLE_MODES:\n\
    \            return cls.GateResult(\n                verdict=\"PASS\", failures=[], signals=[\"OK\
    \ (modo nao elegivel)\"],\n                action=\"proceed\"\n            )\n\n        failures:\
    \ List[Dict] = []\n        signals:  List[str]  = []\n\n        # ── Categoria 1: SCHEMA_VIOLATION\
    \ ────────────────────────────\n        required_keys = [\"result\", \"method\", \"checks\"]\n   \
    \     for k in required_keys:\n            if k not in solver_output:\n                failures.append({\n\
    \                    \"category\": \"SCHEMA_VIOLATION\",\n                    \"detail\":   f\"campo\
    \ '{k}' ausente no solver_output\",\n                    \"severity\": \"HIGH\",\n               \
    \ })\n        if any(f[\"category\"] == \"SCHEMA_VIOLATION\" for f in failures):\n            signals.append(\n\
    \                f\"[CRITIC_GATE_FAIL: SCHEMA_VIOLATION — \"\n                f\"campos={[f['detail']\
    \ for f in failures if f['category']=='SCHEMA_VIOLATION']}]\"\n            )\n\n        # ── Categoria\
    \ 2: FINITE_DIFF_MISMATCH ────────────────────────\n        if finite_diff_checks:\n            for\
    \ check_name, check_data in finite_diff_checks.items():\n                if isinstance(check_data,\
    \ dict):\n                    pred = check_data.get(\"predicted\")\n                    true = check_data.get(\"\
    true\")\n                    if pred is not None and true is not None:\n                        err\
    \ = abs(pred - true)\n                        if err > cls.FINITE_DIFF_TOLERANCE:\n              \
    \              failures.append({\n                                \"category\": \"FINITE_DIFF_MISMATCH\"\
    ,\n                                \"detail\":   f\"{check_name}: |{pred:.6f}-{true:.6f}|={err:.2e}\"\
    ,\n                                \"severity\": \"HIGH\",\n                            })\n     \
    \       if any(f[\"category\"] == \"FINITE_DIFF_MISMATCH\" for f in failures):\n                signals.append(\n\
    \                    f\"[CRITIC_GATE_FAIL: FINITE_DIFF_MISMATCH — \"\n                    f\"tolerance={cls.FINITE_DIFF_TOLERANCE}]\"\
    \n                )\n\n        # ── Categoria 3: CONFIDENCE_TOO_LOW ──────────────────────────\n \
    \       if confidence_composite < cls.CONFIDENCE_FLOOR:\n            failures.append({\n         \
    \       \"category\": \"CONFIDENCE_TOO_LOW\",\n                \"detail\":   f\"composite={confidence_composite}\
    \ < floor={cls.CONFIDENCE_FLOOR}\",\n                \"severity\": \"MEDIUM\",\n            })\n \
    \           signals.append(\n                f\"[CONFIDENCE_TOO_LOW_WARNING: {confidence_composite:.1f}\
    \ < \"\n                f\"{cls.CONFIDENCE_FLOOR} — escalar ao usuário]\"\n            )\n\n     \
    \   # ── Categoria 4: MERGE_REASON_INVALID ────────────────────────\n        if not merge_reason_valid:\n\
    \            failures.append({\n                \"category\": \"MERGE_REASON_INVALID\",\n        \
    \        \"detail\":   \"merge_reasoning ausente ou invalido (SR_24)\",\n                \"severity\"\
    : \"HIGH\",\n            })\n            signals.append(\"[CRITIC_GATE_FAIL: MERGE_REASON_INVALID]\"\
    )\n\n        # ── Veredicto e ação ──────────────────────────────────────────\n        # OPP-62 DIFF_HAS_MEDIUM_CLEANUP:\
    \ has_medium removido — variável morta.\n        # Computada mas nunca referenciada (GAP-12 UCO/GAP-UCO-1).\n\
    \        # O branch 'else' implicitamente cobre apenas MEDIUM (has_high=False).\n        has_high\
    \   = any(f[\"severity\"] == \"HIGH\"   for f in failures)\n        verdict    = \"FAIL\" if failures\
    \ else \"PASS\"\n        if not failures:\n            action = \"proceed\"\n            signals.append(\"\
    OK\")\n        elif has_high:\n            action = \"re_execute_step9\"\n        else:\n        \
    \    action = \"escalate\"   # apenas MEDIUM (has_high=False implícito)\n\n        return cls.GateResult(\n\
    \            verdict=verdict, failures=failures,\n            signals=signals, action=action\n   \
    \     )\n\n    @classmethod\n    def format_report(cls, result: \"CriticGate.GateResult\") -> str:\n\
    \        \"\"\"Formata GateResult para log/output humano.\"\"\"\n        lines = [f\"[CriticGate]\
    \ verdict={result.verdict} action={result.action}\"]\n        for sig in result.signals:\n       \
    \     lines.append(f\"  signal: {sig}\")\n        for f in result.failures:\n            lines.append(f\"\
    \  failure: [{f['severity']}] {f['category']} — {f['detail']}\")\n        return \"\\n\".join(lines)\n\
    # ── fim DIFF_CRITIC_GATE_001 ──────────────────────────────────────────\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 10: SYMBOLIC PRE-CHECK — DIFF_v22_007\n#   Detecta formas fechadas antes do BDS/DifficultyPredictor\n\
    #   Previne over-escalation por keyword collision (Sim 2 e 5)\n#   Posição: STEP_0, antes de P0_express_check\n\
    # ═══════════════════════════════════════════════════════════════════\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # DIFF_SYMBOLIC_PRECHECK_V3 (BUG-09)\n# Corrige 3 falsos positivos confirmados empiricamente:\n# \
    \  1. \"Resolva o sistema x+y=5, x-y=1\" → era True (sistema 2×2 ≠ linear)\n#   2. \"Calcule a FFT\
    \ do sinal x^2\"      → era True (FFT ≠ integral de x^2)\n#   3. \"Optimize x^2 + 3x - 4\"       \
    \    → era False por razão errada\n#      ('optim' bloqueava mas 'optimize' EN não bloquearia — assimetria)\n\
    # Mantém PATCH_v23_BUG01 (10/10 casos anteriores preservados).\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass SymbolicPreCheckV2:\n    \"\"\"\n    DIFF_SYMBOLIC_PRECHECK_V3 (BUG-09): Corrige 3 falsos\
    \ positivos.\n    PATCH_v23_BUG01 preservado: blockers de escala+ODE+func (10/10 OK).\n    Adições\
    \ v00.26:\n    - BLOCKERS_SYSTEM: sistemas de equações (múltiplos '=' com x e y)\n    - BLOCKERS_TRANSFORM:\
    \ FFT, DFT, transformada, fourier, sinal\n    - BLOCKERS_EN_OPT: optimize, minimize, maximize (variantes\
    \ inglesas)\n    - check(): eq_count >= 2 com x+y → bloqueado (sistema, não linear)\n    Verificado:\
    \ 9/9 casos corretos (6 antigos + 3 novos falsos positivos).\n    \"\"\"\n    BLOCKERS_ORIGINAL =\
    \ [\n        'simul','navier','stokes','turbul','pde','eigenvalue',\n        'scheduling','probabilidade','distribution','ode','edp',\n\
    \        'grafo','graph','otimiz','optim'\n    ]\n    BLOCKERS_SCALE = [\n        'sistema linear','linear\
    \ system','ax=b','ax = b',\n        '100 variáveis','50×50','n variáveis','variables',\n        'gradiente\
    \ conjugado','conjugate gradient','solver',\n        'sistema de equações','equações simultâneas',\n\
    \        'sistema linear com','resolve o sistema'\n    ]\n    BLOCKERS_FUNC = [\n        'f(x)','g(x)','h(x)','f(t)','g(t)',\n\
    \        'função','function','raiz de','root of',\n        'encontre x','find x','encontrar x'\n \
    \   ]\n    BLOCKERS_ODE = [\n        'dy/dt','dx/dt','dz/dt','equação diferencial',\n        'differential\
    \ equation','ode ','edp ','lotka','volterra'\n    ]\n    # BUG-09 FIX: blockers adicionais\n    BLOCKERS_SYSTEM\
    \ = [\n        'sistema\\n','sistema ','x+y=','x-y=','x*y=',\n        '2x+','3x+','4x+','x + y','x\
    \ - y',\n    ]\n    BLOCKERS_TRANSFORM = [\n        'fft','dft','transformada','transform','fourier',\n\
    \        'laplace','sinal','signal','espectro','spectrum',\n        'frequência','frequency'\n   \
    \ ]\n    BLOCKERS_EN_OPT = [\n        'optimize','minimize','maximize','minimise','maximise',\n  \
    \      'gradient descent','hill climbing','objective function'\n    ]\n    POLY_SIGNALS = [\n    \
    \    'x^2','x²','x^3','x^4','x^n','∫x','integral de x',\n        'integrar x','integrate x','polinômio','polynomial'\n\
    \    ]\n    DERIV_SIGNALS = [\n        'd/dx','derivada de','derivative of','sen(x)','cos(x)',\n \
    \       'e^x','ln(x)','log(x)'\n    ]\n    ALGORITHMIC_SIGNALS = [\n        'use ','aplique ','implemente\
    \ ','resolver usando','calcular usando',\n        'gradiente','gradient','100','50','n variáveis','n\
    \ variables'\n    ]\n\n    @classmethod\n    def check(cls, problem_text: str) -> Tuple[bool, Optional[str]]:\n\
    \        t = problem_text.lower()\n        # Verificar todos os blockers (incluindo novos BUG-09)\n\
    \        for b in (cls.BLOCKERS_ORIGINAL + cls.BLOCKERS_SCALE +\n                  cls.BLOCKERS_FUNC\
    \ + cls.BLOCKERS_ODE +\n                  cls.BLOCKERS_SYSTEM + cls.BLOCKERS_TRANSFORM +\n       \
    \           cls.BLOCKERS_EN_OPT):\n            if b in t: return False, None\n        # BUG-09 FIX:\
    \ detectar sistemas com múltiplos '=' e x+y\n        eq_count = t.count('=')\n        if eq_count\
    \ >= 2 and 'x' in t and 'y' in t:\n            return False, None\n        if any(s in t for s in\
    \ cls.POLY_SIGNALS):\n            return True, \"polynomial_integral_closed_form\"\n        if any(s\
    \ in t for s in cls.DERIV_SIGNALS):\n            return True, \"standard_derivative_closed_form\"\n\
    \        # Equação linear SIMPLES — reforçado\n        has_algo = any(a in t for a in cls.ALGORITHMIC_SIGNALS)\n\
    \        has_func = any(c in t for c in ['f(','g(','h(','ax','bx','^2','^3'])\n        if ('=' in\
    \ t and 'x' in t and len(t) < 80 and\n                not has_algo and not has_func and eq_count <=\
    \ 1):\n            return True, \"linear_equation_closed_form\"\n        return False, None\n\n\n\
    # ═══════════════════════════════════════════════════════════════════\n# PATCH_v23_GAP01 — CFIFeatureExtractor\
    \ (pré-filtro determinístico)\n# GAP-01: CFI/wE/wD não auditáveis quando apenas semântico\n# Solução:\
    \ camada determinística com LOG + BDS semântico como refinamento\n# POSIÇÃO: STEP_0 — antes do BDS,\
    \ após SymbolicPreCheckV2\n# ═══════════════════════════════════════════════════════════════════\n\
    \n\nclass CouplingAnalyzer:\n    \"\"\"\n    DIFF_v22_006: Analisa o grafo de dependências do problema\
    \ via\n    eigenvalue de Fiedler (λ₂ da Laplaciana).\n    λ₂ < 0.40 → acoplamento fraco → decomposição\
    \ fractal segura.\n    λ₂ ≥ 0.40 → acoplamento forte → modo MONOLITHIC obrigatório.\n\n    Para problemas\
    \ sem estrutura de grafo explícita, usa heurísticas\n    baseadas em domain_tags e palavras-chave\
    \ da CED-Matrix.\n    \"\"\"\n    SAFE_THRESHOLD   = 0.40   # λ₂ < 0.40 → safe\n    DOMAIN_SCORES\
    \ = {\n        # (domain_tag, coupling_score)\n        'polynomial':           0.02,\n        'linear_algebra':\
    \       0.10,\n        'graph_routing':        0.25,\n        'ode_simple':           0.30,\n    \
    \    'combinatorics':        0.35,\n        'ode_coupled':          0.45,  # ex: Lotka-Volterra\n\
    \        'pde_parabolic':        0.60,\n        'pde_elliptic':         0.70,\n        'pde_hyperbolic':\
    \       0.75,\n        'navier_stokes':        0.92,\n        'fluid_dynamics':       0.85,\n    \
    \    'quantum_many_body':    0.90,\n    }\n    KEYWORD_MAP = {\n        'navier': 'navier_stokes',\
    \ 'stokes': 'navier_stokes',\n        'turbulência': 'navier_stokes', 'turbulence': 'navier_stokes',\n\
    \        'lotka': 'ode_coupled', 'volterra': 'ode_coupled',\n        'ode': 'ode_simple', 'edp': 'pde_parabolic',\n\
    \        'grafo': 'graph_routing', 'graph': 'graph_routing',\n        'polinômio': 'polynomial', 'polynomial':\
    \ 'polynomial',\n        'integral': 'polynomial', 'derivada': 'polynomial',\n    }\n\n    @classmethod\n\
    \    def analyze(cls, problem_text: str,\n                dependency_graph: Optional[dict] = None)\
    \ -> dict:\n        \"\"\"\n        Retorna dict com:\n          coupling_score: float [0, 1]\n  \
    \        safe_to_decompose: bool\n          domain_detected: str\n          lambda2_approx: float\n\
    \          recommendation: str\n        \"\"\"\n        if dependency_graph and len(dependency_graph)\
    \ > 1:\n            lambda2 = cls._fiedler_approx(dependency_graph)\n        else:\n            lambda2\
    \ = cls._heuristic_score(problem_text)\n\n        safe = lambda2 < cls.SAFE_THRESHOLD\n        domain\
    \ = cls._detect_domain(problem_text)\n\n        return {\n            \"coupling_score\":    round(lambda2,\
    \ 4),\n            \"lambda2_approx\":    round(lambda2, 4),\n            \"safe_to_decompose\": safe,\n\
    \            \"domain_detected\":   domain,\n            \"recommendation\":    \"FRACTAL\" if safe\
    \ else \"MONOLITHIC\",\n            \"fractal_depth_max\": cls._safe_depth(lambda2),\n        }\n\n\
    \    @classmethod\n    def _detect_domain(cls, text: str) -> str:\n        text_lower = text.lower()\n\
    \        for kw, domain in cls.KEYWORD_MAP.items():\n            if kw in text_lower: return domain\n\
    \        return \"unknown\"\n\n    @classmethod\n    def _heuristic_score(cls, text: str) -> float:\n\
    \        domain = cls._detect_domain(text)\n        return cls.DOMAIN_SCORES.get(domain, 0.35)\n\n\
    \    @classmethod\n    def _fiedler_approx(cls, graph: dict) -> float:\n        \"\"\"\n        DIFF_FIEDLER_FIX\
    \ (BUG-07): Calcula λ₂ (Fiedler eigenvalue) corretamente.\n        DIFF_FIEDLER_EXCEPTION_SCOPE (OPP-34,\
    \ BUG-D5-03): except scope ampliado.\n\n        ANTES: except ImportError apenas → MemoryError do\
    \ np.zeros ou eigvalsh\n               escapava sem cair no fallback heurístico (crash do caller).\n\
    \        DEPOIS: except (ImportError, MemoryError, Exception) → heurística sempre\n              \
    \  acionada como fallback de última instância.\n                Guard n > MAX_DENSE_NODES evita alocação\
    \ de matriz densa absurda.\n\n        graph: {node_id: [neighbor_ids]}\n        \"\"\"\n        MAX_DENSE_NODES\
    \ = 500  # OPP-34: acima disto eigvalsh seria catastrófico\n        nodes = list(graph.keys())\n \
    \       n = len(nodes)\n        if n <= 1: return 0.0\n\n        # ── Path 1: scipy exact ───────────────────────────────────────────\n\
    \        try:\n            import numpy as np\n            from scipy.sparse import csr_matrix\n \
    \           from scipy.sparse.linalg import eigsh\n            idx = {node: i for i, node in enumerate(nodes)}\n\
    \            L = np.zeros((n, n), dtype=float)\n            for node, neighbors in graph.items():\n\
    \                i = idx[node]\n                L[i][i] = float(len(neighbors))\n                for\
    \ nb in neighbors:\n                    if nb in idx:\n                        L[i][idx[nb]] = -1.0\n\
    \            L_sparse = csr_matrix(L)\n            try:\n                eigenvalues = eigsh(L_sparse,\
    \ k=2, which='SM',\n                                    return_eigenvectors=False,\n             \
    \                       tol=1e-8, maxiter=1000)\n                lambda2 = float(sorted(eigenvalues)[1])\n\
    \            except Exception:\n                # Fallback denso — OPP-34: guard para n grande\n \
    \               if n > MAX_DENSE_NODES:\n                    raise MemoryError(\n                \
    \        f\"[FIEDLER_DENSE_GUARD] n={n} > MAX_DENSE_NODES={MAX_DENSE_NODES} \"\n                 \
    \       f\"— eigvalsh recusado, usando heurística\")\n                eigenvalues_np = np.linalg.eigvalsh(L)\n\
    \                lambda2 = float(sorted(eigenvalues_np)[1])\n            return max(0.0, lambda2)\n\
    \        except (ImportError, MemoryError, Exception) as _fe:\n            # OPP-34: captura MemoryError\
    \ E qualquer outra exceção inesperada\n            # SR_31: heurística é o fallback seguro garantido\n\
    \            node_text = \" \".join(str(k) for k in nodes)\n            heuristic = cls._heuristic_score(node_text)\n\
    \            reason = type(_fe).__name__\n            print(f\"[FIEDLER_FALLBACK_GUARD: SR_31 — {reason};\
    \ \"\n                  f\"usando heurística λ₂≈{heuristic:.3f}]\")\n            return heuristic\n\
    \n    @classmethod\n    def _safe_depth(cls, lambda2: float) -> int:\n        \"\"\"\n        Profundidade\
    \ fractal máxima segura dado o acoplamento λ₂.\n        BUG-G05 (esclarecimento intencional): MONOLITHIC\
    \ (return 0) NÃO significa\n        \"resolver internamente como bloco único\". Significa DELEGAR\
    \ via SR_09\n        (DELEGATION_NOTE). Para NS/PDEs com coupling ≥ 0.40: o sistema reconhece\n  \
    \      que é impossível em LLM Puro e escala para solução externa. É o comportamento\n        CORRETO,\
    \ não uma limitação. Fractal depth=0 → meta_reasoning emite delegate.\n        \"\"\"\n        if\
    \ lambda2 < 0.15: return 3   # muito fraco: profundidade máxima\n        if lambda2 < 0.25: return\
    \ 2\n        if lambda2 < 0.40: return 1   # margem segura: apenas meso\n        return 0        \
    \               # MONOLITHIC → DELEGATION_NOTE (SR_09)\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 12: CHAOS OPERATORS — DIFF_v22_001\n#   Três operadores formais com temperatura como controlador\n\
    #   Trigger correto: rejections_streak > threshold (NÃO temperatura alta)\n#   T alta = mais aceitações;\
    \ T baixa = mais rejeições = agente preso\n#   SR_16: operador registrado em chaos_operator_log obrigatoriamente\n\
    # ═══════════════════════════════════════════════════════════════════\n\nclass ChaosOperators:\n \
    \   \"\"\"\n    DIFF_v22_001: Operadores estruturados de perturbação.\n    Substituem geração livre\
    \ do CRITIC_RADICAL.\n\n    Temperatura T = H_cognitive (entropia cognitiva do MCFE).\n    P_chaos\
    \ = min(0.3, T) — probabilidade de aplicar caos.\n    Levy step: heavy-tail α=1.5 para escapar mínimos\
    \ locais profundos.\n    \"\"\"\n    LEVY_ALPHA          = 1.5\n    MAX_CHAOS_PROB      = 0.30\n \
    \   MIN_NODES_RECOMBINE = 2\n\n    @classmethod\n    def levy_step(cls, alpha: float = None) -> float:\n\
    \        \"\"\"\n        Passo de Lévy: distribuição heavy-tail.\n        u ~ N(0,1), v ~ N(0,1) →\
    \ u / |v|^(1/α)\n        Gera ocasionalmente grandes perturbações que escapam mínimos locais.\n  \
    \      \"\"\"\n        alpha = alpha or cls.LEVY_ALPHA\n        u = random.gauss(0, 1)\n        v\
    \ = random.gauss(0, 1)\n        denom = abs(v) ** (1.0 / alpha)\n        return u / max(denom, 1e-10)\n\
    \n    @classmethod\n    def structural_mutation(cls, hyp: dict) -> dict:\n        \"\"\"\n       \
    \ DIFF_MUTATION_CONFIDENCE (GAP-13):\n        Penaliza confidence após mutação — mutação implica incerteza\
    \ nova.\n        Antes: confidence inalterada após troca de method/perspective.\n        Depois: confidence\
    \ reduzida em 10 pontos (piso: 30).\n        Cópia defensiva — não modifica o original.\n        \"\
    \"\"\n        if not isinstance(hyp, dict): return hyp\n        hyp_new = hyp.copy()\n        mutated\
    \ = False\n        if 'method' in hyp_new:\n            methods = ['euler', 'rk4', 'leapfrog', 'simulated_annealing',\n\
    \                       'bayesian', 'gradient_descent', 'genetic']\n            candidates = [m for\
    \ m in methods if m != hyp_new['method']]\n            if candidates:\n                hyp_new['method']\
    \ = random.choice(candidates)\n                mutated = True\n        # Para hipóteses textuais:\
    \ adicionar perturbação de perspectiva\n        if 'perspective' in hyp_new:\n            perspectives\
    \ = ['optimistic', 'pessimistic', 'neutral',\n                            'contrarian', 'systemic',\
    \ 'reductionist']\n            candidates = [p for p in perspectives\n                          if\
    \ p != hyp_new.get('perspective')]\n            if candidates:\n                hyp_new['perspective']\
    \ = random.choice(candidates)\n                mutated = True\n        # GAP-13: penalizar confidence\
    \ se mutação ocorreu\n        if mutated and 'confidence' in hyp_new:\n            hyp_new['confidence']\
    \ = max(30, hyp_new['confidence'] - 10)\n        return hyp_new\n\n    @classmethod\n    def recombination(cls,\
    \ h1: dict, h2: dict) -> dict:\n        \"\"\"\n        Operador 2: crossover 50/50 entre dois campos\
    \ de hipóteses.\n        Requer que ambos sejam dicts.\n        Garante que campos obrigatórios nunca\
    \ sejam None.\n        \"\"\"\n        if not isinstance(h1, dict) or not isinstance(h2, dict):\n\
    \            return h1\n        new = {}\n        all_keys = set(h1.keys()) | set(h2.keys())\n   \
    \     for k in all_keys:\n            if random.random() < 0.5:\n                val = h1.get(k, h2.get(k))\n\
    \            else:\n                val = h2.get(k, h1.get(k))\n            # SR_16: campos obrigatórios\
    \ nunca None\n            if val is not None:\n                new[k] = val\n        return new\n\n\
    \    @classmethod\n    def levy_mutation(cls, hyp: Any) -> Any:\n        \"\"\"\n        Operador\
    \ 3: perturbação Lévy em campos numéricos.\n        DIFF_LEVY_CLAMP (OPP-32, BUG-G08): clamp para\
    \ campos cognitivos com range definido.\n        Preserva campos não-numéricos sem alteração.\n\n\
    \        PROBLEMA: levy_step() pode retornar valores arbitrariamente grandes.\n        0.6% dos steps\
    \ saem de range [0,100] para campos como confidence.\n        Hipóteses com confidence < 0 ou > 100\
    \ violam calibration_ladder.\n\n        FIX: FIELD_BOUNDS define ranges para campos cognitivos conhecidos.\n\
    \        Campos não listados: sem clamp (comportamento original).\n        \"\"\"\n        FIELD_BOUNDS:\
    \ Dict[str, tuple] = {\n            'confidence':   (0.0,   100.0),\n            'score':        (0.0,\
    \   1.0),\n            'weight':       (0.0,   1.0),\n            'probability':  (0.0,   1.0),\n\
    \            'prior':        (0.0,   1.0),\n            'posterior':    (0.0,   1.0),\n          \
    \  'reliability':  (0.0,   1.0),\n            'phase_offset': (-180.0, 180.0),\n            'temperature':\
    \  (0.0,   1.0),\n        }\n        if isinstance(hyp, (int, float)):\n            return hyp + cls.levy_step()\n\
    \        elif isinstance(hyp, dict):\n            new = hyp.copy()\n            for k, v in hyp.items():\n\
    \                if isinstance(v, (int, float)):\n                    mutated = v + cls.levy_step()\n\
    \                    # OPP-32: clamp para campos com range definido\n                    if k in FIELD_BOUNDS:\n\
    \                        lo, hi = FIELD_BOUNDS[k]\n                        mutated = max(lo, min(hi,\
    \ mutated))\n                    new[k] = mutated\n                # não toca em strings, listas ou\
    \ dicts nested\n            return new\n        elif isinstance(hyp, list):\n            return [cls.levy_mutation(x)\
    \ for x in hyp]\n        return hyp\n\n    @classmethod\n    def select_and_apply(cls, nodes: List[dict],\
    \ T: float,\n                         log: Optional[List[dict]] = None,\n                        \
    \ step: Optional[str] = None) -> Optional[Any]:\n        \"\"\"\n        Seleciona e aplica operador\
    \ baseado na temperatura T.\n        T = H_cognitive (entropia cognitiva do MCFE).\n        P_chaos\
    \ = min(0.30, T).\n        SR_16: registra em log obrigatoriamente.\n\n        NOTA: T alta → mais\
    \ aceitações em Metropolis (exploração livre).\n              T baixa + rejections_streak alto → agente\
    \ preso → trocar.\n              Este método implementa a perturbação; o trigger de troca\n      \
    \        é gerido pelo AgentReplacement (Bloco 13).\n        \"\"\"\n        if random.random() >\
    \ min(cls.MAX_CHAOS_PROB, T):\n            return None   # não aplicar\n        if len(nodes) >= cls.MIN_NODES_RECOMBINE:\n\
    \            op = random.choice(['structural', 'recombine', 'levy'])\n        else:\n            op\
    \ = random.choice(['structural', 'levy'])\n\n        result = None\n        if op == 'structural'\
    \ and nodes:\n            result = cls.structural_mutation(\n                random.choice(nodes).get('hypothesis',\
    \ {}))\n        elif op == 'recombine' and len(nodes) >= 2:\n            n1, n2 = random.sample(nodes,\
    \ 2)\n            result = cls.recombination(\n                n1.get('hypothesis', {}), n2.get('hypothesis',\
    \ {}))\n        elif op == 'levy' and nodes:\n            result = cls.levy_mutation(\n          \
    \      random.choice(nodes).get('hypothesis', {}))\n\n        # SR_16: registrar em log\n        if\
    \ log is not None:\n            log.append({\n                'operator': op,\n                'T':\
    \ round(T, 4),\n                'step': step or 'unknown',\n                'result_is_none': result\
    \ is None,\n            })\n        return result\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 13: AGENT REPLACEMENT — DIFF_v22_008\n#   Trigger: rejections_streak > threshold (NÃO temperatura\
    \ alta)\n#   T alta = mais aceitações; trigger correto = agente preso em loop\n#   Integra com ANCHOR_DESTROYER:\
    \ este module troca o agente inteiro\n# ═══════════════════════════════════════════════════════════════════\n\
    \n@dataclass\nclass AgentState:\n    agent_id:         str\n    phase_offset:     float\n    rejections_streak:\
    \ int = 0\n    confidence_history: list = field(\n        default_factory=lambda: __import__('collections').deque(maxlen=10)\n\
    \    )  # OPP-56 DIFF_DEQUE_HOTPATHS: deque(maxlen=10) auto-drops oldest, popleft O(1)\n    active:\
    \           bool = True\n\nclass AgentReplacementEngine:\n    \"\"\"\n    DIFF_v22_008: Substituição\
    \ de agente quando travado em loop cognitivo.\n    DIFF_AGENT_SKILL: verificação de skill via HistoricalSuccessTracker.\n\
    \n    TRIGGER (correto, validado por simulação):\n      rejections_streak > REJECTIONS_THRESHOLD \
    \ ← correto\n      OU variance(confidence_history[-3:]) < LOW_VARIANCE_THRESHOLD\n\n    NÃO TRIGGER:\
    \ temperatura alta (validado: T alta = mais aceitações,\n    não mais rejeições — inversão da intuição\
    \ original).\n\n    Agente substituído é 'adormecido' (não deletado — pode ser reativado).\n    Novo\
    \ agente recebe phase_offset = phase_atual + π (perspectiva oposta).\n    DIFF_AGENT_SKILL: se success_tracker\
    \ indicar baixo reward de algos no\n    domínio, forced_skill é injetado para garantir diversidade\
    \ de habilidade,\n    não só de perspectiva. Resolve: substituição por fase quando o problema\n  \
    \  é ausência de skill específica.\n    \"\"\"\n    REJECTIONS_THRESHOLD   = 20\n    LOW_VARIANCE_THRESHOLD\
    \ = 0.03  # variance < 3% = agente preso\n    MAX_REPLACEMENTS       = 2     # por sessão, por agente\n\
    \n    def __init__(self):\n        self.agents:       Dict[str, AgentState] = {}\n        self.replacements:\
    \ List[dict] = []\n\n    def register_agent(self, agent_id: str, phase_offset: float):\n        self.agents[agent_id]\
    \ = AgentState(\n            agent_id=agent_id, phase_offset=phase_offset)\n\n    def record_outcome(self,\
    \ agent_id: str, accepted: bool,\n                       confidence: float):\n        if agent_id\
    \ not in self.agents: return\n        state = self.agents[agent_id]\n        if accepted:\n      \
    \      state.rejections_streak = 0\n        else:\n            state.rejections_streak += 1\n    \
    \    state.confidence_history.append(confidence)\n        # OPP-56: confidence_history is now deque(maxlen=10)\
    \ — auto-drops, no manual pop needed\n\n    def should_replace(self, agent_id: str) -> bool:\n   \
    \     \"\"\"\n        OPP-13 DIFF_VARIANCE_GUARD: variância baixa + confiança alta = ESTÁVEL,\n  \
    \      não loop cognitivo. Bug anterior: var=0 com confidence=82 → replace=True.\n        Fix: trigger\
    \ 2 requer var baixa E média de confiança < 60.\n        \"\"\"\n        if agent_id not in self.agents:\
    \ return False\n        state = self.agents[agent_id]\n        replacements_done = sum(\n        \
    \    1 for r in self.replacements if r['old_agent'] == agent_id)\n        if replacements_done >=\
    \ self.MAX_REPLACEMENTS: return False\n        # Trigger 1: streak de rejeições (inalterado)\n   \
    \     if state.rejections_streak > self.REJECTIONS_THRESHOLD:\n            return True\n        #\
    \ Trigger 2 CORRIGIDO: var baixa SÓ é loop se confiança TAMBÉM é baixa\n        # var=0 + confidence=82\
    \ → estabilidade genuína, NÃO substituir\n        # var=0 + confidence=45 → loop cognitivo, substituir\n\
    \        if len(state.confidence_history) >= 3:\n            h      = state.confidence_history[-3:]\n\
    \            mean_h = sum(h) / len(h)\n            var_h  = sum((x - mean_h)**2 for x in h) / len(h)\n\
    \            if var_h < self.LOW_VARIANCE_THRESHOLD and mean_h < 60.0:\n                return True\n\
    \        return False\n\n    def replace_agent(self, old_agent_id: str,\n                      state_hash:\
    \ str,\n                      snapshot_store: Optional[SnapshotStore] = None,\n                  \
    \    success_tracker: Optional[\"HistoricalSuccessTracker\"] = None,\n                      domain:\
    \ Optional[str] = None) -> dict:\n        \"\"\"\n        DIFF_AGENT_SKILL: Substitui agente com verificação\
    \ de skill histórica.\n\n        Lógica aprimorada:\n          1. Se success_tracker + domain fornecidos:\
    \ identifica skill (algo)\n             com histórico de BAIXO reward no domínio atual — substituto\n\
    \             recebe forced_skill para forçar diversidade real, não só de fase.\n          2. Se o\
    \ problema raiz for falta de skill (não perspectiva), a mudança\n             de fase sozinha falharia\
    \ — forced_skill resolve isso.\n          3. Fallback: comportamento original (phase + π) se sem tracker.\n\
    \n        Adormece agente atual. Retorna spec do novo agente.\n        \"\"\"\n        old_state =\
    \ self.agents.get(old_agent_id)\n        if not old_state: return {}\n\n        # Adormecer agente\n\
    \        old_state.active = False\n\n        # Calcular phase oposto\n        new_phase = (old_state.phase_offset\
    \ + math.pi) % (2 * math.pi)\n        new_id    = f\"{old_agent_id}_replacement_{len(self.replacements)+1}\"\
    \n\n        new_agent = AgentState(agent_id=new_id, phase_offset=new_phase)\n        self.agents[new_id]\
    \ = new_agent\n\n        reason = ('rejections_streak'\n                  if old_state.rejections_streak\
    \ > self.REJECTIONS_THRESHOLD\n                  else 'low_confidence_variance')\n\n        # DIFF_AGENT_SKILL:\
    \ verificar skill ausente via HistoricalSuccessTracker\n        forced_skill = None\n        skill_signal\
    \ = \"OK\"\n        if success_tracker is not None and domain is not None:\n            # Identificar\
    \ algos já utilizados no domínio (com histórico)\n            used_algos = {\n                algo\
    \ for (dom, algo) in success_tracker._history\n                if dom == domain\n            }\n \
    \           # Identificar algos de baixo reward que o substituto NÃO deve repetir\n            low_reward_algos\
    \ = set()\n            for (dom, algo), stats in success_tracker._history.items():\n             \
    \   if dom == domain and stats[\"n\"] >= 1:\n                    avg_reward = stats[\"sum_reward\"\
    ] / stats[\"n\"]\n                    if avg_reward < 0.35:\n                        low_reward_algos.add(algo)\n\
    \n            if low_reward_algos:\n                # Forçar skill diferente das que falharam\n  \
    \              forced_skill = f\"avoid:{','.join(sorted(low_reward_algos))}\"\n                skill_signal\
    \ = (\n                    f\"[SKILL_FORCED: evitar {low_reward_algos} \"\n                    f\"\
    (reward<0.35 em '{domain}')]\"\n                )\n                print(f\"[AGENT_SKILL_GUARD] {old_agent_id}:\
    \ \"\n                      f\"problema é skill, não fase → {skill_signal}\")\n            elif used_algos:\n\
    \                skill_signal = f\"[SKILL_OK: {len(used_algos)} algos testados em '{domain}']\"\n\n\
    \        record = {\n            'old_agent':     old_agent_id,\n            'new_agent':     new_id,\n\
    \            'new_phase':     round(new_phase, 4),\n            'state_hash':    state_hash,\n   \
    \         'reason':        reason,\n            'trigger_value': old_state.rejections_streak,\n  \
    \          'forced_skill':  forced_skill,\n            'skill_signal':  skill_signal,\n        }\n\
    \        self.replacements.append(record)\n\n        print(f\"[AGENT_REPLACED] {old_agent_id} → {new_id}\
    \ \"\n              f\"| phase={new_phase:.4f} | reason={reason} | skill={skill_signal}\")\n     \
    \   return record\n\n\n# ═══════════════════════════════════════════════════════════════════\n# BLOCO\
    \ 14: DYNAMIC POOL SCALING — DIFF_v22_009\n#   Escala n_agents dinamicamente mid-session via H_cognitive\
    \ × T\n#   Diferente do modo (que define n_agents no início):\n#   este módulo reduz/expande durante\
    \ STEP_3, STEP_5, STEP_7, STEP_9\n# ═══════════════════════════════════════════════════════════════════\n\
    \nclass DynamicPoolScaler:\n    \"\"\"\n    DIFF_v22_009: Ajuste mid-session do pool de agentes.\n\
    \n    n_agents = max(base//2, min(mode_max, base//2 + (mode_max - base//2) * need_score))\n    need_score\
    \ = 0.6 × H_cognitive + 0.4 × T_norm\n\n    H_cognitive: entropia cognitiva (0=convergido, 1=máxima\
    \ entropia)\n    T_norm: temperatura normalizada para [0,1] (T / 2.0)\n\n    Economia estimada: 30-40%\
    \ tokens em steps tardios de sessões convergentes.\n    \"\"\"\n    H_WEIGHT = 0.6\n    T_WEIGHT =\
    \ 0.4\n    T_NORM_FACTOR = 2.0\n\n    ELIGIBLE_STEPS = ['STEP_3', 'STEP_5', 'STEP_7', 'STEP_9']\n\
    \    ELIGIBLE_MODES = ['DEEP', 'RESEARCH', 'SCIENTIFIC']\n\n    def compute_pool_size(self, H_cognitive:\
    \ float, T_current: float,\n                          base_agents: int, mode_max: int) -> int:\n \
    \       T_norm = min(1.0, T_current / self.T_NORM_FACTOR)\n        need_score = self.H_WEIGHT * H_cognitive\
    \ + self.T_WEIGHT * T_norm\n        min_agents = max(1, base_agents // 2)\n        n = int(min_agents\
    \ + (mode_max - min_agents) * need_score)\n        return max(min_agents, min(mode_max, n))\n\n  \
    \  def should_scale(self, step: str, mode: str) -> bool:\n        return step in self.ELIGIBLE_STEPS\
    \ and mode in self.ELIGIBLE_MODES\n\n    def get_scaling_log(self, H: float, T: float,\n         \
    \               base: int, mode_max: int, step: str) -> dict:\n        n = self.compute_pool_size(H,\
    \ T, base, mode_max)\n        return {\n            'step':         step,\n            'H_cognitive':\
    \  round(H, 3),\n            'T_current':    round(T, 3),\n            'n_agents':     n,\n      \
    \      'base_agents':  base,\n            'mode_max':     mode_max,\n            'reduction_pct':\
    \ round((1 - n/mode_max) * 100, 1),\n        }\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # BLOCO 15: ALGORITHM KERNEL — DIFF_v22_003\n#   TIER_A: 12 algoritmos core (sempre carregados)\n\
    #   TIER_B: por domínio (on-demand)\n#   TIER_C: índice de 405 algoritmos (apenas para MSE selection)\n\
    #   SR_13: algoritmo TIER_C sem código → confidence_cap 45\n#   G7: TIER_B carregado on-demand baseado\
    \ em domain_tags\n# ═══════════════════════════════════════════════════════════════════\n\n# ── TIER_A:\
    \ 12 Algoritmos Core ─────────────────────────────────────\n\nimport heapq\nfrom collections import\
    \ deque\n\ndef dijkstra(graph: dict, start: Any) -> dict:\n    \"\"\"\n    TIER_A #1: Dijkstra — caminho\
    \ mínimo com pesos não-negativos.\n    graph: {node: [(neighbor, weight), ...]}\n    FMEA_GUARD: todos\
    \ os pesos >= 0; start existe no grafo.\n    Complexidade: O((V+E) log V) | SR_09: N>5 → subprocess.\n\
    \    \"\"\"\n    # FMEA_GUARD\n    assert start in graph, f\"DIJKSTRA_GUARD: start '{start}' não está\
    \ no grafo\"\n    dist = {node: float('inf') for node in graph}\n    dist[start] = 0\n    pq = [(0,\
    \ start)]\n    while pq:\n        d, u = heapq.heappop(pq)\n        if d > dist[u]: continue\n   \
    \     for v, w in graph.get(u, []):\n            assert w >= 0, f\"DIJKSTRA_GUARD: peso negativo {w}\
    \ na aresta ({u},{v})\"\n            nd = d + w\n            if nd < dist[v]:\n                dist[v]\
    \ = nd\n                heapq.heappush(pq, (nd, v))\n    return dist\n\n\ndef bfs(graph: dict, start:\
    \ Any) -> list:\n    \"\"\"\n    TIER_A #2: BFS — busca em largura.\n    graph: {node: [neighbors]}\n\
    \    FMEA_GUARD: start existe; grafo não vazio.\n    Complexidade: O(V+E).\n    \"\"\"\n    assert\
    \ start in graph, f\"BFS_GUARD: start '{start}' não está no grafo\"\n    visited = {start}\n    queue\
    \   = deque([start])\n    order   = []\n    while queue:\n        node = queue.popleft()\n       \
    \ order.append(node)\n        for nb in graph.get(node, []):\n            if nb not in visited:\n\
    \                visited.add(nb)\n                queue.append(nb)\n    return order\n\n\ndef simulated_annealing(state:\
    \ Any, cost_func, neighbor_func,\n                        T0: float, alpha: float, steps: int) ->\
    \ Any:\n    \"\"\"\n    TIER_A #3: Simulated Annealing — otimização metaheurística.\n    FMEA_GUARD:\
    \ T0>0; alpha<1; steps>0.\n    Complexidade: O(steps).\n    \"\"\"\n    assert T0 > 0,       \"SA_GUARD:\
    \ T0 deve ser > 0\"\n    assert 0 < alpha < 1,\"SA_GUARD: alpha deve estar em (0,1)\"\n    assert\
    \ steps > 0,    \"SA_GUARD: steps deve ser > 0\"\n    T    = T0\n    best = state\n    best_cost =\
    \ cost_func(state)\n    for _ in range(steps):\n        candidate = neighbor_func(state)\n       \
    \ delta = cost_func(candidate) - cost_func(state)\n        if delta < 0 or (T > 0 and random.random()\
    \ < math.exp(-delta / T)):\n            state = candidate\n            curr_cost = cost_func(state)\n\
    \            if curr_cost < best_cost:\n                best, best_cost = state, curr_cost\n     \
    \   T *= alpha\n    return best\n\n\ndef rk4(f, t0: float, y0: float, h: float, steps: int) -> list:\n\
    \    \"\"\"\n    TIER_A #4: Runge-Kutta 4 — integrador ODE.\n    f: dy/dt = f(t, y)\n    FMEA_GUARD:\
    \ h>0; steps>0; SR_09: steps>5 → subprocess.\n    Complexidade: O(steps).\n    \"\"\"\n    assert\
    \ h > 0,     \"RK4_GUARD: h deve ser > 0\"\n    assert steps > 0, \"RK4_GUARD: steps deve ser > 0\"\
    \n    t, y = t0, y0\n    traj = [(t, y)]\n    for _ in range(steps):\n        k1 = f(t, y)\n     \
    \   k2 = f(t + h/2, y + h/2 * k1)\n        k3 = f(t + h/2, y + h/2 * k2)\n        k4 = f(t + h,  \
    \ y + h   * k3)\n        y  = y + h/6 * (k1 + 2*k2 + 2*k3 + k4)\n        t  = t + h\n        traj.append((t,\
    \ y))\n    return traj\n\n\ndef knapsack_01(weights: list, values: list, capacity: int) -> tuple:\n\
    \    \"\"\"\n    TIER_A #5: Knapsack 0/1 — programação dinâmica.\n    FMEA_GUARD: len(weights)==len(values);\
    \ capacity>0; todos weights>0.\n    Retorna: (valor_máximo, índices_selecionados).\n    Complexidade:\
    \ O(n·W).\n    \"\"\"\n    n = len(weights)\n    assert len(values) == n, \"KNAPSACK_GUARD: weights\
    \ e values devem ter mesmo tamanho\"\n    assert capacity > 0,     \"KNAPSACK_GUARD: capacity deve\
    \ ser > 0\"\n    dp = [[0] * (capacity + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n\
    \        for w in range(capacity + 1):\n            dp[i][w] = dp[i-1][w]\n            if weights[i-1]\
    \ <= w:\n                dp[i][w] = max(dp[i][w],\n                               dp[i-1][w-weights[i-1]]\
    \ + values[i-1])\n    w = capacity\n    selected = []\n    for i in range(n, 0, -1):\n        if dp[i][w]\
    \ != dp[i-1][w]:\n            selected.append(i-1)\n            w -= weights[i-1]\n    return dp[n][capacity],\
    \ selected[::-1]\n\n\ndef metropolis_hastings(state: Any, energy_func, proposal_func,\n          \
    \              T: float, steps: int) -> Any:\n    \"\"\"\n    TIER_A #6: Metropolis-Hastings — MCMC.\n\
    \    FMEA_GUARD: T>0; steps>0.\n    Complexidade: O(steps).\n    \"\"\"\n    assert T > 0,     \"\
    MH_GUARD: T deve ser > 0\"\n    assert steps > 0, \"MH_GUARD: steps deve ser > 0\"\n    current =\
    \ state\n    for _ in range(steps):\n        candidate = proposal_func(current)\n        delta = energy_func(candidate)\
    \ - energy_func(current)\n        if delta < 0 or random.random() < math.exp(-delta / T):\n      \
    \      current = candidate\n    return current\n\n\ndef conjugate_gradient(A: list, b: list, max_iter:\
    \ int = 1000,\n                        tol: float = 1e-8) -> list:\n    \"\"\"\n    TIER_A #7: Gradiente\
    \ Conjugado — sistema linear Ax=b (A SPD).\n    A: lista de listas (matriz quadrada)\n    b: lista\
    \ (vetor)\n    FMEA_GUARD: A quadrada; dimensões compatíveis.\n    Complexidade: O(n·√κ).\n    \"\"\
    \"\n    n = len(b)\n    assert len(A) == n and all(len(row)==n for row in A), \\\n        \"CG_GUARD:\
    \ A deve ser quadrada com dimensão compatível com b\"\n    def matvec(M, v):\n        return [sum(M[i][j]*v[j]\
    \ for j in range(n)) for i in range(n)]\n    def dot(u, v): return sum(x*y for x,y in zip(u,v))\n\
    \    def axpy(a, x, y): return [a*xi + yi for xi,yi in zip(x, y)]\n    x = [0.0] * n\n    r = [bi\
    \ - ri for bi, ri in zip(b, matvec(A, x))]\n    p = r[:]\n    rs_old = dot(r, r)\n    for _ in range(max_iter):\n\
    \        Ap    = matvec(A, p)\n        alpha = rs_old / max(dot(p, Ap), 1e-15)\n        x     = axpy(alpha,\
    \ p, x)\n        r     = axpy(-alpha, Ap, r)\n        rs_new = dot(r, r)\n        if math.sqrt(rs_new)\
    \ < tol: break\n        beta = rs_new / max(rs_old, 1e-15)\n        p    = axpy(beta, p, r)\n    \
    \    rs_old = rs_new\n    return x\n\n\ndef newton_raphson(f, df, x0: float,\n                   tol:\
    \ float = 1e-6, max_iter: int = 100) -> float:\n    \"\"\"\n    TIER_A #8: Newton-Raphson — raízes\
    \ de f(x).\n    FMEA_GUARD: df(x0) ≠ 0; max_iter > 0.\n    Complexidade: O(max_iter).\n    \"\"\"\n\
    \    assert max_iter > 0, \"NR_GUARD: max_iter deve ser > 0\"\n    x = float(x0)\n    for _ in range(max_iter):\n\
    \        fx = f(x)\n        if abs(fx) < tol: return x\n        dfx = df(x)\n        if abs(dfx) <\
    \ 1e-15: break\n        x = x - fx / dfx\n    return x\n\n\ndef hill_climbing(state: Any, cost_func,\
    \ neighbor_func,\n                  max_iter: int = 1000) -> Any:\n    \"\"\"\n    TIER_A #9: Hill\
    \ Climbing — busca local.\n    FMEA_GUARD: max_iter > 0.\n    Complexidade: O(max_iter).\n    \"\"\
    \"\n    assert max_iter > 0, \"HC_GUARD: max_iter deve ser > 0\"\n    best = state\n    best_cost\
    \ = cost_func(state)\n    for _ in range(max_iter):\n        candidate = neighbor_func(state)\n  \
    \      c_cost = cost_func(candidate)\n        if c_cost < best_cost:\n            best, best_cost\
    \ = candidate, c_cost\n            state = candidate\n        else:\n            break\n    return\
    \ best\n\n\ndef kalman_filter_1d(measurements: list, A: float = 1.0, H: float = 1.0,\n           \
    \          Q: float = 1e-4, R: float = 1.0,\n                     x0: float = 0.0, P0: float = 1.0)\
    \ -> list:\n    \"\"\"\n    TIER_A #10: Filtro de Kalman 1D — estimação de estado.\n    Versão escalar\
    \ para evitar dependência de numpy.\n    FMEA_GUARD: R > 0 (covariância de medição deve ser positiva).\n\
    \    Complexidade: O(n).\n    \"\"\"\n    assert R > 0, \"KALMAN_GUARD: R deve ser > 0\"\n    assert\
    \ len(measurements) > 0, \"KALMAN_GUARD: lista de medições não pode ser vazia\"\n    x, P = x0, P0\n\
    \    estimates = []\n    for z in measurements:\n        # Predição\n        x_pred = A * x\n    \
    \    P_pred = A * P * A + Q\n        # Atualização\n        K  = P_pred * H / max(H * P_pred * H +\
    \ R, 1e-15)\n        x  = x_pred + K * (z - H * x_pred)\n        P  = (1 - K * H) * P_pred\n     \
    \   estimates.append(x)\n    return estimates\n\n\ndef bayesian_update_beta(alpha: float, beta: float,\n\
    \                          successes: int, failures: int) -> tuple:\n    \"\"\"\n    TIER_A #11: Atualização\
    \ Bayesiana Beta-Binomial.\n    FMEA_GUARD: alpha>0; beta>0; successes>=0; failures>=0.\n    Retorna\
    \ (alpha_post, beta_post, mean_post, std_post).\n    Complexidade: O(1).\n    \"\"\"\n    assert alpha\
    \ > 0 and beta > 0, \"BAYES_GUARD: alpha e beta devem ser > 0\"\n    assert successes >= 0 and failures\
    \ >= 0, \"BAYES_GUARD: contagens não podem ser negativas\"\n    a = alpha + successes\n    b = beta\
    \  + failures\n    mean = a / (a + b)\n    std  = math.sqrt(a * b / ((a + b)**2 * (a + b + 1)))\n\
    \    return a, b, round(mean, 6), round(std, 6)\n\n\ndef genetic_algorithm(population: list, fitness_func,\n\
    \                       mutate_func, crossover_func,\n                       generations: int = 100,\n\
    \                       elite_size: int = 2) -> Any:\n    \"\"\"\n    TIER_A #12: Algoritmo Genético\
    \ básico.\n    FMEA_GUARD: len(population)>0; generations>0; elite_size>=0.\n    Complexidade: O(gerações\
    \ × população).\n    \"\"\"\n    assert len(population) > 0, \"GA_GUARD: população não pode ser vazia\"\
    \n    assert generations > 0,     \"GA_GUARD: generations deve ser > 0\"\n    assert elite_size >=\
    \ 0,     \"GA_GUARD: elite_size não pode ser negativo\"\n    for _ in range(generations):\n      \
    \  fitness = [(ind, fitness_func(ind)) for ind in population]\n        fitness.sort(key=lambda x:\
    \ x[1])\n        elite   = [ind for ind, _ in fitness[:elite_size]]\n        new_pop = elite[:]\n\
    \        while len(new_pop) < len(population):\n            p1 = random.choice(population)\n     \
    \       p2 = random.choice(population)\n            child = crossover_func(p1, p2)\n            if\
    \ random.random() < 0.1:\n                child = mutate_func(child)\n            new_pop.append(child)\n\
    \        population = new_pop\n    return min(population, key=fitness_func)\n\n\n\n# ═══════════════════════════════════════════════════════════════════\n\
    # TIER_B — 38 Algoritmos — 7 Famílias\n# DIFF_v22_TIER_B_001: aprovação USER_EXPLICIT\n# Famílias:\
    \ graph(7) · optimization(8) · probabilistic(5)\n#           numerical(5) · combinatorics(4) · control(4)\
    \ · ml(5)\n# SR_13: TIER_B com código — sem confidence_cap\n# G7: carregado on-demand por domain_tags\n\
    # ═══════════════════════════════════════════════════════════════════\n\ndef bellman_ford(graph: dict,\
    \ start: Any) -> dict:\n    \"\"\"\n    TIER_B #01 (graph): Bellman-Ford — caminho mínimo com pesos\
    \ negativos.\n    graph: {node: [(neighbor, weight), ...]}\n    Retorna: {node: distância_mínima}\
    \ — inf se inalcançável.\n    FMEA_GUARD: start existe no grafo; sem ciclo negativo (detectado).\n\
    \    Complexidade: O(V·E).\n    \"\"\"\n    assert start in graph, f\"BF_GUARD: start '{start}' não\
    \ está no grafo\"\n    dist = {node: float('inf') for node in graph}\n    dist[start] = 0\n    nodes\
    \ = list(graph.keys())\n    V = len(nodes)\n    # Relaxamento V-1 vezes\n    for _ in range(V - 1):\n\
    \        for u in nodes:\n            for v, w in graph.get(u, []):\n                if v not in dist:\n\
    \                    dist[v] = float('inf')\n                if dist[u] + w < dist[v]:\n         \
    \           dist[v] = dist[u] + w\n    # Detecção de ciclo negativo\n    for u in nodes:\n       \
    \ for v, w in graph.get(u, []):\n            assert dist[u] + w >= dist[v] - 1e-12, \\\n         \
    \       f\"BF_GUARD: ciclo negativo detectado na aresta ({u},{v})\"\n    return dist\n\n\ndef floyd_warshall(n:\
    \ int, edges: list) -> list:\n    \"\"\"\n    TIER_B #02 (graph): Floyd-Warshall — todos os pares\
    \ de caminhos mínimos.\n    n: número de vértices (0-indexados, inteiro explícito).\n    edges: [(u,\
    \ v, weight), ...]\n    Retorna: matriz dist[n][n], dist[i][j] = custo mínimo i→j (inf se inalcançável).\n\
    \    Nota (FIX-I-S1): o chamador deve fornecer n explicitamente (não inferido das edges).\n    FMEA_GUARD:\
    \ n > 0; vértices em [0, n-1]; sem autoloops de peso negativo.\n    Complexidade: O(V³).\n    \"\"\
    \"\n    assert n > 0, \"FW_GUARD: n deve ser > 0\"\n    INF = float('inf')\n    dist = [[INF] * n\
    \ for _ in range(n)]\n    for i in range(n):\n        dist[i][i] = 0\n    for u, v, w in edges:\n\
    \        assert 0 <= u < n and 0 <= v < n, \\\n            f\"FW_GUARD: vértice fora do intervalo\
    \ [0,{n-1}]: ({u},{v})\"\n        dist[u][v] = min(dist[u][v], w)\n    for k in range(n):\n      \
    \  for i in range(n):\n            for j in range(n):\n                if dist[i][k] + dist[k][j]\
    \ < dist[i][j]:\n                    dist[i][j] = dist[i][k] + dist[k][j]\n    # Verifica ciclo negativo\n\
    \    for i in range(n):\n        assert dist[i][i] >= -1e-12, \\\n            f\"FW_GUARD: ciclo negativo\
    \ detectado no vértice {i}\"\n    return dist\n\n\ndef kruskal(n: int, edges: list) -> list:\n   \
    \ \"\"\"\n    TIER_B #03 (graph): Kruskal — Árvore Geradora Mínima (MST).\n    n: número de vértices.\n\
    \    edges: [(weight, u, v), ...]\n    Retorna: lista de arestas MST [(weight, u, v)].\n    FMEA_GUARD:\
    \ n > 0; arestas com formato válido.\n    Complexidade: O(E log E).\n    \"\"\"\n    assert n > 0,\
    \ \"KRUSKAL_GUARD: n deve ser > 0\"\n    # Union-Find\n    parent = list(range(n))\n    rank   = [0]\
    \ * n\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n\
    \            x = parent[x]\n        return x\n\n    def union(a, b):\n        ra, rb = find(a), find(b)\n\
    \        if ra == rb:\n            return False\n        if rank[ra] < rank[rb]:\n            ra,\
    \ rb = rb, ra\n        parent[rb] = ra\n        if rank[ra] == rank[rb]:\n            rank[ra] +=\
    \ 1\n        return True\n\n    mst = []\n    for w, u, v in sorted(edges):\n        assert 0 <= u\
    \ < n and 0 <= v < n, \\\n            f\"KRUSKAL_GUARD: vértice fora do intervalo [0,{n-1}]: ({u},{v})\"\
    \n        if union(u, v):\n            mst.append((w, u, v))\n    return mst\n\n\ndef prim(graph:\
    \ dict, start: Any) -> list:\n    \"\"\"\n    TIER_B #04 (graph): Prim — Árvore Geradora Mínima via\
    \ fila de prioridade.\n    graph: {node: [(neighbor, weight), ...]}\n    Retorna: lista de arestas\
    \ MST [(weight, u, v)].\n    FMEA_GUARD: start existe; grafo não vazio.\n    Complexidade: O(E log\
    \ V).\n    \"\"\"\n    assert len(graph) > 0, \"PRIM_GUARD: grafo não pode ser vazio\"\n    assert\
    \ start in graph, f\"PRIM_GUARD: start '{start}' não está no grafo\"\n    visited = {start}\n    edges\
    \   = [(w, start, v) for v, w in graph.get(start, [])]\n    heapq.heapify(edges)\n    mst = []\n \
    \   while edges:\n        w, u, v = heapq.heappop(edges)\n        if v in visited:\n            continue\n\
    \        visited.add(v)\n        mst.append((w, u, v))\n        for nb, nw in graph.get(v, []):\n\
    \            if nb not in visited:\n                heapq.heappush(edges, (nw, v, nb))\n    return\
    \ mst\n\n\ndef a_star(graph: dict, start: Any, goal: Any, heuristic) -> list:\n    \"\"\"\n    TIER_B\
    \ #05 (graph): A* — caminho mínimo com heurística admissível.\n    graph: {node: [(neighbor, weight),\
    \ ...]}\n    heuristic: callable(node) → estimativa de custo até goal (h(goal)=0).\n    Retorna: caminho\
    \ [start, ..., goal] ou [] se inalcançável.\n    FMEA_GUARD: start e goal existem; heuristic(goal)\
    \ == 0.\n    Complexidade: O(E) best case.\n    \"\"\"\n    assert start in graph, f\"ASTAR_GUARD:\
    \ start '{start}' não está no grafo\"\n    assert goal in graph,  f\"ASTAR_GUARD: goal '{goal}' não\
    \ está no grafo\"\n    assert heuristic(goal) == 0, \"ASTAR_GUARD: heuristic(goal) deve ser 0\"\n\
    \    open_set = [(heuristic(start), 0, start, [start])]\n    visited  = set()\n    while open_set:\n\
    \        f, g, node, path = heapq.heappop(open_set)\n        if node == goal:\n            return\
    \ path\n        if node in visited:\n            continue\n        visited.add(node)\n        for\
    \ nb, w in graph.get(node, []):\n            if nb not in visited:\n                ng = g + w\n \
    \               heapq.heappush(open_set, (ng + heuristic(nb), ng, nb, path + [nb]))\n    return []\
    \  # inalcançável\n\n\ndef topological_sort(graph: dict) -> list:\n    \"\"\"\n    TIER_B #06 (graph):\
    \ Ordenação Topológica — grafo dirigido acíclico (DAG).\n    graph: {node: [neighbors, ...]} (lista\
    \ de adjacência, sem pesos)\n    Retorna: lista de nós em ordem topológica.\n    FMEA_GUARD: grafo\
    \ sem ciclos (detectado via DFS).\n    Complexidade: O(V+E).\n    \"\"\"\n    assert len(graph) >\
    \ 0, \"TOPO_GUARD: grafo não pode ser vazio\"\n    # FIX-I-R2: DFS iterativo via pilha explícita —\
    \ sem recursão nativa\n    WHITE, GRAY, BLACK = 0, 1, 2\n    color  = {n: WHITE for n in graph}\n\
    \    result = []\n\n    for start in list(graph.keys()):\n        if color[start] != WHITE:\n    \
    \        continue\n        stack = [(start, iter(graph.get(start, [])))]\n        color[start] = GRAY\n\
    \        while stack:\n            node, it = stack[-1]\n            try:\n                nb = next(it)\n\
    \                if nb not in color:\n                    color[nb] = WHITE\n                assert\
    \ color[nb] != GRAY, \\\n                    f\"TOPO_GUARD: ciclo detectado no nó '{nb}' — não é DAG\"\
    \n                if color[nb] == WHITE:\n                    color[nb] = GRAY\n                 \
    \   stack.append((nb, iter(graph.get(nb, []))))\n            except StopIteration:\n             \
    \   color[node] = BLACK\n                result.append(node)\n                stack.pop()\n    return\
    \ result[::-1]\n\n\ndef kosaraju_scc(graph: dict) -> list:\n    \"\"\"\n    TIER_B #07 (graph): Kosaraju\
    \ — Componentes Fortemente Conectados (SCCs).\n    graph: {node: [neighbors, ...]}\n    Retorna: lista\
    \ de SCCs, cada SCC é uma lista de nós.\n    FMEA_GUARD: grafo não vazio.\n    Complexidade: O(V+E).\n\
    \    \"\"\"\n    assert len(graph) > 0, \"KOSARAJU_GUARD: grafo não pode ser vazio\"\n    nodes =\
    \ list(graph.keys())\n    # Passa 1: ordem de finalização\n    visited = set()\n    finish  = []\n\
    \n    def dfs1(u):\n        stack = [(u, iter(graph.get(u, [])))]\n        while stack:\n        \
    \    node, it = stack[-1]\n            try:\n                nb = next(it)\n                if nb\
    \ not in visited:\n                    visited.add(nb)\n                    stack.append((nb, iter(graph.get(nb,\
    \ []))))\n            except StopIteration:\n                finish.append(node)\n               \
    \ stack.pop()\n\n    for n in nodes:\n        if n not in visited:\n            visited.add(n)\n \
    \           dfs1(n)\n    # Grafo transposto\n    rev = {n: [] for n in nodes}\n    for u in nodes:\n\
    \        for v in graph.get(u, []):\n            if v not in rev:\n                rev[v] = []\n \
    \           rev[v].append(u)\n    # Passa 2: DFS no transposto na ordem reversa de finalização\n \
    \   visited2 = set()\n    sccs = []\n\n    def dfs2(u):\n        comp = []\n        stack = [u]\n\
    \        while stack:\n            node = stack.pop()\n            if node in visited2:\n        \
    \        continue\n            visited2.add(node)\n            comp.append(node)\n            for\
    \ nb in rev.get(node, []):\n                if nb not in visited2:\n                    stack.append(nb)\n\
    \        return comp\n\n    for n in reversed(finish):\n        if n not in visited2:\n          \
    \  sccs.append(dfs2(n))\n    return sccs\n\n\n# ─────────────────────────────────────────────────────────────────\n\
    # FAMÍLIA: OPTIMIZATION (8 algoritmos) — B08..B15\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef gradient_descent(grad_func, x0: list, lr: float = 0.01,\n                     steps: int = 1000,\
    \ tol: float = 1e-6) -> list:\n    \"\"\"\n    TIER_B #08 (optimization): Gradient Descent — otimização\
    \ de primeira ordem.\n    grad_func: callable(x: list) → lista de gradientes.\n    x0: ponto inicial.\n\
    \    lr: learning rate; steps: máx iterações; tol: tolerância de convergência.\n    FMEA_GUARD: lr\
    \ > 0; steps > 0; len(x0) > 0.\n    Complexidade: O(steps · dim).\n    \"\"\"\n    assert lr > 0,\
    \        \"GD_GUARD: lr deve ser > 0\"\n    assert steps > 0,     \"GD_GUARD: steps deve ser > 0\"\
    \n    assert len(x0) > 0,   \"GD_GUARD: x0 não pode ser vazio\"\n    x = list(x0)\n    for _ in range(steps):\n\
    \        g = grad_func(x)\n        x_new = [xi - lr * gi for xi, gi in zip(x, g)]\n        if math.sqrt(sum((xi\
    \ - xn)**2 for xi, xn in zip(x, x_new))) < tol:\n            return x_new\n        x = x_new\n   \
    \ return x\n\n\ndef sgd(grad_func, x0: list, dataset: list, lr: float = 0.01,\n        epochs: int\
    \ = 10, tol: float = 1e-6) -> list:\n    \"\"\"\n    TIER_B #09 (optimization): SGD — Stochastic Gradient\
    \ Descent.\n    grad_func: callable(x, sample) → lista de gradientes para um sample.\n    dataset:\
    \ lista de amostras.\n    FMEA_GUARD: lr > 0; epochs > 0; dataset não vazio; len(x0) > 0.\n    Complexidade:\
    \ O(epochs · |dataset| · dim).\n\n    OPP-61 GAP-17: tol= aceito na assinatura mas convergência não\
    \ verificada.\n    Razão: SGD mini-batch não tem critério de parada natural por tolerância\n    (oscilação\
    \ estocástica impede verificação monotônica). epochs= é o critério\n    de parada correto para SGD.\
    \ tol= reservado para futura implementação de\n    early stopping baseado em variância do gradiente.\n\
    \    \"\"\"\n    assert lr > 0,          \"SGD_GUARD: lr deve ser > 0\"\n    assert epochs > 0,  \
    \    \"SGD_GUARD: epochs deve ser > 0\"\n    assert len(dataset) > 0,\"SGD_GUARD: dataset não pode\
    \ ser vazio\"\n    assert len(x0) > 0,     \"SGD_GUARD: x0 não pode ser vazio\"\n    x = list(x0)\n\
    \    for _ in range(epochs):\n        shuffled = dataset[:]\n        random.shuffle(shuffled)\n  \
    \      for sample in shuffled:\n            g = grad_func(x, sample)\n            x = [xi - lr * gi\
    \ for xi, gi in zip(x, g)]\n    return x\n\n\ndef adam(grad_func, x0: list, lr: float = 0.001, beta1:\
    \ float = 0.9,\n         beta2: float = 0.999, eps: float = 1e-8, steps: int = 1000) -> list:\n  \
    \  \"\"\"\n    TIER_B #10 (optimization): Adam — Adaptive Moment Estimation.\n    grad_func: callable(x:\
    \ list) → lista de gradientes.\n    FMEA_GUARD: lr > 0; 0 < beta1 < 1; 0 < beta2 < 1; eps > 0.\n \
    \   Complexidade: O(steps · dim).\n    \"\"\"\n    assert lr > 0,              \"ADAM_GUARD: lr deve\
    \ ser > 0\"\n    assert 0 < beta1 < 1,       \"ADAM_GUARD: beta1 deve estar em (0,1)\"\n    assert\
    \ 0 < beta2 < 1,       \"ADAM_GUARD: beta2 deve estar em (0,1)\"\n    assert eps > 0,            \
    \ \"ADAM_GUARD: eps deve ser > 0\"\n    assert len(x0) > 0,         \"ADAM_GUARD: x0 não pode ser\
    \ vazio\"\n    x  = list(x0)\n    m  = [0.0] * len(x)\n    v  = [0.0] * len(x)\n    for t in range(1,\
    \ steps + 1):\n        g = grad_func(x)\n        m = [beta1 * mi + (1 - beta1) * gi for mi, gi in\
    \ zip(m, g)]\n        v = [beta2 * vi + (1 - beta2) * gi**2 for vi, gi in zip(v, g)]\n        m_hat\
    \ = [mi / (1 - beta1**t) for mi in m]\n        v_hat = [vi / (1 - beta2**t) for vi in v]\n       \
    \ x = [xi - lr * mhi / (math.sqrt(vhi) + eps)\n             for xi, mhi, vhi in zip(x, m_hat, v_hat)]\n\
    \    return x\n\n\ndef particle_swarm(cost_func, bounds: list, n_particles: int = 30,\n          \
    \         steps: int = 100, w: float = 0.7,\n                   c1: float = 1.5, c2: float = 1.5)\
    \ -> tuple:\n    \"\"\"\n    TIER_B #11 (optimization): Particle Swarm Optimization (PSO).\n    cost_func:\
    \ callable(x: list) → float (minimização).\n    bounds: [(min_i, max_i), ...] para cada dimensão.\n\
    \    Retorna: (melhor_posição, melhor_custo).\n    FMEA_GUARD: n_particles > 0; steps > 0; bounds\
    \ não vazio.\n    Complexidade: O(steps · n_particles · dim).\n    \"\"\"\n    assert n_particles\
    \ > 0, \"PSO_GUARD: n_particles deve ser > 0\"\n    assert steps > 0,       \"PSO_GUARD: steps deve\
    \ ser > 0\"\n    assert len(bounds) > 0, \"PSO_GUARD: bounds não pode ser vazio\"\n    dim = len(bounds)\n\
    \    pos = [[random.uniform(b[0], b[1]) for b in bounds]\n           for _ in range(n_particles)]\n\
    \    vel = [[random.uniform(-(b[1]-b[0]), b[1]-b[0]) for b in bounds]\n           for _ in range(n_particles)]\n\
    \    pbest      = [p[:] for p in pos]\n    pbest_cost = [cost_func(p) for p in pos]\n    gbest_idx\
    \  = min(range(n_particles), key=lambda i: pbest_cost[i])\n    gbest      = pbest[gbest_idx][:]\n\
    \    gbest_cost = pbest_cost[gbest_idx]\n    for _ in range(steps):\n        for i in range(n_particles):\n\
    \            r1 = [random.random() for _ in range(dim)]\n            r2 = [random.random() for _ in\
    \ range(dim)]\n            vel[i] = [w * vel[i][d]\n                      + c1 * r1[d] * (pbest[i][d]\
    \ - pos[i][d])\n                      + c2 * r2[d] * (gbest[d]    - pos[i][d])\n                 \
    \     for d in range(dim)]\n            pos[i] = [max(bounds[d][0], min(bounds[d][1],\n          \
    \                pos[i][d] + vel[i][d]))\n                      for d in range(dim)]\n           \
    \ c = cost_func(pos[i])\n            if c < pbest_cost[i]:\n                pbest[i], pbest_cost[i]\
    \ = pos[i][:], c\n                if c < gbest_cost:\n                    gbest, gbest_cost = pos[i][:],\
    \ c\n    return gbest, gbest_cost\n\n\ndef isotropic_es(cost_func, x0: list, sigma0: float = 0.5,\n\
    \           steps: int = 200, lam: int = None) -> list:\n    \"\"\"\n    TIER_B #12 (optimization):\
    \ (mu/mu_w, lambda)-ES com recombinacao ponderada.\n    DIFF_CMA_RENAME (OPP-30, BUG-G04): renomeado\
    \ de 'cma_es' para 'isotropic_es'.\n    DIFF_IES_SIGMA_RULE (OPP-40, FMEA-08): sigma adaptation via\
    \ 1/5-rule real.\n\n    OPP-40 — Problema anterior:\n      sigma adaptation com threshold 1e-10 era\
    \ extremamente fraco.\n      Em plateaux (regiões planas onde f_new ≈ best_f), a condição\n      'f_new\
    \ < best_f + 1e-10' nunca dispara → sigma não reduz →\n      convergência estagnada em landscapes\
    \ planos (P(plateau) alta em\n      problemas de engenharia com restrições).\n\n    OPP-40 — Solução:\
    \ regra 1/5 proporcional (Hansen, 2001):\n      success_rate = n_success / lam  (candidatos que melhoram\
    \ o centroide)\n      success_rate > 1/5 → sigma *= 1.5   (mais explorações — região promissora)\n\
    \      success_rate < 1/5 → sigma *= 0.7   (mais exploração local — estreitar)\n      success_rate\
    \ ≈ 1/5 → sigma estável  (balanço exploration/exploitation)\n      Janela deslizante de window_size=lam\
    \ steps para rate estável.\n\n    Alias cma_es mantido para compatibilidade retroativa.\n    cost_func:\
    \ callable(x: list) → float (minimizacao).\n    x0: centroide inicial; sigma0: desvio padrao inicial.\n\
    \    FMEA_GUARD: sigma0 > 0; len(x0) > 0; steps > 0.\n    Complexidade: O(steps * lam * dim).\n  \
    \  \"\"\"\n    assert sigma0 > 0,    \"IES_GUARD: sigma0 deve ser > 0\"\n    assert len(x0) > 0, \
    \  \"IES_GUARD: x0 nao pode ser vazio\"\n    assert steps > 0,     \"IES_GUARD: steps deve ser > 0\"\
    \n    n     = len(x0)\n    lam   = lam or max(4 + int(3 * math.log(max(n, 1))), 6)\n    mu    = lam\
    \ // 2\n    # Pesos de recombinacao log-uniformes\n    raw_w  = [math.log(mu + 0.5) - math.log(i +\
    \ 1) for i in range(mu)]\n    w_sum  = sum(raw_w)\n    weights= [w / w_sum for w in raw_w]\n    x\
    \      = list(x0)\n    sigma  = sigma0\n    best_x = list(x0)\n    best_f = cost_func(x0)\n    # OPP-40:\
    \ janela deslizante para success_rate estável\n    from collections import deque as _deq_sw\n    success_window:\
    \ _deq_sw = _deq_sw(maxlen=lam)  # OPP-56: O(1) popleft\n    ONE_FIFTH = 1.0 / 5.0\n    for step in\
    \ range(steps):\n        # Amostrar lambda candidatos\n        f_prev = cost_func(x)   # OPP-40: f\
    \ do centroide ANTERIOR (antes de atualizar x)\n        samples = [[x[j] + sigma * random.gauss(0,\
    \ 1) for j in range(n)]\n                   for _ in range(lam)]\n        # Avaliar todos e ordenar\n\
    \        ranked_with_f = sorted([(cost_func(s), s) for s in samples], key=lambda t: t[0])\n      \
    \  ranked = [s for _, s in ranked_with_f]\n        ranked_f = [f for f, _ in ranked_with_f]\n    \
    \    # Recombinacao ponderada dos melhores mu\n        x_new = [sum(weights[i] * ranked[i][j] for\
    \ i in range(mu))\n                 for j in range(n)]\n        f_new = cost_func(x_new)\n       \
    \ # Elitismo: manter melhor encontrado\n        if f_new < best_f:\n            best_f = f_new\n \
    \           best_x = x_new[:]\n        x = x_new\n        # OPP-40: contar sucessos vs centroide ANTERIOR\
    \ (não novo)\n        # n_success = candidatos melhores que f(x_prev)\n        n_success = sum(1 for\
    \ fi in ranked_f if fi < f_prev)\n        success_window.append(n_success)\n        if len(success_window)\
    \ > lam:\n            success_window.popleft()  # OPP-56: deque.popleft() is O(1)\n        # OPP-40:\
    \ 1/5-rule com janela deslizante de lam passos\n        if len(success_window) >= lam:\n         \
    \   rate = sum(success_window) / (lam * lam)  # normalizado por lam candidatos\n            if rate\
    \ > ONE_FIFTH:\n                sigma = min(sigma * 1.5, sigma0 * 10.0)   # explorar mais\n      \
    \      elif rate < ONE_FIFTH:\n                sigma = max(sigma * 0.7, sigma0 * 1e-4)   # exploitar\
    \ mais\n            # rate ≈ 1/5: sigma estável\n    return best_x\n\n# OPP-30: alias para compatibilidade\
    \ retroativa — código antigo que referencie\n# cma_es continua funcionando; novos usos devem usar\
    \ isotropic_es.\ncma_es = isotropic_es\n\n\ndef tabu_search(cost_func, initial: Any, neighbor_func,\n\
    \                tabu_size: int = 20, steps: int = 500) -> tuple:\n    \"\"\"\n    TIER_B #13 (optimization):\
    \ Tabu Search — metaheurística com memória.\n    cost_func: callable(state) → float (minimização).\n\
    \    neighbor_func: callable(state) → lista de estados vizinhos.\n    Retorna: (melhor_estado, melhor_custo).\n\
    \    FMEA_GUARD: tabu_size > 0; steps > 0.\n    Complexidade: O(steps · |vizinhos|).\n    \"\"\"\n\
    \    assert tabu_size > 0, \"TABU_GUARD: tabu_size deve ser > 0\"\n    assert steps > 0,     \"TABU_GUARD:\
    \ steps deve ser > 0\"\n    current    = initial\n    best       = current\n    best_cost  = cost_func(current)\n\
    \    from collections import deque as _deq_t\n    tabu_list = _deq_t(maxlen=tabu_size)  # OPP-56:\
    \ O(1) popleft, auto-bounded\n    for _ in range(steps):\n        neighbors = neighbor_func(current)\n\
    \        candidates = [(n, cost_func(n)) for n in neighbors if n not in tabu_list]\n        if not\
    \ candidates:\n            candidates = [(n, cost_func(n)) for n in neighbors]\n        candidates.sort(key=lambda\
    \ t: t[1])\n        current, curr_cost = candidates[0]\n        tabu_list.append(current)\n      \
    \  if len(tabu_list) > tabu_size:\n            tabu_list.popleft()  # OPP-56: O(1) deque\n       \
    \ if curr_cost < best_cost:\n            best, best_cost = current, curr_cost\n    return best, best_cost\n\
    \n\ndef cross_entropy_method(cost_func, bounds: list,\n                          n_samples: int =\
    \ 100, elite_frac: float = 0.1,\n                          steps: int = 50) -> list:\n    \"\"\"\n\
    \    TIER_B #14 (optimization): Cross-Entropy Method — otimização por amostragem.\n    cost_func:\
    \ callable(x: list) → float (minimização).\n    bounds: [(min_i, max_i), ...] para cada dimensão.\n\
    \    FMEA_GUARD: n_samples > 0; 0 < elite_frac < 1; steps > 0; bounds não vazio.\n    Complexidade:\
    \ O(steps · n_samples · dim).\n    \"\"\"\n    assert n_samples > 0,           \"CEM_GUARD: n_samples\
    \ deve ser > 0\"\n    assert 0 < elite_frac < 1,      \"CEM_GUARD: elite_frac deve estar em (0,1)\"\
    \n    assert steps > 0,               \"CEM_GUARD: steps deve ser > 0\"\n    assert len(bounds) >\
    \ 0,         \"CEM_GUARD: bounds não pode ser vazio\"\n    dim   = len(bounds)\n    mu    = [(b[0]\
    \ + b[1]) / 2 for b in bounds]\n    sigma = [(b[1] - b[0]) / 4 for b in bounds]\n    n_elite = max(1,\
    \ int(n_samples * elite_frac))\n    for _ in range(steps):\n        samples = [[random.gauss(mu[d],\
    \ max(sigma[d], 1e-10))\n                    for d in range(dim)]\n                   for _ in range(n_samples)]\n\
    \        # Clamp dentro dos bounds\n        samples = [[max(bounds[d][0], min(bounds[d][1], s[d]))\n\
    \                    for d in range(dim)]\n                   for s in samples]\n        costs   =\
    \ sorted(samples, key=cost_func)\n        elite   = costs[:n_elite]\n        mu      = [sum(e[d] for\
    \ e in elite) / n_elite for d in range(dim)]\n        sigma   = [math.sqrt(sum((e[d] - mu[d])**2 for\
    \ e in elite) /\n                              max(n_elite - 1, 1)) + 1e-10\n                   for\
    \ d in range(dim)]\n    return mu\n\n\ndef lbfgs(grad_func, x0: list, steps: int = 100,\n        \
    \  m: int = 10, tol: float = 1e-6) -> list:\n    \"\"\"\n    TIER_B #15 (optimization): L-BFGS — Limited-memory\
    \ BFGS (quasi-Newton).\n    grad_func: callable(x: list) → lista de gradientes.\n    m: número de\
    \ pares s/y armazenados.\n    FMEA_GUARD: steps > 0; m > 0; len(x0) > 0.\n    Complexidade: O(steps\
    \ · m · dim).\n    \"\"\"\n    assert steps > 0,   \"LBFGS_GUARD: steps deve ser > 0\"\n    assert\
    \ m > 0,       \"LBFGS_GUARD: m deve ser > 0\"\n    assert len(x0) > 0, \"LBFGS_GUARD: x0 não pode\
    \ ser vazio\"\n    x      = list(x0)\n    g      = grad_func(x)\n    from collections import deque\
    \ as _deq_l\n    s_list = _deq_l(maxlen=m)  # OPP-56: O(1) popleft, bounded by memory m\n    y_list\
    \ = _deq_l(maxlen=m)  # OPP-56: O(1) popleft, bounded by memory m\n    for _ in range(steps):\n  \
    \      # Two-loop recursion L-BFGS\n        q = g[:]\n        alphas = []\n        for s, y in reversed(list(zip(s_list,\
    \ y_list))):\n            ys  = sum(yi * si for yi, si in zip(y, s))\n            if abs(ys) < 1e-12:\n\
    \                alphas.append(0.0)\n                continue\n            rho = 1.0 / ys\n      \
    \      a   = rho * sum(si * qi for si, qi in zip(s, q))\n            alphas.append(a)\n          \
    \  q = [qi - a * yi for qi, yi in zip(q, y)]\n        r = q[:]\n        for (s, y), a in zip(zip(s_list,\
    \ y_list), reversed(alphas)):\n            ys  = sum(yi * si for yi, si in zip(y, s))\n          \
    \  if abs(ys) < 1e-12:\n                continue\n            rho = 1.0 / ys\n            b   = rho\
    \ * sum(yi * ri for yi, ri in zip(y, r))\n            r = [ri + (a - b) * si for ri, si in zip(r,\
    \ s)]\n        # Backtracking line search\n        lr = 1.0\n        for _ in range(20):\n       \
    \     x_new = [xi - lr * ri for xi, ri in zip(x, r)]\n            g_new = grad_func(x_new)\n     \
    \       if sum(gi**2 for gi in g_new) < sum(gi**2 for gi in g):\n                break\n         \
    \   lr *= 0.5\n        s_list.append([xn - xo for xn, xo in zip(x_new, x)])\n        y_list.append([gn\
    \ - go for gn, go in zip(g_new, g)])\n        # OPP-56: deque(maxlen=m) auto-drops oldest entry —\
    \ no manual pop needed\n        if math.sqrt(sum(gi**2 for gi in g_new)) < tol:\n            return\
    \ x_new\n        x, g = x_new, g_new\n    return x\n\n\n# ─────────────────────────────────────────────────────────────────\n\
    # FAMÍLIA: PROBABILISTIC (5 algoritmos) — B16..B20\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef gibbs_sampling(conditionals: list, n_vars: int, n_samples: int = 1000,\n                   burnin:\
    \ int = 100) -> list:\n    \"\"\"\n    TIER_B #16 (probabilistic): Gibbs Sampling — MCMC por amostragem\
    \ condicional.\n    conditionals: lista de callables, conditionals[i](state) → amostra da var i\n\
    \                  dado o estado atual (state é lista de n_vars valores).\n    Retorna: lista de amostras\
    \ (pós-burnin), cada sample é lista de n_vars.\n    FMEA_GUARD: n_vars > 0; n_samples > 0; len(conditionals)\
    \ == n_vars.\n    Complexidade: O((burnin + n_samples) · n_vars).\n    \"\"\"\n    assert n_vars >\
    \ 0,                      \"GIBBS_GUARD: n_vars deve ser > 0\"\n    assert n_samples > 0,        \
    \           \"GIBBS_GUARD: n_samples deve ser > 0\"\n    assert len(conditionals) == n_vars,     \\\
    \n        f\"GIBBS_GUARD: len(conditionals)={len(conditionals)} != n_vars={n_vars}\"\n    state  \
    \ = [0.0] * n_vars\n    samples = []\n    for step in range(burnin + n_samples):\n        for i in\
    \ range(n_vars):\n            state[i] = conditionals[i](state)\n        if step >= burnin:\n    \
    \        samples.append(state[:])\n    return samples\n\n\ndef particle_filter(obs_model, trans_model,\
    \ likelihood,\n                    observations: list, n_particles: int = 200) -> list:\n    \"\"\"\
    \n    TIER_B #17 (probabilistic): Particle Filter (Sequential Monte Carlo).\n    obs_model: callable(n)\
    \ → lista de n partículas iniciais.\n    trans_model: callable(particle) → nova partícula (transição).\n\
    \    likelihood: callable(particle, obs) → peso não-normalizado.\n    observations: lista de observações.\n\
    \    Retorna: lista de estimativas de estado (média ponderada por passo).\n    FMEA_GUARD: n_particles\
    \ > 0; observations não vazio.\n    Complexidade: O(|obs| · n_particles).\n    \"\"\"\n    assert\
    \ n_particles > 0,      \"PF_GUARD: n_particles deve ser > 0\"\n    assert len(observations) > 0,\"\
    PF_GUARD: observations não pode ser vazio\"\n    particles = obs_model(n_particles)\n    estimates\
    \ = []\n    for obs in observations:\n        # Predição\n        particles = [trans_model(p) for\
    \ p in particles]\n        # Atualização de pesos\n        weights = [max(likelihood(p, obs), 1e-300)\
    \ for p in particles]\n        total = sum(weights)\n        weights = [w / total for w in weights]\n\
    \        # Estimativa\n        if isinstance(particles[0], (int, float)):\n            estimate =\
    \ sum(p * w for p, w in zip(particles, weights))\n        else:\n            n = len(particles[0])\n\
    \            estimate = [sum(p[d] * w for p, w in zip(particles, weights))\n                     \
    \   for d in range(n)]\n        estimates.append(estimate)\n        # Reamostragem sistemática\n \
    \       cdf = []\n        c   = 0.0\n        for w in weights:\n            c += w\n            cdf.append(c)\n\
    \        new_particles = []\n        r = random.random() / n_particles\n        i = 0\n        for\
    \ j in range(n_particles):\n            u = r + j / n_particles\n            while i < len(cdf) -\
    \ 1 and u > cdf[i]:\n                i += 1\n            new_particles.append(particles[i])\n    \
    \    particles = new_particles\n    return estimates\n\n\ndef em_algorithm(data: list, k: int, max_iter:\
    \ int = 100,\n                 tol: float = 1e-6) -> tuple:\n    \"\"\"\n    TIER_B #18 (probabilistic):\
    \ EM Algorithm — Gaussian Mixture Model 1D.\n    Versão 1D para Python puro (sem numpy).\n    Retorna:\
    \ (mus, sigmas, pis) — parâmetros das k gaussianas.\n    FMEA_GUARD: k > 0; len(data) >= k; max_iter\
    \ > 0.\n    Complexidade: O(max_iter · n · k).\n    \"\"\"\n    assert k > 0,              \"EM_GUARD:\
    \ k deve ser > 0\"\n    assert len(data) >= k,     f\"EM_GUARD: n={len(data)} deve ser >= k={k}\"\n\
    \    assert max_iter > 0,       \"EM_GUARD: max_iter deve ser > 0\"\n    n    = len(data)\n    # Inicialização\n\
    \    mus   = [data[i * (n // k)] for i in range(k)]\n    sigmas= [1.0] * k\n    pis   = [1.0 / k]\
    \ * k\n\n    def gauss1d(x, mu, sigma):\n        return (1.0 / max(sigma * math.sqrt(2 * math.pi),\
    \ 1e-300) *\n                math.exp(-0.5 * ((x - mu) / max(sigma, 1e-10))**2))\n\n    prev_log =\
    \ float('-inf')\n    for _ in range(max_iter):\n        # E-step\n        resp = []\n        for x\
    \ in data:\n            r = [pis[j] * gauss1d(x, mus[j], sigmas[j]) for j in range(k)]\n         \
    \   total = max(sum(r), 1e-300)\n            resp.append([rj / total for rj in r])\n        # M-step\n\
    \        Nk = [sum(resp[i][j] for i in range(n)) for j in range(k)]\n        mus    = [sum(resp[i][j]\
    \ * data[i] for i in range(n)) /\n                  max(Nk[j], 1e-300) for j in range(k)]\n      \
    \  sigmas = [math.sqrt(sum(resp[i][j] * (data[i] - mus[j])**2\n                               for\
    \ i in range(n)) / max(Nk[j], 1e-300)) + 1e-6\n                  for j in range(k)]\n        pis \
    \   = [Nk[j] / n for j in range(k)]\n        # Log-likelihood\n        log_lik = sum(math.log(max(sum(pis[j]\
    \ * gauss1d(x, mus[j], sigmas[j])\n                                       for j in range(k)), 1e-300))\n\
    \                      for x in data)\n        if abs(log_lik - prev_log) < tol:\n            break\n\
    \        prev_log = log_lik\n    return mus, sigmas, pis\n\n\ndef bootstrap(data: list, statistic,\
    \ n_boot: int = 1000,\n              ci: float = 0.95) -> tuple:\n    \"\"\"\n    TIER_B #19 (probabilistic):\
    \ Bootstrap — estimação de intervalo de confiança.\n    statistic: callable(sample: list) → float\
    \ (ex: mean, median, std).\n    Retorna: (estimativa_ponto, ci_lower, ci_upper).\n    FMEA_GUARD:\
    \ len(data) > 0; n_boot > 0; 0 < ci < 1.\n    Complexidade: O(n_boot · n).\n    \"\"\"\n    assert\
    \ len(data) > 0,    \"BOOT_GUARD: data não pode ser vazio\"\n    assert n_boot > 0,       \"BOOT_GUARD:\
    \ n_boot deve ser > 0\"\n    assert 0 < ci < 1,       \"BOOT_GUARD: ci deve estar em (0,1)\"\n   \
    \ n        = len(data)\n    point_est= statistic(data)\n    boot_stats = []\n    for _ in range(n_boot):\n\
    \        sample = [data[random.randint(0, n-1)] for _ in range(n)]\n        boot_stats.append(statistic(sample))\n\
    \    boot_stats.sort()\n    alpha   = (1 - ci) / 2\n    lo_idx  = max(0, int(alpha * n_boot))\n  \
    \  hi_idx  = min(n_boot - 1, int((1 - alpha) * n_boot))\n    return point_est, boot_stats[lo_idx],\
    \ boot_stats[hi_idx]\n\n\ndef hmm_viterbi(obs: list, states: list, start_prob: dict,\n           \
    \     trans_prob: dict, emit_prob: dict) -> list:\n    \"\"\"\n    TIER_B #20 (probabilistic): Viterbi\
    \ Algorithm — sequência de estados mais provável.\n    obs: lista de observações.\n    states: lista\
    \ de estados ocultos.\n    start_prob: {estado: P(estado_inicial)}.\n    trans_prob: {estado: {estado:\
    \ P(transição)}}.\n    emit_prob:  {estado: {obs: P(emissão)}}.\n    Retorna: lista de estados mais\
    \ prováveis (Viterbi path).\n    FMEA_GUARD: obs não vazio; states não vazio.\n    Complexidade: O(T\
    \ · |S|²).\n    \"\"\"\n    assert len(obs) > 0,    \"VITERBI_GUARD: obs não pode ser vazio\"\n  \
    \  assert len(states) > 0, \"VITERBI_GUARD: states não pode ser vazio\"\n    T   = len(obs)\n    S\
    \   = states\n    eps = 1e-300\n    # Inicialização\n    viterbi = [{s: math.log(start_prob.get(s,\
    \ eps) *\n                             emit_prob.get(s, {}).get(obs[0], eps))\n                for\
    \ s in S}]\n    backptr = [{s: None for s in S}]\n    # Recursão\n    for t in range(1, T):\n    \
    \    v_prev = viterbi[t-1]\n        v_curr = {}\n        b_curr = {}\n        for s in S:\n      \
    \      probs = {s_prev: v_prev[s_prev] +\n                     math.log(trans_prob.get(s_prev, {}).get(s,\
    \ eps)) +\n                     math.log(emit_prob.get(s, {}).get(obs[t], eps))\n                \
    \     for s_prev in S}\n            best = max(probs, key=probs.get)\n            v_curr[s] = probs[best]\n\
    \            b_curr[s] = best\n        viterbi.append(v_curr)\n        backptr.append(b_curr)\n  \
    \  # Traceback\n    path = [max(viterbi[-1], key=viterbi[-1].get)]\n    for t in range(T - 1, 0, -1):\n\
    \        path.append(backptr[t][path[-1]])\n    return path[::-1]\n\n\n# ─────────────────────────────────────────────────────────────────\n\
    # FAMÍLIA: NUMERICAL (5 algoritmos) — B21..B25\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef euler_forward(f, t0: float, y0: float, h: float, steps: int) -> list:\n    \"\"\"\n    TIER_B\
    \ #21 (numerical): Euler Forward — integrador ODE de 1ª ordem.\n    f: dy/dt = f(t, y).\n    Retorna:\
    \ [(t, y), ...].\n    FMEA_GUARD: h > 0; steps > 0. (menos preciso que RK4 — use para comparação)\n\
    \    Complexidade: O(steps).\n    \"\"\"\n    assert h > 0,     \"EULER_GUARD: h deve ser > 0\"\n\
    \    assert steps > 0, \"EULER_GUARD: steps deve ser > 0\"\n    t, y  = t0, y0\n    traj  = [(t, y)]\n\
    \    for _ in range(steps):\n        y = y + h * f(t, y)\n        t = t + h\n        traj.append((t,\
    \ y))\n    return traj\n\n\ndef crank_nicolson(f_linear, t0: float, y0: float, h: float,\n       \
    \            steps: int, a: float) -> list:\n    \"\"\"\n    TIER_B #22 (numerical): Crank-Nicolson\
    \ — integrador implícito-explícito.\n    Para EDO linear: dy/dt = a*y + f(t).\n    f_linear: callable(t)\
    \ → termo fonte (parte não-linear, se houver).\n    a: coeficiente do termo linear (para estabilidade).\n\
    \    Retorna: [(t, y), ...].\n    FMEA_GUARD: h > 0; steps > 0; denominador não nulo.\n    Complexidade:\
    \ O(steps).\n    \"\"\"\n    assert h > 0,     \"CN_GUARD: h deve ser > 0\"\n    assert steps > 0,\
    \ \"CN_GUARD: steps deve ser > 0\"\n    denom = 1 - h/2 * a\n    assert abs(denom) > 1e-12, \\\n \
    \       f\"CN_GUARD: denominador quase nulo={denom}, escolha h ou a diferentes\"\n    t, y = t0, y0\n\
    \    traj = [(t, y)]\n    for _ in range(steps):\n        f_curr = f_linear(t)\n        f_next = f_linear(t\
    \ + h)\n        y = ((1 + h/2 * a) * y + h/2 * (f_curr + f_next)) / denom\n        t = t + h\n   \
    \     traj.append((t, y))\n    return traj\n\n\ndef adams_bashforth(f, t0: float, y0: float, h: float,\
    \ steps: int) -> list:\n    \"\"\"\n    TIER_B #23 (numerical): Adams-Bashforth 2 passos — integrador\
    \ multistep explícito.\n    f: dy/dt = f(t, y).\n    Usa Euler para o primeiro passo de bootstrap.\n\
    \    Retorna: [(t, y), ...].\n    FMEA_GUARD: h > 0; steps > 0.\n    Complexidade: O(steps).\n   \
    \ \"\"\"\n    assert h > 0,     \"AB_GUARD: h deve ser > 0\"\n    assert steps > 0, \"AB_GUARD: steps\
    \ deve ser > 0\"\n    t, y = t0, y0\n    traj = [(t, y)]\n    # Bootstrap com Euler\n    f0 = f(t,\
    \ y)\n    y1 = y + h * f0\n    t1 = t + h\n    traj.append((t1, y1))\n    for i in range(1, steps):\n\
    \        f_prev = f(traj[i-1][0], traj[i-1][1])\n        f_curr = f(traj[i][0], traj[i][1])\n    \
    \    y_new  = traj[i][1] + h * (3/2 * f_curr - 1/2 * f_prev)\n        t_new  = traj[i][0] + h\n  \
    \      traj.append((t_new, y_new))\n    return traj\n\n\ndef dormand_prince_rk45(f, t0: float, y0:\
    \ float, t_end: float,\n                         tol: float = 1e-6, h_init: float = 0.1,\n       \
    \                  h_min: float = 1e-8) -> list:\n    \"\"\"\n    TIER_B #24 (numerical): Dormand-Prince\
    \ RK45 — integrador adaptativo (passo variável).\n    f: dy/dt = f(t, y).\n    Retorna: [(t, y), ...]\
    \ com passo adaptativo.\n    FMEA_GUARD: t_end > t0; tol > 0; h_init > 0; h_min > 0.\n    Complexidade:\
    \ O(steps · 6 avaliações de f).\n    \"\"\"\n    assert t_end > t0,  \"RK45_GUARD: t_end deve ser\
    \ > t0\"\n    assert tol > 0,     \"RK45_GUARD: tol deve ser > 0\"\n    assert h_init > 0,  \"RK45_GUARD:\
    \ h_init deve ser > 0\"\n    assert h_min > 0,   \"RK45_GUARD: h_min deve ser > 0\"\n    # Coeficientes\
    \ Dormand-Prince\n    a21=0.2; a31=3/40; a32=9/40\n    a41=44/45; a42=-56/15; a43=32/9\n    a51=19372/6561;\
    \ a52=-25360/2187; a53=64448/6561; a54=-212/729\n    a61=9017/3168; a62=-355/33; a63=46732/5247; a64=49/176;\
    \ a65=-5103/18656\n    # Pesos ordem 5\n    b1=35/384; b3=500/1113; b4=125/192; b5=-2187/6784; b6=11/84\n\
    \    # Pesos ordem 4 (para estimativa de erro)\n    e1=71/57600; e3=-71/16695; e4=71/1920; e5=-17253/339200;\
    \ e6=22/525; e7=-1/40\n    t, y, h = t0, y0, h_init\n    traj = [(t, y)]\n    while t < t_end:\n \
    \       h = min(h, t_end - t)\n        k1 = f(t, y)\n        k2 = f(t+0.2*h,      y+h*a21*k1)\n  \
    \      k3 = f(t+0.3*h,      y+h*(a31*k1+a32*k2))\n        k4 = f(t+0.8*h,      y+h*(a41*k1+a42*k2+a43*k3))\n\
    \        k5 = f(t+8/9*h,      y+h*(a51*k1+a52*k2+a53*k3+a54*k4))\n        k6 = f(t+h,          y+h*(a61*k1+a62*k2+a63*k3+a64*k4+a65*k5))\n\
    \        y5 = y + h*(b1*k1+b3*k3+b4*k4+b5*k5+b6*k6)\n        k7 = f(t+h, y5)\n        err = abs(h*(e1*k1+e3*k3+e4*k4+e5*k5+e6*k6+e7*k7))\n\
    \        if err < tol or h <= h_min:\n            t = t + h\n            y = y5\n            traj.append((t,\
    \ y))\n            if err > 0:\n                h = min(h * min(5.0, 0.9*(tol/err)**0.2), 1.0)\n \
    \       else:\n            h = max(h * max(0.1, 0.9*(tol/err)**0.2), h_min)\n    return traj\n\n\n\
    def bisection(f, a: float, b: float, tol: float = 1e-8,\n              max_iter: int = 200) -> float:\n\
    \    \"\"\"\n    TIER_B #25 (numerical): Bisection — busca de raiz por bissecção.\n    f: callable(x)\
    \ → float. Requer f(a)*f(b) < 0.\n    Retorna: x tal que |f(x)| < tol.\n    FMEA_GUARD: f(a)*f(b)\
    \ < 0 (sinais opostos); a < b; tol > 0.\n    Complexidade: O(log((b-a)/tol)).\n    \"\"\"\n    assert\
    \ a < b,           \"BIS_GUARD: a deve ser < b\"\n    assert tol > 0,         \"BIS_GUARD: tol deve\
    \ ser > 0\"\n    fa, fb = f(a), f(b)\n    assert fa * fb < 0,     f\"BIS_GUARD: f(a)={fa:.4g} e f(b)={fb:.4g}\
    \ devem ter sinais opostos\"\n    for _ in range(max_iter):\n        mid = (a + b) / 2.0\n       \
    \ fm  = f(mid)\n        if abs(fm) < tol or (b - a) / 2 < tol:\n            return mid\n        if\
    \ fa * fm < 0:\n            b, fb = mid, fm\n        else:\n            a, fa = mid, fm\n    return\
    \ (a + b) / 2.0\n\n\n# ─────────────────────────────────────────────────────────────────\n# FAMÍLIA:\
    \ COMBINATORICS (4 algoritmos) — B26..B29\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef hungarian(cost_matrix: list) -> tuple:\n    \"\"\"\n    TIER_B #26 (combinatorics): Hungarian\
    \ Algorithm — atribuição ótima (custo mínimo).\n    cost_matrix: lista de listas n×n de custos não-negativos.\n\
    \    Retorna: (custo_total, atribuição) onde atribuição[i] = j (trabalhador i → tarefa j).\n    Implementação:\
    \ método de redução de linhas/colunas + cobertura.\n    FMEA_GUARD: matriz quadrada; todos os custos\
    \ >= 0.\n    Complexidade: O(n³).\n    \"\"\"\n    import copy\n    n = len(cost_matrix)\n    assert\
    \ n > 0,          \"HUN_GUARD: cost_matrix não pode ser vazio\"\n    assert all(len(r)==n for r in\
    \ cost_matrix), \\\n        \"HUN_GUARD: cost_matrix deve ser quadrada\"\n    assert all(cost_matrix[i][j]\
    \ >= 0 for i in range(n) for j in range(n)), \\\n        \"HUN_GUARD: todos os custos devem ser >=\
    \ 0\"\n    C = [row[:] for row in cost_matrix]\n    # Redução de linhas\n    for i in range(n):\n\
    \        mn = min(C[i])\n        C[i] = [v - mn for v in C[i]]\n    # Redução de colunas\n    for\
    \ j in range(n):\n        mn = min(C[i][j] for i in range(n))\n        for i in range(n):\n      \
    \      C[i][j] -= mn\n    # Iteração de atribuição via cobertura mínima\n    for _ in range(n):\n\
    \        # Greedy matching\n        assignment = [-1] * n\n        taken_j    = [False] * n\n    \
    \    for i in range(n):\n            for j in range(n):\n                if C[i][j] == 0 and not taken_j[j]\
    \ and assignment[i] == -1:\n                    assignment[i] = j\n                    taken_j[j]\
    \    = True\n        if all(a != -1 for a in assignment):\n            break\n        # Linhas não\
    \ cobertas e colunas cobertas\n        covered_rows = [assignment[i] != -1 for i in range(n)]\n  \
    \      covered_cols = [False] * n\n        for i in range(n):\n            if assignment[i] != -1:\n\
    \                covered_cols[assignment[i]] = True\n        # Mínimo não coberto\n        min_val\
    \ = min(C[i][j] for i in range(n) for j in range(n)\n                      if not covered_rows[i]\
    \ and not covered_cols[j])\n        # Ajuste da matriz\n        for i in range(n):\n            for\
    \ j in range(n):\n                if not covered_rows[i] and not covered_cols[j]:\n              \
    \      C[i][j] -= min_val\n                elif covered_rows[i] and covered_cols[j]:\n           \
    \         C[i][j] += min_val\n    total_cost = sum(cost_matrix[i][assignment[i]] for i in range(n)\n\
    \                     if assignment[i] != -1)\n    return total_cost, assignment\n\n\ndef held_karp_tsp(dist:\
    \ list) -> tuple:\n    \"\"\"\n    TIER_B #27 (combinatorics): Held-Karp — TSP exato via programação\
    \ dinâmica.\n    dist: matriz n×n de distâncias. dist[i][j] = custo i→j.\n    Retorna: (custo_mínimo,\
    \ caminho_ótimo).\n    DIFF_TSP_GUARD: n reduzido de 20 para 15.\n      n=20: dp[2^20][20] ≈ 160MB\
    \ de floats + overhead Python → MemoryError potencial.\n      n=15: dp[2^15][15] ≈ 4MB → seguro em\
    \ qualquer ambiente.\n      Para n>15: usar heurística (simulated_annealing, particle_swarm) via MSE.\n\
    \    FMEA_GUARD: n > 1; n ≤ 15; matriz quadrada.\n    Complexidade: O(2ⁿ · n²) — use n ≤ 15.\n   \
    \ \"\"\"\n    n = len(dist)\n    assert n > 1,             \"TSP_GUARD: n deve ser > 1\"\n    assert\
    \ all(len(r)==n for r in dist), \"TSP_GUARD: dist deve ser quadrada\"\n    assert n <= 15, (\n   \
    \     f\"TSP_GUARD: Held-Karp exato limitado a n<=15 (n={n} causaria ~{(2**n)*n*8//1024**2}MB). \"\
    \n        \"Para n>15 use heurística: simulated_annealing() ou particle_swarm() via ModelSelectionEngine.\"\
    \n    )\n    INF = float('inf')\n    # dp[S][i] = custo mínimo de visitar conjunto S terminando em\
    \ i\n    dp    = [[INF] * n for _ in range(1 << n)]\n    parent= [[-1] * n for _ in range(1 << n)]\n\
    \    dp[1][0] = 0  # começa no nó 0\n    for S in range(1, 1 << n):\n        if not (S & 1):  # deve\
    \ incluir nó 0\n            continue\n        for u in range(n):\n            if not (S & (1 << u))\
    \ or dp[S][u] == INF:\n                continue\n            for v in range(n):\n                if\
    \ S & (1 << v):\n                    continue\n                ns = S | (1 << v)\n               \
    \ new_cost = dp[S][u] + dist[u][v]\n                if new_cost < dp[ns][v]:\n                   \
    \ dp[ns][v]    = new_cost\n                    parent[ns][v]= u\n    full = (1 << n) - 1\n    # Retornar\
    \ ao início\n    best_cost = INF\n    last = -1\n    for u in range(1, n):\n        if dp[full][u]\
    \ + dist[u][0] < best_cost:\n            best_cost = dp[full][u] + dist[u][0]\n            last =\
    \ u\n    # Reconstruir caminho\n    path = []\n    S, u = full, last\n    while u != -1:\n       \
    \ path.append(u)\n        prev = parent[S][u]\n        S = S ^ (1 << u)\n        u = prev\n    path.reverse()\n\
    \    return best_cost, path + [0]\n\n\ndef edmonds_karp(graph: dict, source: Any, sink: Any) -> int:\n\
    \    \"\"\"\n    TIER_B #28 (combinatorics/graph): Edmonds-Karp — fluxo máximo (BFS augmenting path).\n\
    \    graph: {node: {neighbor: capacity, ...}, ...}\n    Retorna: valor do fluxo máximo (inteiro ou\
    \ float).\n    FMEA_GUARD: source e sink existem no grafo; source != sink.\n    Complexidade: O(V\
    \ · E²).\n    \"\"\"\n    assert source in graph,  f\"EK_GUARD: source '{source}' não no grafo\"\n\
    \    assert sink in graph,    f\"EK_GUARD: sink '{sink}' não no grafo\"\n    assert source != sink,\
    \    \"EK_GUARD: source e sink devem ser distintos\"\n    # Grafo residual (cópia mutável)\n    import\
    \ copy\n    res = {u: dict(nbrs) for u, nbrs in graph.items()}\n    for u in list(res.keys()):\n \
    \       for v in list(res[u].keys()):\n            if v not in res:\n                res[v] = {}\n\
    \            if u not in res[v]:\n                res[v][u] = 0\n    max_flow = 0\n    while True:\n\
    \        # BFS para encontrar caminho aumentante\n        parent = {source: None}\n        queue \
    \ = [source]\n        while queue and sink not in parent:\n            u = queue.popleft()  # OPP-56:\
    \ deque already used; pop(0)→popleft() for clarity\n            for v, cap in res.get(u, {}).items():\n\
    \                if v not in parent and cap > 0:\n                    parent[v] = u\n            \
    \        queue.append(v)\n        if sink not in parent:\n            break  # sem caminho aumentante\n\
    \        # Gargalo\n        path_flow = float('inf')\n        v = sink\n        while v != source:\n\
    \            u = parent[v]\n            path_flow = min(path_flow, res[u][v])\n            v = u\n\
    \        # Atualiza fluxo residual\n        v = sink\n        while v != source:\n            u =\
    \ parent[v]\n            res[u][v] -= path_flow\n            res[v][u] += path_flow\n            v\
    \ = u\n        max_flow += path_flow\n    return max_flow\n\n\ndef branch_and_bound(cost_func, bound_func,\
    \ initial_state: Any,\n                     expand_func, is_goal, max_nodes: int = 10000) -> tuple:\n\
    \    \"\"\"\n    TIER_B #29 (combinatorics): Branch and Bound — otimização combinatória exata.\n \
    \   cost_func: callable(state) → custo atual.\n    bound_func: callable(state) → lower bound do subproblema.\n\
    \    expand_func: callable(state) → lista de estados filhos.\n    is_goal: callable(state) → bool.\n\
    \    Retorna: (melhor_estado, melhor_custo) ou (None, inf) se nenhum encontrado.\n    FMEA_GUARD:\
    \ max_nodes > 0.\n    Complexidade: exponencial no pior caso; poda por bound.\n    \"\"\"\n    assert\
    \ max_nodes > 0, \"BNB_GUARD: max_nodes deve ser > 0\"\n    best_cost  = float('inf')\n    best_state\
    \ = None\n    # Fila de prioridade: (lower_bound, id_unico, estado)\n    pq    = [(bound_func(initial_state),\
    \ 0, initial_state)]\n    uid   = 1\n    nodes = 0\n    while pq and nodes < max_nodes:\n        lb,\
    \ _, state = heapq.heappop(pq)\n        nodes += 1\n        if lb >= best_cost:\n            continue\
    \  # poda\n        if is_goal(state):\n            c = cost_func(state)\n            if c < best_cost:\n\
    \                best_cost, best_state = c, state\n            continue\n        for child in expand_func(state):\n\
    \            child_lb = bound_func(child)\n            if child_lb < best_cost:\n                heapq.heappush(pq,\
    \ (child_lb, uid, child))\n                uid += 1\n    return best_state, best_cost\n\n\n# ─────────────────────────────────────────────────────────────────\n\
    # FAMÍLIA: CONTROL (4 algoritmos) — B30..B33\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef pid_controller(setpoints: list, process_func,\n                   Kp: float = 1.0, Ki: float\
    \ = 0.1, Kd: float = 0.05,\n                   dt: float = 0.1) -> list:\n    \"\"\"\n    TIER_B #30\
    \ (control): PID Controller — controlador Proporcional-Integral-Derivativo.\n    setpoints: lista\
    \ de valores de referência ao longo do tempo.\n    process_func: callable(output, dt) → novo valor\
    \ do processo.\n    Retorna: [(t, setpoint, process_val, control_signal), ...].\n    FMEA_GUARD: len(setpoints)\
    \ > 0; dt > 0.\n    Complexidade: O(n).\n    \"\"\"\n    assert len(setpoints) > 0, \"PID_GUARD: setpoints\
    \ não pode ser vazio\"\n    assert dt > 0,             \"PID_GUARD: dt deve ser > 0\"\n    integral\
    \   = 0.0\n    prev_error = 0.0\n    process    = setpoints[0]\n    history    = []\n    for i, sp\
    \ in enumerate(setpoints):\n        error     = sp - process\n        integral += error * dt\n   \
    \     derivative= (error - prev_error) / dt\n        control   = Kp * error + Ki * integral + Kd *\
    \ derivative\n        process   = process_func(control, dt)\n        history.append((i * dt, sp, process,\
    \ control))\n        prev_error = error\n    return history\n\n\ndef lqr(A: list, B: list, Q: list,\
    \ R_mat: list,\n        x0: list, steps: int = 50) -> tuple:\n    \"\"\"\n    TIER_B #31 (control):\
    \ LQR — Linear Quadratic Regulator.\n    DIFF_LQR_DARE (BUG-04 + BUG-04b, OPP-17):\n      BUG-04:\
    \  DARE incompleta — P = Q + A'PA omitia o termo de controle\n               → P divergia para 7.3×10¹⁷.\
    \ DARE correta:\n               P = Q + A'PA − A'PB(R + B'PB)⁻¹B'PA\n      BUG-04b: m>1 — indexação\
    \ c2//n e c2%n gerava lista de 1 elemento\n               em vez de matriz n×n → matadd() falhava\
    \ com dimensões erradas.\n    Path 1: scipy.linalg.solve_discrete_are (exato, preferido).\n    Path\
    \ 2: Python puro com DARE iterativa CORRETA (fallback G10).\n    Sistema: x_{t+1} = A*x_t + B*u_t.\
    \ Minimiza: Σ (x'Qx + u'Ru).\n    FMEA_GUARD: dimensões consistentes; steps > 0; R não singular.\n\
    \    Complexidade: O(steps·n³).\n    \"\"\"\n    assert steps > 0, \"LQR_GUARD: steps deve ser > 0\"\
    \n    n = len(x0)\n    m = len(B[0]) if isinstance(B[0], list) else 1\n    assert len(A) == n and\
    \ all(len(r)==n for r in A), \\\n        \"LQR_GUARD: A deve ser quadrada n×n\"\n    assert len(B)\
    \ == n, \"LQR_GUARD: B deve ter n linhas\"\n    assert len(Q) == n and all(len(r)==n for r in Q),\
    \ \\\n        \"LQR_GUARD: Q deve ser quadrada n×n\"\n    if isinstance(R_mat[0], list):\n       \
    \ assert len(R_mat) == m and all(len(r)==m for r in R_mat), \\\n            \"LQR_GUARD: R deve ser\
    \ m×m\"\n    else:\n        assert len(R_mat) == m, \"LQR_GUARD: R deve ter m elementos\"\n\n    #\
    \ ── Path 1: scipy exact (preferred) ──────────────────────────────────\n    try:\n        from scipy.linalg\
    \ import solve_discrete_are\n        import numpy as np\n        A_np  = np.array(A,     dtype=float)\n\
    \        B_np  = np.array(B,     dtype=float)\n        Q_np  = np.array(Q,     dtype=float)\n    \
    \    R_np  = (np.array(R_mat, dtype=float)\n                 if isinstance(R_mat[0], list)\n     \
    \            else np.diag(np.array(R_mat, dtype=float)))\n        P     = solve_discrete_are(A_np,\
    \ B_np, Q_np, R_np)\n        RBtPB = R_np + B_np.T @ P @ B_np\n        K_np  = np.linalg.solve(RBtPB,\
    \ B_np.T @ P @ A_np)\n        xs = [list(x0)]; us = []; x = np.array(x0, dtype=float); cost = 0.0\n\
    \        for _ in range(steps):\n            u = -K_np @ x; us.append(list(u))\n            cost +=\
    \ float(x @ Q_np @ x) + float(u @ R_np @ u)\n            x = A_np @ x + B_np @ u; xs.append(list(x))\n\
    \        return xs, us, cost\n    except ImportError as _e:\n        print(f\"[LQR] scipy não disponível\
    \ ({_e}), usando Path 2: Python puro\")\n\n    # ── Path 2: Python puro — DARE iterativa CORRETA ─────────────────────\n\
    \    def matmul(X, Y):\n        if not isinstance(Y[0], list):\n            return [sum(X[i][j]*Y[j]\
    \ for j in range(len(Y))) for i in range(len(X))]\n        rX,cY,k = len(X),len(Y[0]),len(Y)\n   \
    \     return [[sum(X[i][p]*Y[p][j] for p in range(k)) for j in range(cY)]\n                for i in\
    \ range(rX)]\n    def transpose(M):\n        return [[M[j][i] for j in range(len(M))] for i in range(len(M[0]))]\n\
    \    def matadd(X,Y):\n        return [[X[i][j]+Y[i][j] for j in range(len(X[0]))] for i in range(len(X))]\n\
    \    def matsub(X,Y):\n        return [[X[i][j]-Y[i][j] for j in range(len(X[0]))] for i in range(len(X))]\n\
    \n    def mat_inv(S, sz):\n        \"\"\"Inversão genérica via Gauss-Jordan para qualquer sz.\"\"\"\
    \n        aug = [S[i][:] + [1.0 if i==j else 0.0 for j in range(sz)]\n               for i in range(sz)]\n\
    \        for col in range(sz):\n            piv = max(range(col,sz), key=lambda r: abs(aug[r][col]))\n\
    \            aug[col],aug[piv] = aug[piv],aug[col]\n            f = aug[col][col]\n            assert\
    \ abs(f) > 1e-14, \"LQR_GUARD: S singular\"\n            aug[col] = [v/f for v in aug[col]]\n    \
    \        for r in range(sz):\n                if r != col:\n                    fac = aug[r][col]\n\
    \                    aug[r] = [aug[r][c]-fac*aug[col][c] for c in range(2*sz)]\n        return [[aug[i][sz+j]\
    \ for j in range(sz)] for i in range(sz)]\n\n    R_list = ([[float(R_mat[i][j]) for j in range(m)]\
    \ for i in range(m)]\n              if isinstance(R_mat[0], list)\n              else [[float(R_mat[i])\
    \ if i==j else 0.0 for j in range(m)]\n                    for i in range(m)])\n\n    # Backward Riccati\
    \ — DARE CORRETA: P = Q + A'PA − A'PB(R+B'PB)⁻¹B'PA\n    P = [row[:] for row in Q]\n    AT = transpose(A);\
    \ BT = transpose(B)\n    for _ in range(steps):\n        BtP  = matmul(BT, P)       # m×n\n      \
    \  AtP  = matmul(AT, P)       # n×n\n        AtPA = matmul(AtP, A)      # n×n\n        BtPB = matmul(BtP,\
    \ B)      # m×m\n        S    = matadd(R_list, BtPB) # R + B'PB\n        Sinv = mat_inv(S, m)\n  \
    \      # K = (R+B'PB)^{-1} B'PA  (m×n)\n        BtPA = matmul(BT, matmul(P, A))\n        K    = matmul(Sinv,\
    \ BtPA)\n        # Termo corretivo: A'PBK  (n×n)\n        AtPB  = matmul(AtP, B)\n        AtPBK =\
    \ matmul(AtPB, K)\n        # P_new = Q + A'PA - A'PBK\n        P = matsub(matadd(Q, AtPA), AtPBK)\n\
    \n    # Forward simulation\n    xs = [list(x0)]; us = []; x = list(x0); cost = 0.0\n    for _ in range(steps):\n\
    \        BtP  = matmul(BT, P); BtPB = matmul(BtP, B)\n        S    = matadd(R_list, BtPB); Sinv =\
    \ mat_inv(S, m)\n        BtPA = matmul(BT, matmul(P, A)); K = matmul(Sinv, BtPA)\n        u = [-sum(K[i][j]*x[j]\
    \ for j in range(n)) for i in range(m)]\n        us.append(u)\n        xQx = sum(Q[i][j]*x[i]*x[j]\
    \ for i in range(n) for j in range(n))\n        uRu = sum(R_list[i][j]*u[i]*u[j] for i in range(m)\
    \ for j in range(m))\n        cost += xQx + uRu\n        Ax = [sum(A[i][j]*x[j] for j in range(n))\
    \ for i in range(n)]\n        Bu = [sum(B[i][k2]*u[k2] for k2 in range(m)) for i in range(n)]\n  \
    \      x  = [Ax[i]+Bu[i] for i in range(n)]; xs.append(x[:])\n    return xs, us, cost\n\n\ndef value_iteration_mdp(states:\
    \ list, actions: list, transitions: dict,\n                         rewards: dict, gamma: float =\
    \ 0.9,\n                         tol: float = 1e-6, max_iter: int = 1000) -> tuple:\n    \"\"\"\n\
    \    TIER_B #32 (control): Value Iteration — resolução de MDP por programação dinâmica.\n    transitions:\
    \ {(state, action): [(prob, next_state), ...]}\n    rewards:     {(state, action): float}\n    Retorna:\
    \ (V, policy) onde V[s] = valor ótimo, policy[s] = ação ótima.\n    FMEA_GUARD: 0 < gamma < 1; states\
    \ e actions não vazios.\n    Complexidade: O(max_iter · |S| · |A| · max_branches).\n    \"\"\"\n \
    \   assert 0 < gamma < 1,      \"VI_GUARD: gamma deve estar em (0,1)\"\n    assert len(states) > 0,\
    \    \"VI_GUARD: states não pode ser vazio\"\n    assert len(actions) > 0,   \"VI_GUARD: actions não\
    \ pode ser vazio\"\n    V = {s: 0.0 for s in states}\n    for _ in range(max_iter):\n        delta\
    \ = 0.0\n        V_new = {}\n        for s in states:\n            q_vals = []\n            for a\
    \ in actions:\n                r   = rewards.get((s, a), 0.0)\n                exp = sum(p * V[ns]\
    \ for p, ns in\n                          transitions.get((s, a), [(1.0, s)]))\n                q_vals.append(r\
    \ + gamma * exp)\n            V_new[s] = max(q_vals) if q_vals else 0.0\n            delta = max(delta,\
    \ abs(V_new[s] - V[s]))\n        V = V_new\n        if delta < tol:\n            break\n    policy\
    \ = {}\n    for s in states:\n        best_a, best_q = None, float('-inf')\n        for a in actions:\n\
    \            r   = rewards.get((s, a), 0.0)\n            exp = sum(p * V[ns] for p, ns in\n      \
    \                transitions.get((s, a), [(1.0, s)]))\n            q   = r + gamma * exp\n       \
    \     if q > best_q:\n                best_q, best_a = q, a\n        policy[s] = best_a\n    return\
    \ V, policy\n\n\ndef kalman_smoother(measurements: list, A: float = 1.0, H: float = 1.0,\n       \
    \             Q: float = 1e-4, R: float = 1.0,\n                    x0: float = 0.0, P0: float = 1.0)\
    \ -> list:\n    \"\"\"\n    TIER_B #33 (control): Kalman Smoother (RTS Smoother) 1D.\n    Passa forward\
    \ (filtro de Kalman) + backward (suavização RTS).\n    Retorna: lista de estados suavizados.\n   \
    \ FMEA_GUARD: R > 0; len(measurements) > 0.\n    Complexidade: O(n).\n    \"\"\"\n    assert R > 0,\
    \                    \"KS_GUARD: R deve ser > 0\"\n    assert len(measurements) > 0,   \"KS_GUARD:\
    \ measurements não pode ser vazio\"\n    n = len(measurements)\n    # Forward pass (Kalman filter)\n\
    \    xs_f = []; Ps_f = []\n    x, P = x0, P0\n    for z in measurements:\n        x_pred = A * x\n\
    \        P_pred = A * P * A + Q\n        K      = P_pred * H / max(H * P_pred * H + R, 1e-15)\n  \
    \      x      = x_pred + K * (z - H * x_pred)\n        P      = (1 - K * H) * P_pred\n        xs_f.append(x)\n\
    \        Ps_f.append(P)\n    # Backward pass (RTS smoother)\n    xs_s = [xs_f[-1]]\n    Ps_s = [Ps_f[-1]]\n\
    \    for t in range(n - 2, -1, -1):\n        P_pred_next = A * Ps_f[t] * A + Q\n        G        \
    \   = Ps_f[t] * A / max(P_pred_next, 1e-15)\n        x_s         = xs_f[t] + G * (xs_s[-1] - A * xs_f[t])\n\
    \        P_s         = max(0.0, Ps_f[t] + G * G * (Ps_s[-1] - P_pred_next))  # FIX-I-N1: clamp >=\
    \ 0\n        xs_s.append(x_s)\n        Ps_s.append(P_s)\n    return xs_s[::-1]\n\n\n# ─────────────────────────────────────────────────────────────────\n\
    # FAMÍLIA: ML (5 algoritmos) — B34..B38\n# ─────────────────────────────────────────────────────────────────\n\
    \ndef kmeans(data: list, k: int, max_iter: int = 300,\n           tol: float = 1e-4) -> tuple:\n \
    \   \"\"\"\n    TIER_B #34 (ml): K-Means — clusterização por centroide.\n    data: lista de pontos\
    \ (listas de float).\n    Retorna: (centroids, labels) onde labels[i] = cluster do ponto i.\n    FMEA_GUARD:\
    \ k > 0; len(data) >= k; todos pontos mesma dimensão.\n    Complexidade: O(max_iter · k · n · dim).\n\
    \n    OPP-61 GAP-17: tol= aceito mas convergência verifica apenas label equality\n    (new_labels\
    \ == labels), não distância dos centroides. tol= não utilizado.\n    A verificação de label equality\
    \ é uma proxy válida de convergência para\n    k-means puro, mas não é sensível a variações sub-tol\
    \ nos centroides.\n    Melhoria futura: comparar deslocamento centroide com tol= para convergência\n\
    \    mais suave.\n    \"\"\"\n    assert k > 0,              \"KMEANS_GUARD: k deve ser > 0\"\n  \
    \  assert len(data) >= k,     f\"KMEANS_GUARD: n={len(data)} deve ser >= k={k}\"\n    dim = len(data[0])\n\
    \    assert all(len(p)==dim for p in data), \\\n        \"KMEANS_GUARD: todos os pontos devem ter\
    \ a mesma dimensão\"\n    # Inicialização: k pontos aleatórios distintos\n    centroids = random.sample(data,\
    \ k)\n    centroids = [list(c) for c in centroids]\n    labels    = [0] * len(data)\n    for _ in\
    \ range(max_iter):\n        # Atribuição\n        new_labels = []\n        for p in data:\n      \
    \      dists = [math.sqrt(sum((p[d]-c[d])**2 for d in range(dim)))\n                     for c in\
    \ centroids]\n            new_labels.append(dists.index(min(dists)))\n        # Verificar convergência\n\
    \        if new_labels == labels:\n            break\n        labels = new_labels\n        # Atualização\
    \ dos centroides\n        new_centroids = [[0.0]*dim for _ in range(k)]\n        counts        = [0]\
    \ * k\n        for i, p in enumerate(data):\n            cl = labels[i]\n            for d in range(dim):\n\
    \                new_centroids[cl][d] += p[d]\n            counts[cl] += 1\n        for cl in range(k):\n\
    \            if counts[cl] > 0:\n                centroids[cl] = [new_centroids[cl][d]/counts[cl]\n\
    \                                  for d in range(dim)]\n    return centroids, labels\n\n\ndef knn(train_data:\
    \ list, train_labels: list, query: list,\n        k: int = 3) -> Any:\n    \"\"\"\n    TIER_B #35\
    \ (ml): K-Nearest Neighbors — classificação por vizinhança.\n    train_data: lista de pontos de treino.\n\
    \    train_labels: rótulos correspondentes.\n    query: ponto de consulta.\n    Retorna: rótulo mais\
    \ frequente entre os k vizinhos mais próximos.\n    FMEA_GUARD: k > 0; len(train_data) >= k; dimensões\
    \ consistentes.\n    Complexidade: O(n · dim).\n    \"\"\"\n    assert k > 0,                    \
    \ \"KNN_GUARD: k deve ser > 0\"\n    assert len(train_data) >= k,       f\"KNN_GUARD: n={len(train_data)}\
    \ deve ser >= k={k}\"\n    assert len(train_data) == len(train_labels), \\\n        \"KNN_GUARD: train_data\
    \ e train_labels devem ter o mesmo tamanho\"\n    dim = len(query)\n    dists = [(math.sqrt(sum((query[d]-p[d])**2\
    \ for d in range(dim))), lbl)\n             for p, lbl in zip(train_data, train_labels)]\n    dists.sort(key=lambda\
    \ x: x[0])\n    neighbors = [lbl for _, lbl in dists[:k]]\n    # Voto majoritário\n    votes = {}\n\
    \    for lbl in neighbors:\n        votes[lbl] = votes.get(lbl, 0) + 1\n    return max(votes, key=votes.get)\n\
    \n\ndef decision_tree_cart(X: list, y: list,\n                       max_depth: int = 5, min_samples:\
    \ int = 2) -> dict:\n    \"\"\"\n    TIER_B #36 (ml): Decision Tree CART — árvore de classificação\
    \ por Gini.\n    X: lista de amostras (listas de float).\n    y: lista de rótulos (int/str).\n   \
    \ Retorna: dicionário representando a árvore.\n    FIX-I-R1: implementação iterativa via pilha explícita\
    \ — sem recursão nativa.\n    FMEA_GUARD: len(X) == len(y) > 0; max_depth > 0.\n    Complexidade:\
    \ O(n² · d) por nível.\n    \"\"\"\n    assert len(X) == len(y),   \"CART_GUARD: X e y devem ter o\
    \ mesmo tamanho\"\n    assert len(X) > 0,         \"CART_GUARD: X não pode ser vazio\"\n    assert\
    \ max_depth > 0,      \"CART_GUARD: max_depth deve ser > 0\"\n\n    def gini(labels):\n        if\
    \ not labels: return 0.0\n        n    = len(labels)\n        freq = {}\n        for l in labels:\n\
    \            freq[l] = freq.get(l, 0) + 1\n        return 1.0 - sum((c/n)**2 for c in freq.values())\n\
    \n    def majority(labels):\n        freq = {}\n        for l in labels:\n            freq[l] = freq.get(l,\
    \ 0) + 1\n        return max(freq, key=freq.get)\n\n    def best_split(Xs, ys):\n        n_feat =\
    \ len(Xs[0])\n        best_feat, best_thr, best_gain = -1, None, -1.0\n        parent_g = gini(ys)\n\
    \        for feat in range(n_feat):\n            vals = sorted(set(x[feat] for x in Xs))\n       \
    \     for i in range(len(vals) - 1):\n                thr    = (vals[i] + vals[i+1]) / 2\n       \
    \         ly     = [ys[j] for j in range(len(Xs)) if Xs[j][feat] <= thr]\n                ry     =\
    \ [ys[j] for j in range(len(Xs)) if Xs[j][feat] > thr]\n                if not ly or not ry: continue\n\
    \                gain = parent_g - (len(ly)/len(ys)*gini(ly) +\n                                 \
    \  len(ry)/len(ys)*gini(ry))\n                if gain > best_gain:\n                    best_gain,\
    \ best_feat, best_thr = gain, feat, thr\n        return best_feat, best_thr\n\n    # FIX-I-R1: pilha\
    \ explícita em vez de recursão\n    root = {}\n    stack = [(root, X, y, max_depth, \"root\")]\n \
    \   while stack:\n        node, Xs, ys, depth, side = stack.pop()\n        if depth == 0 or len(set(ys))\
    \ == 1 or len(ys) < min_samples:\n            node[\"leaf\"] = True; node[\"label\"] = majority(ys)\n\
    \            continue\n        feat, thr = best_split(Xs, ys)\n        if feat == -1:\n          \
    \  node[\"leaf\"] = True; node[\"label\"] = majority(ys)\n            continue\n        node[\"leaf\"\
    ] = False; node[\"feat\"] = feat; node[\"thr\"] = thr\n        node[\"left\"]  = {}; node[\"right\"\
    ] = {}\n        left_mask  = [Xs[j][feat] <= thr for j in range(len(Xs))]\n        Xl = [Xs[j] for\
    \ j,m in enumerate(left_mask) if m]\n        yl = [ys[j] for j,m in enumerate(left_mask) if m]\n \
    \       Xr = [Xs[j] for j,m in enumerate(left_mask) if not m]\n        yr = [ys[j] for j,m in enumerate(left_mask)\
    \ if not m]\n        stack.append((node[\"left\"],  Xl, yl, depth-1, \"left\"))\n        stack.append((node[\"\
    right\"], Xr, yr, depth-1, \"right\"))\n    return root\n\n\ndef pca(data: list, n_components: int\
    \ = 2) -> tuple:\n    \"\"\"\n    TIER_B #37 (ml): PCA — Análise de Componentes Principais (Python\
    \ puro).\n    Usa método de potência para eigenvectores (sem numpy).\n    data: lista de amostras\
    \ (listas de float).\n    Retorna: (componentes, dados_transformados, variâncias_explicadas).\n  \
    \  FMEA_GUARD: n_components <= dim; len(data) >= 2; todos mesma dimensão.\n    Complexidade: O(n_components\
    \ · n · dim²).\n    \"\"\"\n    assert n_components >= 1,       \"PCA_GUARD: n_components deve ser\
    \ >= 1\"\n    assert len(data) >= 2,          \"PCA_GUARD: data deve ter ao menos 2 amostras\"\n \
    \   n   = len(data)\n    dim = len(data[0])\n    assert all(len(p)==dim for p in data), \\\n     \
    \   \"PCA_GUARD: todas as amostras devem ter a mesma dimensão\"\n    assert n_components <= dim, \
    \    f\"PCA_GUARD: n_components={n_components} > dim={dim}\"\n    # Centralização\n    mean = [sum(data[i][d]\
    \ for i in range(n)) / n for d in range(dim)]\n    X    = [[data[i][d] - mean[d] for d in range(dim)]\
    \ for i in range(n)]\n    # Covariância (1/n)\n    cov  = [[sum(X[i][r]*X[i][c] for i in range(n))/n\n\
    \             for c in range(dim)] for r in range(dim)]\n    # Power iteration para os primeiros n_components\
    \ eigenvectors\n    components = []\n    variances  = []\n    cov_deflated = [row[:] for row in cov]\n\
    \    for _ in range(n_components):\n        v = [random.gauss(0,1) for _ in range(dim)]\n        for\
    \ _ in range(100):  # iterações de potência\n            v_new = [sum(cov_deflated[r][c]*v[c] for\
    \ c in range(dim))\n                     for r in range(dim)]\n            norm  = math.sqrt(sum(x**2\
    \ for x in v_new))\n            if norm < 1e-12: break\n            v     = [x/norm for x in v_new]\n\
    \        eigenval = sum(sum(cov_deflated[r][c]*v[c] for c in range(dim))*v[r]\n                  \
    \     for r in range(dim))\n        components.append(v)\n        variances.append(max(eigenval, 0.0))\n\
    \        # Deflação\n        for r in range(dim):\n            for c in range(dim):\n            \
    \    cov_deflated[r][c] -= eigenval * v[r] * v[c]\n    # Projeção\n    projected = [[sum(x[d]*components[k][d]\
    \ for d in range(dim))\n                  for k in range(n_components)]\n                 for x in\
    \ X]\n    return components, projected, variances\n\n\ndef logistic_regression(X: list, y: list, lr:\
    \ float = 0.1,\n                         steps: int = 500, tol: float = 1e-6) -> tuple:\n    \"\"\"\
    \n    TIER_B #38 (ml): Logistic Regression — classificação binária por gradiente.\n    X: lista de\
    \ amostras (listas de float). y: lista de {0, 1}.\n    Retorna: (weights, bias) para predict = sigmoid(w·x\
    \ + b).\n    FMEA_GUARD: len(X)==len(y); y ⊆ {0,1}; lr > 0; steps > 0.\n    Complexidade: O(steps\
    \ · n · dim).\n    \"\"\"\n    assert len(X) == len(y),        \"LR_GUARD: X e y devem ter o mesmo\
    \ tamanho\"\n    assert len(X) > 0,              \"LR_GUARD: X não pode ser vazio\"\n    assert all(yi\
    \ in (0, 1) for yi in y), \"LR_GUARD: y deve conter apenas 0 ou 1\"\n    assert lr > 0,          \
    \        \"LR_GUARD: lr deve ser > 0\"\n    assert steps > 0,               \"LR_GUARD: steps deve\
    \ ser > 0\"\n    n, dim = len(X), len(X[0])\n    assert all(len(xi)==dim for xi in X), \\\n      \
    \  \"LR_GUARD: todas as amostras devem ter a mesma dimensão\"\n    w = [0.0] * dim\n    b = 0.0\n\n\
    \    def sigmoid(z):\n        return 1.0 / (1.0 + math.exp(-max(-500, min(500, z))))\n\n    for _\
    \ in range(steps):\n        dw = [0.0] * dim\n        db = 0.0\n        for i in range(n):\n     \
    \       z    = sum(w[d]*X[i][d] for d in range(dim)) + b\n            pred = sigmoid(z)\n        \
    \    err  = pred - y[i]\n            for d in range(dim):\n                dw[d] += err * X[i][d]\n\
    \            db += err\n        # Atualização com clipping para estabilidade\n        w  = [w[d] -\
    \ lr * dw[d] / n for d in range(dim)]\n        b -= lr * db / n\n        if math.sqrt(sum(dw[d]**2\
    \ for d in range(dim)) + db**2) < tol * n:\n            break\n    return w, b\n\n# ── TIER_C: Índice\
    \ de 405 Algoritmos (sem código — apenas catálogo MSE) ──────\n\nALGORITHM_CATALOG_TIER_C = {\n  \
