    \ import não listado retorna erro imediatamente.\n        \"\"\"\n        import ast as _ast\n\n \
    \       ALLOWED_IMPORTS: frozenset = frozenset({\n            'math', 'json', 'sys', 'random', 'itertools',\n\
    \            'numpy', 'np', 'scipy', 'pandas',\n            'collections', 'functools', 'typing',\n\
    \            'dataclasses', 'datetime', 'time',\n        })\n        BLOCKED_PATTERNS = frozenset({\n\
