    # ── fim DIFF_CHAIN_001 + DIFF_AUDITCHAIN_AUTOPIN ──────────────────────────\n\n# ── DIFF_MERGE_REASON_001\
    \ — MergeReasonValidator ─────────────────────\n\nclass MergeReasonValidator:\n    \"\"\"\n    DIFF_MERGE_REASON_001:\
