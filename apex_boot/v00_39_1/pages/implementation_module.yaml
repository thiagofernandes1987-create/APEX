    \  e = self.predict(list(point))\n            if e is not None and e < best_e:\n                best_e,\
    \ best_p = e, list(point)\n        return best_p\n\n\nclass GeometryEstimator:\n    @staticmethod\n\
    \    def _lv_dynamics(x: float, y: float, a: float, b: float,\n                     d: float, g: float)\
    \ -> tuple:\n        \"\"\"\n        OPP-58 DIFF_F_LV_EXTRACT (GAP-11): helper LV extraído de inline\
