    \    if rc == -4: return \"PYTHON_NOT_FOUND\"\n        if rc == 0:  return \"OK\"\n        if rc !=\
    \ 0:\n            logic_errors = (\n                \"SyntaxError\", \"NameError\", \"TypeError\"\
    , \"KeyError\",\n                \"IndentationError\", \"AttributeError\", \"ValueError\",\n     \
    \           \"IndexError\", \"ZeroDivisionError\", \"ImportError\"\n            )\n            if\
    \ any(e in stderr for e in logic_errors):\n                return \"LOGIC_ERROR\"   # não retentar\n\
    \            return \"RUNTIME_ERROR\"\n        return \"UNKNOWN\"\n\n    def _subprocess(self, script,\
    \ state_json,\n                    max_retries: int = 3, base_delay: float = 1.0):\n        \"\"\"\
    \n        OPP-15 DIFF_RETRY_BACKOFF: retry com exponential backoff.\n        OPP-20 DIFF_SUBPROCESS_ERRCLASSIFY:\
    \ error_type no retorno.\n        OPP-29 DIFF_AST_GUARD: validação AST antes de executar.\n      \
    \  OPP-39 DIFF_SR09_ENV_CHECK: verificar python3 disponível antes de tentar.\n        Retenta em ConnectionResetError\
