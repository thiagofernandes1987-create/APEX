    \            - 1/11\n        ) < 1e-9,\n        \"global_p=1/11 após 1 OK\"\n    ))\n\n    # Teste\
    \ FIX-NEW1 simples\n    re = ReliabilityEstimator(ReliabilityConfig())\n    re.on_block_completed({'size':8,'status':'OK','epsilon':0.0})\n\
    \    t(\"FIX-NEW1: prior anti-collapse\", lambda: (\n        abs(re.global_p - 1/11) < 1e-9,\n   \
