    \  # script aprovado\n\n    @staticmethod\n    def _classify_error(rc: int, stderr: str) -> str:\n\
    \        \"\"\"\n        DIFF_SUBPROCESS_ERRCLASSIFY (OPP-20):\n        Classifica tipo de erro do\
    \ subprocess para diagnóstico preciso.\n        Antes: rc=1 (SyntaxError, NameError, etc.) tratado\
    \ identicamente\n               a outros erros → diagnóstico opaco.\n        Depois: erros de lógica\
