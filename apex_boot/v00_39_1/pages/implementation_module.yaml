    \n    ))\n\n    # CouplingAnalyzer\n    r1 = CouplingAnalyzer.analyze(\"integral polinômio\")\n  \
    \  r2 = CouplingAnalyzer.analyze(\"navier stokes turbulência\")\n    t(\"DIFF_v22_006: coupling_analyzer\"\
    , lambda: (\n        r1[\"safe_to_decompose\"] and not r2[\"safe_to_decompose\"],\n        f\"poly={r1['coupling_score']:.2f}\
    \ NS={r2['coupling_score']:.2f}\"\n    ))\n\n    # TIER_A: Dijkstra\n    dist = dijkstra({'A':[('B',1),('C',4)],'B':[('C',2)],'C':[]},\
    \ 'A')\n    t(\"DIFF_v22_003: dijkstra TIER_A\", lambda: (\n        dist == {'A':0,'B':1,'C':3}, f\"\
    dist={dist}\"\n    ))\n\n    # TIER_A: RK4\n    rk4_r = rk4(lambda t,y: -y, 0.0, 1.0, 0.1, 5)\n  \
    \  t(\"DIFF_v22_003: rk4 TIER_A\", lambda: (\n        abs(rk4_r[-1][1] - math.exp(-0.5)) < 0.001,\n\
    \        f\"y(0.5)={rk4_r[-1][1]:.6f}\"\n    ))\n\n    # ChaosOperators\n    hyp = {'method':'euler','confidence':72}\n\
    \    step = ChaosOperators.levy_step()\n    mutated = ChaosOperators.structural_mutation(hyp)\n  \
