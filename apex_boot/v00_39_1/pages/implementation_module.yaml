    \        for name, spec in candidates:\n            conditions = spec[\"conditions\"]\n          \
    \  match = all(\n                features.get(k) == v\n                for k, v in conditions.items()\n\
    \                if k != \"type\"\n            )\n            if match:\n                return {\n\
    \                    \"name\": name, \"tier\": spec[\"tier\"],\n                    \"func\": spec.get(\"\
    func\"),\n                    \"conditions\": conditions,\n                }\n        # Fallback:\
    \ retornar candidato de tipo sem verificar condições extras\n        if candidates:\n            name,\
    \ spec = candidates[0]\n            return {\"name\": name, \"tier\": spec[\"tier\"],\n          \
    \          \"func\": spec.get(\"func\"), \"conditions\": spec[\"conditions\"]}\n        # Consultar\
    \ TIER_C — SR_13: sem código\n        for alg_name, alg_spec in ALGORITHM_CATALOG_TIER_C.items():\n\
    \            if alg_spec.get(\"family\") == p_type:\n                return {\n                  \
