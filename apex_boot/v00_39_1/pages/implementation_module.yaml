    \       held_karp_tsp — guard n<=20 → n<=15 (n=20 = 160MB, risco MemoryError)\n                  \
    \      Mensagem informativa sugere heurística para n>15\n  DIFF_SNAP_VERSION:    SnapshotStore — SCHEMA_VERSION=\"\
    v00.24.2\" + REQUIRED_FIELDS por snap_type\n                        + migrate_snapshot(payload, from_version)\
    \ para backward compatibility\n  DIFF_SNAP_PIN:        SnapshotStore — pin()/unpin()/pin_many() para\
