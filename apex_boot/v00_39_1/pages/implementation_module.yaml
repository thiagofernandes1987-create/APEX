    \ warmup_traj,\n                            params, integrator, dt, thr, prefix=\"prod\"):\n     \
    \   geo = GeometryEstimator()\n        state_map = {p['n']: (p['x'],p['y']) for p in warmup_traj}\n\
    \        blocks=[]; k=0; s=n_start\n        while s < n_total:\n            x_e,y_e = (state_map[s]\
    \ if s in state_map\n                       else ((warmup_traj[-1]['x'],warmup_traj[-1]['y'])\n  \
