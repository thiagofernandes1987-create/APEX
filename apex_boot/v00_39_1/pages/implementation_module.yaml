    \   return (a*x - b*x*y, d*x*y - g*y)\n\n    @staticmethod\n    def _theoretical_M_local(x, y, params,\
    \ eps=1e-3):\n        \"\"\"[NÃO USAR EM PRODUÇÃO para Lotka-Volterra]\"\"\"\n        a=params['alpha'];\
