    \        fxy=[(_f_lv(x+eps,y+eps)[i]-_f_lv(x+eps,y-eps)[i]\n             -_f_lv(x-eps,y+eps)[i]+_f_lv(x-eps,y-eps)[i])/(4*eps**2)\
    \ for i in range(2)]\n        return max(math.sqrt(sum(v**2 for v in fxx+fyy+fxy)), 1e-10)\n\n   \
    \ @classmethod\n    def delta_err(cls, x, y, params, integrator, dt):\n        a=params['alpha'];\
    \ b=params['beta']\n        d=params['delta']; g=params['gamma']\n        def rk4_step(x,y,h):\n \
    \           # OPP-58: usa _lv_dynamics (helper extraído) em vez de _f_lv inline\n            k1x,k1y=cls._lv_dynamics(x,y,a,b,d,g)\n\
    \            k2x,k2y=cls._lv_dynamics(x+h/2*k1x,y+h/2*k1y,a,b,d,g)\n            k3x,k3y=cls._lv_dynamics(x+h/2*k2x,y+h/2*k2y,a,b,d,g)\n\
