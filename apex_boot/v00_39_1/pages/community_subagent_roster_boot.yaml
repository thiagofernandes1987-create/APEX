community_subagent_roster_boot:
executor: DOCUMENTATION  # backfilled by lint_executor (SR_40)
  executor: LLM_BEHAVIOR
  version: v00.37.0
  opp: OPP-155
  tier: 2
  status: ADOPTED
  purpose: 'Registrar 140 community subagents (OPP-153) no kernel do boot com mapeamento completo de activates_when
    por domínio. Substitui referência pendente OPP-140. Cada subagent é ativado automaticamente pelo meta_reasoning
    quando o domínio da requisição bate com activates_when[].

    '
  why: 'WHY: OPP-153 criou community_agent_roster.yaml com 140 subagents, mas o boot kernel (apex_v00_37_0_master_full.txt)
    continuava sem os blocos DIFF correspondentes. Sem integração ao kernel, os subagents existem no disco
    mas são invisíveis ao pipeline de ativação do meta_reasoning durante o boot.

    '
  when: 'WHEN: meta_reasoning.STEP_1 detecta domínio com match em activates_when[]. WHEN: Nenhum agente
    base (engineer, architect, etc.) tem expertise primária no domínio. WHEN: Usuário solicita explicitamente
    um subagente especializado.

    '
  what_if_fails: 'FALLBACK: meta_reasoning usa agente base engineer como fallback. REGRA: Subagents NUNCA
    bloqueiam o fluxo — são OPCIONAIS. REGRA: Máximo 2 community agents ativos por sessão (token budget).
    REGRA: Se community_agent_roster.yaml não carrega, usar OPP-116 legacy roster.

    '
  source_file: agents/community_agent_roster.yaml
  total_agents: 140
  categories: 10
  activation_gate: meta_reasoning verifica activates_when antes de ativar
  max_concurrent: 2
  fallback_agent: engineer
