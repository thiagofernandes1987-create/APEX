name: UCO Formal Benchmark v2

on:
  push:
    branches:
      - "uco-benchmark-v2-isolated-20260919"
  workflow_dispatch:
    inputs:
      target_repos:
        description: "Eligible file-level repositories"
        required: true
        default: "500"
        type: choice
        options: ["100", "500", "1000"]
      shard_size:
        description: "Events per runner shard"
        required: true
        default: "20"
        type: choice
        options: ["10", "20", "25"]

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[pilot-bench-v2-100]') ||
      contains(github.event.head_commit.message, '[formal-bench-v2-1000]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover fixed-N corpus
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pilot-bench-v2-100]') && '100' || github.event_name == 'push' && '1000' || inputs.target_repos || '500' }}
        run: |
          set -euo pipefail
          mkdir -p benchmark_manifest
          python algorithms/uco-sensor/paper/formal_benchmark/discover.py \
            --target-repos "$TARGET_REPOS" \
            --output benchmark_manifest/manifest.json
          if [ "$TARGET_REPOS" = "100" ]; then
            echo "mode=pilot-v2" >> "$GITHUB_OUTPUT"
          else
            echo "mode=formal-v2" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan shards
        id: plan
        env:
          SHARD_SIZE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pilot-bench-v2-100]') && '10' || github.event_name == 'push' && '20' || inputs.shard_size || '20' }}
          MODE: ${{ steps.manifest.outputs.mode }}
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          events = json.loads(Path("benchmark_manifest/manifest.json").read_text())
          shard_size = max(1, int(os.environ["SHARD_SIZE"]))
          n = max(1, math.ceil(len(events) / shard_size))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(list(range(n)), separators=(",", ":")) + "\n")
              f.write("shard_count=" + str(n) + "\n")
              f.write("mode=" + os.environ["MODE"] + "\n")
          print({"events": len(events), "shards": n, "mode": os.environ["MODE"]})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-v2-manifest
          path: benchmark_manifest/manifest.json
          retention-days: 30

  run-shards:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: algorithms/uco-sensor/sensor-api/pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-v2-manifest
          path: benchmark_manifest
      - name: Install UCO
        working-directory: algorithms/uco-sensor/sensor-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parsers]"
          python -m pip install scikit-learn
      - name: Run fixed-N shard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
        run: |
          mkdir -p benchmark_rows
          python algorithms/uco-sensor/paper/formal_benchmark/run_shard.py \
            --manifest benchmark_manifest/manifest.json \
            --output "benchmark_rows/rows_${SHARD}.jsonl" \
            --history-window 40 \
            --shard-index "$SHARD" \
            --shard-count "$SHARD_COUNT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-v2-rows-${{ matrix.shard }}
          path: benchmark_rows/rows_${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [prepare, run-shards]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-v2-rows-*
          path: benchmark_rows
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-v2-manifest
          path: benchmark_manifest
      - name: Install evaluator
        run: python -m pip install numpy scikit-learn
      - name: Evaluate isolated ablation
        run: |
          mkdir -p benchmark_report
          python algorithms/uco-sensor/paper/formal_benchmark/evaluate.py \
            --input "benchmark_rows/*.jsonl" \
            --json-out benchmark_report/report.json \
            --md-out benchmark_report/report.md \
            --manifest benchmark_manifest/manifest.json \
            --min-formal-repos 500 \
            --bootstrap 1000
          cat benchmark_report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: uco-benchmark-v2-${{ needs.prepare.outputs.mode }}
          path: benchmark_report/
          retention-days: 60
